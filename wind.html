<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Wind | SailingSA</title>
  <meta name="robots" content="noindex"/>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f3f4f6; font-family: Arial, Helvetica, sans-serif; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
    .card { position: relative; width: min(420px, 100%); background: #fff; border-radius: 28px; box-shadow: 0 8px 28px rgba(15, 23, 42, .08); padding: 36px 28px 28px; box-sizing: border-box; }
    .pause { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: #f3f4f6; color: #111; cursor: pointer; font-size: 15px; line-height: 44px; }
    .pause:focus { outline: 2px solid #3b82f6; }
    svg.dial { display: block; width: 78%; max-width: 280px; height: auto; margin: 0 auto; }
    .spd { margin: 14px 0 0; text-align: center; font: 700 34px/1 Arial, Helvetica, sans-serif; color: #111; }
    .spd .kn { display: block; margin-top: 4px; font: 700 12px/1 Arial, Helvetica, sans-serif; letter-spacing: 1.2px; color: #9ca3af; }
    .time { margin: 10px 0 0; text-align: center; font: 700 22px/1 Arial, Helvetica, sans-serif; color: #111; letter-spacing: 0.06em; }
    .tl { margin: 10px auto 0; width: 78%; max-width: 280px; }
    .tl-track { height: 4px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .tl-fill { height: 100%; width: 0; background: #3b82f6; border-radius: 99px; }
    .cap { margin: 10px 0 0; text-align: center; font: 600 14px/1.3 Arial, Helvetica, sans-serif; color: #6b7280; }
    .meta { margin: 6px 0 0; text-align: center; font: 700 12px/1.3 Arial, Helvetica, sans-serif; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <button class="pause" id="btn" type="button" aria-label="Pause playback">❚❚</button>
      <svg class="dial" viewBox="0 0 320 320" aria-label="Wind gauge">
        <g id="rings"></g>
        <line x1="160" y1="42" x2="160" y2="278" stroke="#e5e7eb" stroke-width="1"/>
        <line x1="42" y1="160" x2="278" y2="160" stroke="#e5e7eb" stroke-width="1"/>
        <g id="history"></g>
        <text x="160" y="28" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#9ca3af">N</text>
        <text x="306" y="166" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#9ca3af">E</text>
        <text x="160" y="312" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#9ca3af">S</text>
        <text x="14" y="166" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#9ca3af">W</text>
        <g id="playLine"></g>
        <g id="playMark"></g>
        <g id="nowLine"></g>
        <g id="nowMark"></g>
      </svg>
      <p class="spd"><span id="spd">—</span><span class="kn">KN</span></p>
      <p class="time" id="time">60 min</p>
      <div class="tl" aria-hidden="true"><div class="tl-track"><div class="tl-fill" id="tlFill"></div></div></div>
      <p class="cap" id="cap">Last hour · sped up</p>
      <p class="meta" id="meta">Zeekoevlei</p>
    </div>
  </div>
  <script>
(function () {
  var PTS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  var PLAY_MS = 36000;
  var HOLD_MS = 2000;
  var TAIL = 22;
  var R_MAX = 118;
  var R_MIN = 10;
  var KT_MAX = 17;
  var BANDS = [
    { max: 5, color: "#12b028" },
    { max: 11, color: "#2563eb" },
    { max: 17, color: "#e67e00" },
    { max: 23, color: "#7c3aed" },
    { max: 60, color: "#DC143C" }
  ];
  var q = new URLSearchParams(location.search);
  var slug = (q.get("station") || "w2s-zeekoevlei").trim();
  var at0 = parseFloat(q.get("at"));
  if (isNaN(at0)) at0 = 0;
  at0 = Math.max(0, Math.min(1, at0));
  var freeze = q.get("pause") === "1";
  var playing = !freeze;
  var samples = [];
  var t0 = 0;
  var trail = [];
  var lastU = 0;
  var ringRadii = [];
  var btn = document.getElementById("btn");
  var ringsG = document.getElementById("rings");
  var histG = document.getElementById("history");
  var playLine = document.getElementById("playLine");
  var playMark = document.getElementById("playMark");
  var nowLine = document.getElementById("nowLine");
  var nowMark = document.getElementById("nowMark");
  var spdEl = document.getElementById("spd");
  var timeEl = document.getElementById("time");
  var tlFill = document.getElementById("tlFill");
  var capEl = document.getElementById("cap");
  var metaEl = document.getElementById("meta");

  function card(deg) {
    var d = ((Number(deg) % 360) + 360) % 360;
    return PTS[Math.round(d / 22.5) % 16];
  }
  function parseMs(s) {
    var t = Date.parse(s);
    return isNaN(t) ? NaN : t;
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function lerpDeg(a, b, u) {
    var d = ((b - a + 540) % 360) - 180;
    return ((a + d * u) + 360) % 360;
  }
  function xy(deg, r) {
    var rad = deg * Math.PI / 180;
    return [160 + r * Math.sin(rad), 160 - r * Math.cos(rad)];
  }
  function fmtRemain(ms) {
    if (!samples.length) return "now";
    var end = samples[samples.length - 1].t;
    var left = end - ms;
    if (left <= 1500) return "now";
    var mins = Math.max(1, Math.round(left / 60000));
    return mins + " min";
  }

  function pick(u) {
    if (!samples.length) return null;
    var a = samples[0].t;
    var b = samples[samples.length - 1].t;
    var span = Math.max(1, b - a);
    var t = a + u * span;
    var i = 1;
    while (i < samples.length && samples[i].t < t) i += 1;
    var p = samples[i - 1];
    var n = samples[Math.min(i, samples.length - 1)];
    var du = (n.t === p.t) ? 1 : (t - p.t) / (n.t - p.t);
    du = Math.max(0, Math.min(1, du));
    return {
      kt: lerp(p.kt, n.kt, du),
      deg: lerpDeg(p.deg, n.deg, du),
      t: t
    };
  }

  function radiusForKt(kt) {
    var k = Math.max(0, Number(kt) || 0);
    var uu = Math.min(1, k / KT_MAX);
    return R_MIN + uu * (R_MAX - R_MIN);
  }

  function bandColor(kt) {
    var k = Math.max(0, Number(kt) || 0);
    var i;
    for (i = 0; i < BANDS.length; i += 1) {
      if (k < BANDS[i].max) return BANDS[i].color;
    }
    return BANDS[BANDS.length - 1].color;
  }

  function bandCeiling(kt) {
    var k = Math.max(0, Number(kt) || 0);
    var i;
    for (i = 0; i < BANDS.length; i += 1) {
      if (k <= BANDS[i].max) return BANDS[i].max;
    }
    return BANDS[BANDS.length - 1].max;
  }

  function drawRings() {
    var h = "";
    var prev = 0;
    var i;
    ringRadii = [];
    h += '<circle cx="160" cy="160" r="' + radiusForKt(0).toFixed(1) + '" fill="none" stroke="#e5e7eb" stroke-width="1.1"/>';
    for (i = 0; i < BANDS.length; i += 1) {
      var top = BANDS[i].max;
      if (top > KT_MAX) top = KT_MAX;
      if (top <= prev) continue;
      var r1 = radiusForKt(top);
      ringRadii.push(r1);
      if (top >= KT_MAX) break;
      prev = top;
    }
    for (i = 0; i < ringRadii.length; i += 1) {
      var rail = (i === railRingIndex());
      h += '<circle cx="160" cy="160" r="' + ringRadii[i].toFixed(1) + '" fill="none" stroke="' + (rail ? "#94a3b8" : "#cbd5e1") + '" stroke-width="' + (rail ? "1.7" : "1.15") + '"/>';
    }
    ringsG.innerHTML = h;
  }

  function railRingIndex() {
    if (ringRadii.length >= 3) return ringRadii.length - 3;
    if (ringRadii.length >= 2) return ringRadii.length - 2;
    return 0;
  }

  function railRadius() {
    if (!ringRadii.length) return R_MAX * 0.72;
    return ringRadii[railRingIndex()];
  }

  function radialTick(deg, r0, r1, color) {
    var a = xy(deg, r0);
    var b = xy(deg, r1);
    return '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="' + color + '" stroke-width="2.1" stroke-linecap="butt"/>';
  }

  function historyTick(pt) {
    var r = Math.max(R_MIN + 2, radiusForKt(pt.kt));
    var edges = bandEdges();
    var h = "";
    var i;
    var a;
    var b;
    for (i = 0; i < edges.length; i += 1) {
      if (r <= edges[i].r0 + 0.2) break;
      a = edges[i].r0 < R_MIN ? R_MIN : edges[i].r0;
      b = r < edges[i].r1 ? r : edges[i].r1;
      if (b > a + 0.4) h += radialTick(pt.deg, a, b, edges[i].color);
    }
    return h;
  }

  function bandEdges() {
    var edges = [];
    var prev = 0;
    var i;
    var top;
    for (i = 0; i < BANDS.length; i += 1) {
      top = BANDS[i].max > KT_MAX ? KT_MAX : BANDS[i].max;
      if (top <= prev) continue;
      edges.push({
        r0: radiusForKt(prev),
        r1: radiusForKt(top),
        color: BANDS[i].color
      });
      if (top >= KT_MAX) break;
      prev = top;
    }
    return edges;
  }

  function runArc(pts, s, e, col) {
    if (e <= s) return "";
    var d = "";
    var i;
    var p;
    for (i = s; i <= e; i += 1) {
      p = xy(pts[i].deg, pts[i].r);
      d += (i === s ? "M " : " L ") + p[0].toFixed(1) + "," + p[1].toFixed(1);
    }
    return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  }

  function bandRun(pts, s, e, band, op) {
    if (e <= s) return "";
    var inner = band.r0 < R_MIN ? R_MIN : band.r0;
    var d = "";
    var i;
    var p;
    var outer;
    for (i = s; i <= e; i += 1) {
      outer = pts[i].r;
      if (outer > band.r1) outer = band.r1;
      if (outer < inner) outer = inner;
      p = xy(pts[i].deg, outer);
      d += (i === s ? "M " : " L ") + p[0].toFixed(1) + "," + p[1].toFixed(1);
    }
    for (i = e; i >= s; i -= 1) {
      p = xy(pts[i].deg, inner);
      d += " L " + p[0].toFixed(1) + "," + p[1].toFixed(1);
    }
    d += " Z";
    return '<path d="' + d + '" fill="' + band.color + '" fill-opacity="' + op + '" stroke="none"/>';
  }

  function joinPts(deg0, deg1, kt0, kt1) {
    var turn = ((deg1 - deg0 + 540) % 360) - 180;
    var span = Math.abs(turn);
    var k0 = Math.max(0, Number(kt0) || 0);
    var k1 = Math.max(0, Number(kt1) || 0);
    if (span < 0.35 && Math.abs(k1 - k0) < 0.2) return null;
    var n = Math.max(8, Math.min(42, Math.round(span / 2) + Math.round(Math.abs(k1 - k0) * 2)));
    var pts = [];
    var i;
    var u;
    var kt;
    for (i = 0; i <= n; i += 1) {
      u = i / n;
      kt = lerp(k0, k1, u);
      pts.push({
        deg: lerpDeg(deg0, deg1, u),
        r: Math.max(R_MIN, radiusForKt(kt)),
        color: bandColor(kt)
      });
    }
    return pts;
  }

  function stamp(maxR, pts) {
    var i;
    var a;
    for (i = 0; i < pts.length; i += 1) {
      a = Math.round(pts[i].deg);
      a = ((a % 360) + 360) % 360;
      if (pts[i].r > maxR[a]) maxR[a] = pts[i].r;
    }
  }

  function stampReading(maxR, pt) {
    var a = Math.round(pt.deg);
    a = ((a % 360) + 360) % 360;
    var r = Math.max(R_MIN, radiusForKt(pt.kt));
    if (r > maxR[a]) maxR[a] = r;
  }

  function joinArcs(pts) {
    var html = "";
    var s = 0;
    var e;
    var col;
    while (s < pts.length) {
      col = pts[s].color;
      e = s;
      while (e + 1 < pts.length && pts[e + 1].color === col) e += 1;
      html += runArc(pts, s, e, col);
      s = e + 1;
    }
    return html;
  }

  function fillEnvelope(maxR, op) {
    var edges = bandEdges();
    var html = "";
    var b;
    var d;
    var s;
    var band;
    var pts;
    var wrap;
    for (b = 0; b < edges.length; b += 1) {
      band = edges[b];
      s = -1;
      wrap = [];
      for (d = 0; d < 360; d += 1) {
        if (maxR[d] > band.r0 + 0.25) {
          if (s < 0) s = d;
        } else if (s >= 0) {
          wrap.push([s, d - 1]);
          s = -1;
        }
      }
      if (s >= 0) wrap.push([s, 359]);
      if (wrap.length >= 2 && wrap[0][0] === 0 && wrap[wrap.length - 1][1] === 359) {
        wrap[0][0] = wrap.pop()[0];
      }
      for (d = 0; d < wrap.length; d += 1) {
        pts = degSpan(maxR, wrap[d][0], wrap[d][1]);
        html += bandRun(pts, 0, pts.length - 1, band, op);
      }
    }
    return html;
  }

  function degSpan(maxR, s, e) {
    var pts = [];
    var d = s;
    while (true) {
      pts.push({ deg: d, r: maxR[d] });
      if (d === e) break;
      d = (d + 1) % 360;
    }
    return pts;
  }

  function reachedCount(pt, u) {
    if (!samples.length || u <= 0) return 0;
    if (u >= 1) return samples.length;
    var n = 0;
    var i;
    for (i = 0; i < samples.length; i += 1) {
      if (samples[i].t < pt.t) n = i + 1;
      else break;
    }
    return n;
  }

  function paintHistory(pt, u) {
    var n = reachedCount(pt, u);
    if (!n) {
      histG.innerHTML = "";
      return;
    }
    var maxR = [];
    var i;
    for (i = 0; i < 360; i += 1) maxR[i] = 0;
    var ticks = "";
    var arcs = "";
    var pts;
    for (i = 0; i < n; i += 1) {
      stampReading(maxR, samples[i]);
      if (i < n - 1) {
        pts = joinPts(samples[i].deg, samples[i + 1].deg, samples[i].kt, samples[i + 1].kt);
        if (pts) stamp(maxR, pts);
      }
    }
    if (n < samples.length) {
      pts = joinPts(samples[n - 1].deg, pt.deg, samples[n - 1].kt, pt.kt);
      if (pts) {
        stamp(maxR, pts);
        arcs = joinArcs(pts);
      }
    }
    if (n === 1) ticks += historyTick(samples[0]);
    if (n < 2) ticks += historyTick(pt);
    histG.innerHTML = fillEnvelope(maxR, "0.38") + arcs + ticks;
  }

  function vectorParts(pt) {
    var r = Math.max(R_MIN + 8, radiusForKt(pt.kt));
    var rail = railRadius();
    var base = Math.max(R_MIN, r - 14);
    return {
      r: r,
      deg: pt.deg,
      tip: xy(pt.deg, r),
      left: xy(pt.deg - 10, base),
      right: xy(pt.deg + 10, base),
      dot: xy(pt.deg + 180, rail)
    };
  }

  function lineSvg(v, color) {
    return '<line x1="' + v.dot[0].toFixed(1) + '" y1="' + v.dot[1].toFixed(1) + '" x2="' + v.tip[0].toFixed(1) + '" y2="' + v.tip[1].toFixed(1) + '" stroke="' + color + '" stroke-width="1.7" stroke-dasharray="2.6 3.6" stroke-linecap="round"/>';
  }

  function markSvg(v, color) {
    return '<circle cx="' + v.dot[0].toFixed(1) + '" cy="' + v.dot[1].toFixed(1) + '" r="4.4" fill="#111"/>' +
      '<polygon points="' + v.tip[0].toFixed(1) + ',' + v.tip[1].toFixed(1) + ' ' + v.left[0].toFixed(1) + ',' + v.left[1].toFixed(1) + ' ' + v.right[0].toFixed(1) + ',' + v.right[1].toFixed(1) + '" fill="' + color + '"/>';
  }

  function draw(pt, u) {
    if (!pt || !samples.length) return;
    var nowPt = samples[samples.length - 1];
    var play = vectorParts(pt);
    var live = vectorParts(nowPt);
    trail.push(play.dot);
    if (trail.length > TAIL) trail.shift();

    var h = "";
    var i;
    for (i = 0; i < trail.length - 1; i += 1) {
      var o = (i + 1) / trail.length;
      h += '<circle cx="' + trail[i][0].toFixed(1) + '" cy="' + trail[i][1].toFixed(1) + '" r="' + (1.2 + o * 2).toFixed(1) + '" fill="#3b82f6" fill-opacity="' + (0.05 + o * 0.22).toFixed(2) + '"/>';
    }
    playLine.innerHTML = h + lineSvg(play, "#93c5fd");
    playMark.innerHTML = markSvg(play, "#3b82f6");
    nowLine.innerHTML = lineSvg(live, "#86efac");
    nowMark.innerHTML = markSvg(live, "#22c55e");
    paintHistory(pt, u);

    spdEl.textContent = (Math.round(pt.kt * 10) / 10).toFixed(1);
    timeEl.textContent = fmtRemain(pt.t);
    tlFill.style.width = (Math.max(0, Math.min(1, u)) * 100).toFixed(1) + "%";
    capEl.textContent = "Real-time Vector (" + card(pt.deg) + " " + Math.round(pt.deg) + "°)";
  }

  function tick(now) {
    if (!samples.length || !playing) return;
    if (!t0) t0 = now - at0 * PLAY_MS;
    var cycle = PLAY_MS + HOLD_MS;
    var pos = (now - t0) % cycle;
    if (pos < 0) pos = 0;
    var u;
    if (pos <= PLAY_MS) {
      u = pos / PLAY_MS;
    } else {
      u = 1;
    }
    if (u < lastU - 0.2) {
      trail = [];
    }
    lastU = u;
    window._pos = pos;
    window._u = u;
    draw(pick(u), u);
    requestAnimationFrame(tick);
  }

  btn.addEventListener("click", function () {
    playing = !playing;
    btn.textContent = playing ? "❚❚" : "▶";
    btn.setAttribute("aria-label", playing ? "Pause playback" : "Play last hour");
    if (playing) {
      t0 = performance.now() - (window._pos || (window._u || 0) * PLAY_MS);
      requestAnimationFrame(tick);
    }
  });

  function asSample(r) {
    var kt = r.wind_kt != null ? Number(r.wind_kt) : (r.wind_avg_kt != null ? Number(r.wind_avg_kt) : NaN);
    var deg = r.wind_dir_deg != null ? Number(r.wind_dir_deg) : (r.wind_dir_avg_deg != null ? Number(r.wind_dir_avg_deg) : NaN);
    var t = parseMs(r.observed_at);
    if (isNaN(kt) || isNaN(deg) || isNaN(t)) return null;
    return { t: t, kt: kt, deg: ((deg % 360) + 360) % 360, name: r.station_name || slug };
  }

  function loadHour(list) {
    var pts = (list || []).map(asSample).filter(Boolean).sort(function (a, b) { return a.t - b.t; });
    if (!pts.length) return [];
    var end = pts[pts.length - 1].t;
    return pts.filter(function (p) { return end - p.t <= 3600000; });
  }

  async function boot() {
    var urls = [
      "/api/weather/stations/" + encodeURIComponent(slug) + "/history?hours=2&_=" + Date.now()
    ];
    var i;
    for (i = 0; i < urls.length; i += 1) {
      try {
        var res = await fetch(urls[i], { cache: "no-store", credentials: "same-origin" });
        if (!res.ok) continue;
        var body = await res.json();
        var rows = body.readings || body.history || [];
        samples = loadHour(rows);
        if (samples.length) {
          var peak = 0;
          var s;
          for (s = 0; s < samples.length; s += 1) {
            if (samples[s].kt > peak) peak = samples[s].kt;
          }
          KT_MAX = bandCeiling(peak);
          drawRings();
          metaEl.textContent = (samples[0].name || "Zeekoevlei") + " · last hour sped up";
          t0 = 0;
          window._u = at0;
          if (freeze) {
            btn.textContent = "▶";
            btn.setAttribute("aria-label", "Play last hour");
            draw(pick(at0), at0);
          } else {
            requestAnimationFrame(tick);
          }
          return;
        }
      } catch (e) {}
    }
    capEl.textContent = "No last-hour wind yet";
  }
  boot();
})();
  </script>
</body>
</html>
