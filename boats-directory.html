<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boats Directory — SailingSA</title>
  <meta name="description" content="Browse all registered boats on SailingSA">
    <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/main.css">
  <style>

    /* Std/Gold main header */
    .site-header { background: #001f3f !important; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .site-header a { color: #fff !important; text-decoration: none; }
    .site-header a:hover { color: #ffcc66 !important; }
    .site-header-brand, .site-header-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; color: #fff; }
    .site-header-brand img, .site-header .logo img { height: 40px; width: auto; border-radius: 4px; display: block; }
    .site-header-nav, .nav-inline { margin-left: auto; display: flex; gap: 14px; font-size: 0.9rem; flex-wrap: wrap; align-items: center; }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f0f4f8; color: #1a1a1a; }
    .site-header { background: #001f3f; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    .site-header a { color: #fff; text-decoration: none; }
    .site-header-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; }
    .site-header-brand img { width: 36px; height: auto; border-radius: 4px; }
    .site-header-nav { margin-left: auto; display: flex; gap: 16px; font-size: 0.9rem; }
    .site-header-nav a:hover { text-decoration: underline; }
    .boats-container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .boats-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .boats-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 0 0 16px 0; }
    .boats-stats { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
    .boats-stat { text-align: center; padding: 12px 20px; background: #f0f9ff; border-radius: 8px; }
    .boats-stat-value { font-size: 1.5rem; font-weight: 700; color: #0c4a6e; }
    .boats-stat-label { font-size: 0.75rem; color: #64748b; }
    .boats-filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: center; }
    .boats-search { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; width: 220px; }
    .boats-class-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .class-btn { padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
    .class-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .class-btn.active { background: #001f3f; color: #fff; border-color: #001f3f; }
    .class-btn-count { font-size: 0.75rem; color: #64748b; margin-left: 4px; }
    .class-btn.active .class-btn-count { color: #94a3b8; }
    .boats-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .boats-table th, .boats-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .boats-table th { background: #f8fafc; font-weight: 600; color: #475569; position: sticky; top: 0; }
    .boats-table tr:hover { background: #f8fafc; }
    .boats-table a { color: #001f3f; text-decoration: none; }
    .boats-table a:hover { text-decoration: underline; }
    .family-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
    .family-ilca { background: #dbeafe; color: #1e40af; }
    .family-optimist { background: #dcfce7; color: #166534; }
    .family-other { background: #f3e8ff; color: #7c3aed; }
    .boats-pagination { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
    .boats-pagination button { padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; font-size: 0.9rem; }
    .boats-pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .boats-pagination button:hover:not(:disabled) { background: #f1f5f9; }
    .boats-loading { padding: 40px; text-align: center; color: #64748b; }
    .back-link { display: inline-block; margin-bottom: 12px; color: #001f3f; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
    .section-label { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; font-weight: 600; }
    @media (max-width: 640px) {
      .site-header { padding: 10px 12px; }
      .boats-container { padding: 12px; }
      .boats-card { padding: 14px; }
      .boats-title { font-size: 1.25rem; }
      .boats-search { width: 100%; }
      .boats-table { font-size: 0.8rem; }
      .boats-table th, .boats-table td { padding: 8px 6px; }
      .boats-stats { gap: 10px; }
      .boats-stat { padding: 10px 14px; }
      .class-btn { padding: 6px 10px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-header-brand" title="Home">
      <img src="/assets/logos/sailingsa-logo.png" alt="SailingSA">
      <span>SailingSA</span>
    </a>
    <nav class="site-header-nav" aria-label="Main">
      <a href="/">Home</a>
      <a href="/sailors">Sailors</a>
      <a href="/regattas">Regattas</a>
      <a href="/classes">Classes</a>
      <a href="/clubs">Clubs</a>
      <a href="/boat-names">Boats</a>
      <a href="/events">Events</a>
      <a href="/named-events">Named Events</a>
      <a href="/stats">Statistics</a>
      <a href="/about">About</a>
    </nav>
  </header>
  <main class="boats-container">
    <a href="/" class="back-link">← Home</a>
    <div class="boats-card">
      <h1 class="boats-title">Boats Directory</h1>
      <div id="boats-stats" class="boats-stats"><div class="boats-loading">Loading...</div></div>
      <div class="boats-filters">
        <input type="text" id="boats-search" class="boats-search" placeholder="Search sail number, name...">
      </div>
      <div class="section-label">Filter by Class</div>
      <div id="boats-class-buttons" class="boats-class-buttons">
        <button class="class-btn active" data-class="">All</button>
      </div>
      <div id="boats-list"><div class="boats-loading">Loading boats...</div></div>
      <div id="boats-pagination" class="boats-pagination"></div>
    </div>
  </main>
  <script>
  (function(){
    var stats = document.getElementById('boats-stats');
    var list = document.getElementById('boats-list');
    var pagination = document.getElementById('boats-pagination');
    var searchInput = document.getElementById('boats-search');
    var classButtons = document.getElementById('boats-class-buttons');
    var page = 1, limit = 50, debounce = null, currentClass = '', classesLoaded = false;
    function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function familyClass(f) {
      if (!f) return '';
      var fl = f.toLowerCase();
      if (fl.indexOf('ilca') >= 0 || fl.indexOf('laser') >= 0) return 'family-ilca';
      if (fl.indexOf('optimist') >= 0) return 'family-optimist';
      return 'family-other';
    }
    function loadClasses() {
      fetch('/api/classes-with-boats').then(function(r) { return r.json(); }).then(function(classes) {
        if (!classes || classes.length === 0) return;
        classes.forEach(function(c) {
          var btn = document.createElement('button');
          btn.className = 'class-btn';
          btn.setAttribute('data-class', c.class_name);
          btn.innerHTML = esc(c.class_name) + '<span class="class-btn-count">(' + c.boat_count + ')</span>';
          classButtons.appendChild(btn);
        });
        classesLoaded = true;
      }).catch(function() {});
    }
    function load() {
      var q = searchInput.value.trim();
      var url = '/admin/api/boats-audit?page=' + page + '&limit=' + limit;
      if (q) url += '&q=' + encodeURIComponent(q);
      if (currentClass) url += '&class_name=' + encodeURIComponent(currentClass);
      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        var s = data.stats;
        stats.innerHTML = '<div class="boats-stat"><div class="boats-stat-value">' + s.total_boats + '</div><div class="boats-stat-label">Boats</div></div>' +
          '<div class="boats-stat"><div class="boats-stat-value">' + s.results_linked + '</div><div class="boats-stat-label">Results Linked</div></div>';
        if (!data.boats || data.boats.length === 0) {
          list.innerHTML = '<p style="padding:20px;color:#64748b;">No boats found.</p>';
        } else {
          var html = '<table class="boats-table"><thead><tr><th>Sail #</th><th>Name</th><th>Class</th><th>Family</th><th>Results</th></tr></thead><tbody>';
          data.boats.forEach(function(b) {
            var fam = b.hull_family ? '<span class="family-tag ' + familyClass(b.hull_family) + '">' + esc(b.hull_family) + '</span>' : '-';
            html += '<tr><td><a href="/boat/' + b.boat_id + '">' + esc(b.sail_number || '-') + '</a></td><td>' + esc(b.boat_name || '-') + '</td><td>' + esc(b.class_name || '-') + '</td><td>' + fam + '</td><td>' + (b.result_count || 0) + '</td></tr>';
          });
          html += '</tbody></table>';
          list.innerHTML = html;
        }
        var p = data.pagination;
        pagination.innerHTML = '<span>Page ' + p.page + ' of ' + p.pages + '</span>' +
          '<button ' + (p.page <= 1 ? 'disabled' : '') + ' onclick="window._boatsGo(' + (p.page - 1) + ')">Prev</button>' +
          '<button ' + (p.page >= p.pages ? 'disabled' : '') + ' onclick="window._boatsGo(' + (p.page + 1) + ')">Next</button>';
      }).catch(function(e) {
        list.innerHTML = '<p style="color:red;">Error loading boats.</p>';
      });
    }
    window._boatsGo = function(p) { page = p; load(); };
    searchInput.addEventListener('input', function() {
      clearTimeout(debounce);
      debounce = setTimeout(function() { page = 1; load(); }, 300);
    });
    classButtons.addEventListener('click', function(e) {
      var btn = e.target.closest('.class-btn');
      if (!btn) return;
      classButtons.querySelectorAll('.class-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentClass = btn.getAttribute('data-class') || '';
      page = 1;
      load();
    });
    loadClasses();
    load();
  })();
  </script>
</body>
</html>
