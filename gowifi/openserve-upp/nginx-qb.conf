# Included from /home/user-data/www/gowifi.co.za.conf
location = /legal/qb-start {
	proxy_pass http://127.0.0.1:8799/start;
	proxy_set_header Host $host;
}
location = /legal/qb-token {
	proxy_pass http://127.0.0.1:8799/token;
	proxy_set_header Host $host;
}
location = /legal/qb-status {
	proxy_pass http://127.0.0.1:8799/status;
	proxy_set_header Host $host;
}
location = /legal/qb-callback.html {
	proxy_pass http://127.0.0.1:8799/callback;
	proxy_set_header Host $host;
}
