<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoWifi · Invoices</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<style>
:root {
  --bg:#ffffff; --card:#ffffff; --line:#d5deea; --text:#0b1f44; --muted:#4a5d7a;
  --ok:#1a8f4a; --bad:#c62828; --warn:#c77800; --acc:#123a7a; --pad:16px;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
a { color:var(--acc); }
header.app {
  position:sticky; top:0; z-index:5;
  background:#fff; border-bottom:1px solid var(--line);
  padding:12px var(--pad) 12px;
}
header.app h1 { margin:0; font-size:22px; color:var(--acc); }
header.app .sub { color:var(--muted); font-size:13px; margin-top:2px; }
header.app a.back { display:inline-block; color:var(--acc); font-size:14px; min-height:40px; line-height:40px; margin-right:14px; }
.search {
  width:100%; margin-top:10px; padding:12px 14px; font:16px/1.3 inherit;
  color:var(--text); background:#fff; border:1px solid var(--line); border-radius:10px;
}
.search:focus { outline:2px solid var(--acc); border-color:var(--acc); }
main { padding:14px var(--pad) 32px; max-width:980px; margin:0 auto; }
.counts { color:var(--muted); font-size:13px; margin:0 0 12px; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--acc); margin:18px 0 8px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 14px 12px; color:var(--text);
}
.name { font-weight:700; font-size:17px; color:var(--acc); }
.meta { color:var(--muted); font-size:13px; margin-top:4px; }
.row { margin-top:8px; }
.k { font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.v { margin-top:1px; }
.amt { font-weight:700; }
.amt.query { color:var(--warn); }
.amt.monthly { color:var(--acc); }
.empty { color:var(--muted); padding:24px 0; }
.err { color:#8a1212; background:#fdecec; padding:12px; border-radius:10px; }
.note { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
</style>
</head>
<body>
<header class="app">
  <a class="back" href="/dash/#/">← Home</a>
  <a class="back" href="/dash/clients.html">Clients</a>
  <a class="back" href="/dash/accounts.html">Detailed</a>
  <h1>Invoices</h1>
  <div class="sub">Monthly line rental · queries need the full invoice</div>
  <input class="search" id="q" type="search" placeholder="Search name, invoice number, amount" autocomplete="off">
</header>
<main>
  <div id="note" class="note"></div>
  <div class="counts" id="counts"></div>
  <h2>Need full invoice</h2>
  <div class="grid" id="queries">Loading…</div>
  <h2>Monthly line rental</h2>
  <div class="grid" id="monthly"></div>
</main>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const money = v => v==null||v==="" ? "—" : "R"+Number(v).toFixed(2);
const hit = (row, q) => !q || (row.search||"").includes(q);
function card(r, kind){
  return `<article class="card" data-search="${esc(r.search||"")}">
    <div class="name">${esc(r.name||"—")}</div>
    <div class="meta">Invoice ${esc(r.number||"—")} · ${esc(r.date||"—")}${r.closed?" · closed":""}</div>
    <div class="row"><div class="k">Amount</div><div class="v amt ${kind}">${esc(money(r.amount))}</div></div>
    <div class="row"><div class="k">${kind==="query"?"Need":"What"}</div><div class="v">${esc(r.why||r.what||"—")}</div></div>
    ${r.memo?`<div class="row"><div class="k">Memo</div><div class="v">${esc(r.memo)}</div></div>`:""}
    ${r.monthly_now!=null&&kind==="query"?`<div class="meta">Known monthly rental ${esc(money(r.monthly_now))}</div>`:""}
    ${r.access||r.pay?`<div class="meta">${esc(r.access||"")} · ${esc(r.pay||"")}</div>`:""}
  </article>`;
}
function rateCard(c){
  const hist = (c.history||[]).map(n=>"R"+Number(n).toFixed(0)).join(" → ");
  return `<article class="card" data-search="${esc(c.search||"")}">
    <div class="name">${esc(c.name||"—")}</div>
    <div class="meta">${esc(c.access||"")} · ${esc(c.pay||"")}${c.discount?" · discount":""}${c.closed?" · closed":""}</div>
    <div class="row"><div class="k">Monthly now</div><div class="v amt monthly">${c.monthly==null?"—":esc(money(c.monthly))}</div></div>
    <div class="row"><div class="k">What</div><div class="v">${esc(c.what||"Monthly line rental")}${hist?`<div class="meta">Was ${esc(hist)}</div>`:""}</div></div>
    <div class="meta">${c.monthly_count||0} monthly · ${c.query_count||0} query · ${esc(c.first||"")} → ${esc(c.last||"")}</div>
    ${c.address?`<div class="meta">${esc(c.address)}</div>`:""}
    ${c.phone||c.email?`<div class="meta">${esc(c.phone||"")}${c.phone&&c.email?" · ":""}${esc(c.email||"")}</div>`:""}
    ${c.b_number?`<div class="meta">${esc(c.b_number)}</div>`:""}
  </article>`;
}
function paint(pack){
  const q = ($("#q").value||"").trim().toLowerCase();
  const queries = (pack.queries||[]).filter(r=>hit(r,q));
  const monthly = (pack.customers||[]).filter(c=>!c.closed && (c.monthly_count||0)>0).filter(c=>hit(c,q));
  $("#counts").textContent = q
    ? `${queries.length} queries · ${monthly.length} monthly accounts`
    : `${pack.query_count||0} need full invoice · ${pack.monthly_count||0} monthly of ${pack.count||0}`;
  $("#queries").innerHTML = queries.map(r=>card(r,"query")).join("") || `<p class="empty">No queries match.</p>`;
  $("#monthly").innerHTML = monthly.map(rateCard).join("") || `<p class="empty">No monthly accounts match.</p>`;
}
fetch("accounts.json?v="+Date.now(),{credentials:"same-origin", cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("accounts.json "+r.status); return r.json(); })
  .then(data=>{
    const pack = data.invoice_list || (data.books&&data.books.invoice_list) || {};
    const addSearch = row => {
      row.search = [row.name,row.qb_name,row.number,row.amount,row.why,row.what,row.memo,row.address,row.phone,row.email,row.b_number].filter(Boolean).join(" ").toLowerCase();
      return row;
    };
    (pack.queries||[]).forEach(addSearch);
    (pack.customers||[]).forEach(addSearch);
    $("#note").textContent = pack.note || "Repeating mid-month amounts are monthly line rental. Odd amounts need the full invoice.";
    paint(pack);
    $("#q").addEventListener("input", ()=>paint(pack));
  })
  .catch(e=>{ $("#queries").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
</script>
</body>
</html>
