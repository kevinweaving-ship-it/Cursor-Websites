<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoWifi · Invoices</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<style>
:root {
  --bg:#ffffff; --card:#ffffff; --line:#d5deea; --text:#0b1f44; --muted:#4a5d7a;
  --ok:#1a8f4a; --bad:#c62828; --warn:#c77800; --acc:#123a7a; --pad:16px;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
a { color:var(--acc); }
header.app {
  position:sticky; top:0; z-index:5;
  background:#fff; border-bottom:1px solid var(--line);
  padding:12px var(--pad) 12px;
}
header.app h1 { margin:0; font-size:22px; color:var(--acc); }
header.app .sub { color:var(--muted); font-size:13px; margin-top:2px; }
header.app a.back { display:inline-block; color:var(--acc); font-size:14px; min-height:40px; line-height:40px; margin-right:14px; }
.search {
  width:100%; margin-top:10px; padding:12px 14px; font:16px/1.3 inherit;
  color:var(--text); background:#fff; border:1px solid var(--line); border-radius:10px;
}
.search:focus { outline:2px solid var(--acc); border-color:var(--acc); }
main { padding:14px var(--pad) 32px; max-width:980px; margin:0 auto; }
.counts { color:var(--muted); font-size:13px; margin:0 0 12px; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--acc); margin:18px 0 8px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; margin:0 0 10px;
}
.meta { color:var(--muted); font-size:13px; margin-top:4px; }
.empty { color:var(--muted); padding:24px 0; }
.err { color:#8a1212; background:#fdecec; padding:12px; border-radius:10px; }
.scroll { overflow:auto; }
table.inv { width:100%; border-collapse:collapse; font-size:13px; }
table.inv th {
  text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase;
  letter-spacing:.04em; font-weight:700; padding:6px 6px 8px 0; border-bottom:1px solid var(--line);
}
table.inv td { padding:7px 8px 7px 0; border-bottom:1px solid var(--line); vertical-align:top; }
table.inv tr:last-child td { border-bottom:0; }
.num { text-align:right; white-space:nowrap; }
.name { font-weight:650; }
</style>
</head>
<body>
<header class="app">
  <a class="back" href="/dash/#/">← Home</a>
  <a class="back" href="/dash/clients.html">Clients</a>
  <a class="back" href="/dash/accounts.html">Detailed</a>
  <h1>Invoices</h1>
  <div class="sub">From the invoice table · click through to the statement</div>
  <input class="search" id="q" type="search" placeholder="Search number, client, what, amount" autocomplete="off">
</header>
<main>
  <div class="counts" id="counts"></div>
  <h2>Invoices</h2>
  <div class="card scroll" id="list">Loading…</div>
</main>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const money = v => v==null||v==="" ? "—" : "R"+Number(v).toFixed(2);
const stripUncapped = s => {
  const raw = String(s||"");
  const cancel = /cancellation month/i.test(raw);
  let out = raw.replace(/\s*[-–—]?\s*uncapped\b[\s\S]*/i, "").replace(/\s+[-–—/]\s*$/, "").trim();
  if (cancel && !/cancellation month/i.test(out)) out = out ? out + " — cancellation month" : "cancellation month";
  return out;
};
const tableInvoices = data => {
  const byN = {};
  const hist = ((data.books||{}).history||{}).invoices || [];
  const drafts = ((data.books||{}).customer_invoices||{}).rows || [];
  hist.concat(drafts).forEach(x => {
    const n = String(x.invoice_number||"");
    if (!n) return;
    const row = Object.assign({}, x);
    delete row.statement;
    byN[n] = row;
  });
  return Object.keys(byN).sort((a,b)=>{
    const da = String(byN[a].invoice_date||"");
    const db = String(byN[b].invoice_date||"");
    if (da!==db) return db.localeCompare(da);
    return Number(b)-Number(a);
  }).map(k => byN[k]);
};
function paint(rows){
  const q = ($("#q").value||"").trim().toLowerCase();
  const hit = rows.filter(r => {
    if (!q) return true;
    const blob = [r.invoice_number, r.customer, r.description, r.amount, r.invoice_date].filter(Boolean).join(" ").toLowerCase();
    return blob.includes(q);
  });
  $("#counts").textContent = q ? `${hit.length} of ${rows.length}` : `${rows.length} invoices`;
  $("#list").innerHTML = hit.length ? `<table class="inv">
    <thead><tr><th>#</th><th>Date</th><th>Client</th><th>What</th><th class="num">Amount</th></tr></thead>
    <tbody>${hit.map(r=>`<tr>
      <td class="num"><a href="/dash/invoice.html?n=${esc(r.invoice_number)}">${esc(r.invoice_number)}</a></td>
      <td>${esc(r.invoice_date||"—")}</td>
      <td><div class="name">${esc(r.customer||"—")}</div></td>
      <td>${esc(stripUncapped(r.description||""))}</td>
      <td class="num">${esc(money(r.amount))}</td>
    </tr>`).join("")}</tbody>
  </table>` : `<p class="empty">No invoices match.</p>`;
}
fetch("accounts.json?v="+Date.now(),{credentials:"same-origin", cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("accounts.json "+r.status); return r.json(); })
  .then(data=>{
    const rows = tableInvoices(data);
    paint(rows);
    $("#q").addEventListener("input", ()=>paint(rows));
  })
  .catch(e=>{ $("#list").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
</script>
</body>
</html>
