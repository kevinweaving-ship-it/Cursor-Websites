<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoWifi · UniFi</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<style>
:root {
  --bg:#ffffff; --card:#ffffff; --line:#d5deea; --text:#0b1f44; --muted:#4a5d7a;
  --ok:#1a8f4a; --bad:#c62828; --warn:#c77800; --acc:#123a7a; --pad:16px;
  --ml:844px;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
a { color:var(--acc); text-decoration:none; }
a:hover { text-decoration:underline; }
header.app {
  position:sticky; top:0; z-index:5;
  background:#fff; border-bottom:1px solid var(--line);
  padding:10px max(var(--pad), env(safe-area-inset-right)) 12px max(var(--pad), env(safe-area-inset-left));
}
.bar { display:flex; flex-direction:column; gap:6px; }
header.app h1 { margin:0; font-size:22px; color:var(--acc); }
header.app .sub { color:var(--muted); font-size:13px; margin-top:2px; }
.nav { display:flex; flex-wrap:wrap; gap:4px 16px; }
.nav a { color:var(--acc); font-size:14px; min-height:40px; display:inline-flex; align-items:center; }
main {
  padding:12px max(var(--pad), env(safe-area-inset-right)) 32px max(var(--pad), env(safe-area-inset-left));
  width:100%;
}
.banner {
  margin:0 0 12px; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
  background:#fff8e8; color:var(--text);
}
.banner.ok { background:#eef8f1; }
.banner strong { color:var(--warn); }
.banner.ok strong { color:var(--ok); }
.v.ok { color:var(--ok); font-weight:700; }
.v.bad { color:var(--bad); font-weight:700; }
.counts { color:var(--muted); font-size:13px; margin:0 0 10px; }
h2 {
  margin:18px 0 8px; font-size:13px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--acc);
}
.card {
  width:100%; margin:0 0 10px; padding:12px 14px;
  background:var(--card); color:var(--text);
  border:1px solid var(--line); border-radius:12px;
}
.name { font-weight:700; font-size:16px; color:var(--acc); }
.meta { color:var(--muted); font-size:13px; margin-top:4px; }
.k { font-size:11px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); }
.v { margin-top:2px; }
.row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.share {
  display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:10px;
  padding-top:10px; border-top:1px solid var(--line);
}
.share label {
  display:inline-flex; align-items:center; gap:8px; min-height:40px;
  font-size:14px; font-weight:700; color:var(--acc); cursor:pointer;
}
.share input { width:18px; height:18px; accent-color:var(--acc); }
.empty { color:var(--muted); padding:20px 0; }
a.card { display:block; color:inherit; }
a.card:hover { text-decoration:none; border-color:var(--acc); }
.grid3 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
table.dev { width:100%; border-collapse:collapse; font-size:13px; }
table.dev th {
  text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase;
  letter-spacing:.04em; font-weight:700; padding:6px 6px 8px 0; border-bottom:1px solid var(--line);
}
table.dev td { padding:7px 8px 7px 0; border-bottom:1px solid var(--line); vertical-align:top; }
table.dev tr:last-child td { border-bottom:0; }
table.dev td.ok { color:var(--ok); font-weight:700; }
table.dev td.bad { color:var(--bad); font-weight:700; }
.gauges { display:flex; flex-direction:column; gap:0; }
.gauge-pair { display:flex; justify-content:space-around; gap:8px; margin-top:12px; }
.dial { position:relative; width:148px; height:148px; flex:0 0 auto; }
.dial-ring {
  position:absolute; inset:0; border-radius:50%;
  background: conic-gradient(var(--fill, var(--ok)) calc(var(--pct) * 1%), var(--line) 0);
}
.dial-ring::after {
  content:""; position:absolute; inset:16px; border-radius:50%; background:#fff;
}
.dial-read {
  position:absolute; inset:16px; z-index:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:4px;
}
.dial-num { font-size:22px; font-weight:700; color:var(--acc); line-height:1.1; }
@media (min-width: 600px) {
  header.app, main {
    width:100%; max-width:var(--ml);
    margin-left:auto; margin-right:auto;
  }
  header.app { padding:12px 20px; }
  .bar { flex-direction:row; align-items:flex-end; justify-content:space-between; gap:16px; }
  main { padding:14px 20px 36px; }
}
</style>
</head>
<body>
<header class="app">
  <div class="bar">
    <div>
      <h1 id="title">UniFi</h1>
      <div class="sub" id="sub">Own dash · click a router for its child URL</div>
    </div>
    <nav class="nav">
      <a href="/dash/unifi.html" id="back">UniFi</a>
      <a href="/dash/#/">Home</a>
      <a href="/dash/clients.html">Clients</a>
      <a href="/dash/accounts.html">Accounts</a>
    </nav>
  </div>
</header>
<main>
  <div class="banner" id="banner">Loading Site Manager…</div>
  <div class="counts" id="counts"></div>
  <h2 id="section">Site Manager hosts</h2>
  <div id="list"></div>
  <h2 id="share-head">Share</h2>
  <div class="card">
    <div class="meta">Ticks stay on this browser. Landing does not read them yet.</div>
    <div class="meta" id="share-note"></div>
  </div>
</main>
<script>
const KEY = "gowifi-unifi-share";
let HOSTS = [];
let CURRENT = null;
let CONNECTOR = null;

function loadShare() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }
  catch { return {}; }
}
function saveShare(share) {
  localStorage.setItem(KEY, JSON.stringify(share));
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}
function statusLabel(state) {
  if (state === "connected") return { text:"Online", cls:"ok" };
  if (state === "disconnected") return { text:"Offline", cls:"bad" };
  return { text: state || "unknown", cls:"" };
}
function wanStatus(s) {
  const low = String(s || "").toLowerCase();
  if (low === "online" || low === "up") return { text:"Online", cls:"ok" };
  if (low === "offline" || low === "down") return { text:"Offline", cls:"bad" };
  return { text: s || "unknown", cls:"" };
}
function mbpsText(n) {
  if (n == null || n === "") return "—";
  const v = Number(n);
  if (!Number.isFinite(v)) return "—";
  return v.toFixed(2);
}
function fillFor(pct, statusCls) {
  if (pct == null || pct === "") return { pct:0, fill:"var(--line)" };
  const p = Math.max(0, Math.min(100, Number(pct)));
  let fill = "var(--ok)";
  if (statusCls === "bad") fill = "var(--bad)";
  else if (p >= 80) fill = "var(--warn)";
  return { pct:p, fill };
}
function paintDial(used, cap, pct, dir, statusCls) {
  const hasCap = cap != null && cap !== "";
  const fill = fillFor(hasCap ? pct : null, statusCls);
  const capTxt = hasCap
    ? ("of " + cap + " · " + (pct != null && pct !== "" ? Number(pct).toFixed(1) + "%" : "—"))
    : "capacity not in API";
  return `<div class="dial">
    <div class="dial-ring" style="--pct:${fill.pct};--fill:${fill.fill}"></div>
    <div class="dial-read">
      <div class="dial-num">${esc(mbpsText(used))}</div>
      <div class="k">Mbps ${esc(dir)}</div>
      <div class="meta">${esc(capTxt)}</div>
    </div>
  </div>`;
}
function paintGauges(gauges) {
  if (!gauges || !gauges.length) return "";
  return `<h2>WAN gauges</h2><div class="gauges">` + gauges.map(g => {
    const st = wanStatus(g.status);
    const bits = [
      g.kind === "fibre" ? "fibre" : g.kind === "lte" ? "backup LTE" : "",
      g.failover_active === true ? "failed over" : g.failover_active === false ? "standby" : "",
      g.operator,
      g.signal,
      g.ip,
      g.latency_ms != null ? (Number(g.latency_ms) + " ms") : "",
      g.availability != null ? ("avail " + Number(g.availability).toFixed(1) + "%") : ""
    ].filter(Boolean);
    return `<article class="card gauge">
      <div class="row">
        <div>
          <div class="name">${esc(g.name)}</div>
          ${bits.length ? `<div class="meta">${esc(bits.join(" · "))}</div>` : ""}
        </div>
        <div>
          <div class="k">Status</div>
          <div class="v ${st.cls}">${esc(st.text)}</div>
        </div>
      </div>
      <div class="gauge-pair">
        ${paintDial(g.used_down_mbps, g.capacity_down_mbps, g.used_down_pct, "down", st.cls)}
        ${paintDial(g.used_up_mbps, g.capacity_up_mbps, g.used_up_pct, "up", st.cls)}
      </div>
    </article>`;
  }).join("") + `</div>`;
}

function childParam() {
  return new URLSearchParams(location.search).get("h") || "";
}
function childHref(h) {
  return "/dash/unifi.html?h=" + encodeURIComponent(h.slug || h.id);
}
function paintList() {
  const share = loadShare();
  const live = HOSTS.filter(Boolean);
  document.getElementById("title").textContent = "UniFi";
  document.getElementById("sub").textContent = "Own dash · click a router for its child URL";
  document.getElementById("section").textContent = "Site Manager hosts";
  document.getElementById("counts").textContent = live.length
    ? (live.length + " hosts · " + live.filter(h => h.state==="connected").length + " online · " + live.filter(h => h.state==="disconnected").length + " offline · UISP radios stay on Home")
    : "No hosts";
  document.getElementById("list").innerHTML = live.map(h => {
    const landing = !!(share[h.id] && share[h.id].landing);
    const st = statusLabel(h.state);
    const bits = [h.hardware, h.isp, (h.apps||[]).join(" · ")].filter(Boolean);
    const clients = [];
    if (h.wifi_clients != null) clients.push(h.wifi_clients + " wifi");
    if (h.wired_clients != null) clients.push(h.wired_clients + " wired");
    const dev = h.devices || {};
    const extra = [];
    if (dev.devices) extra.push(dev.online + "/" + dev.devices + " devices online");
    if (h.wan_uptime != null) extra.push("WAN uptime " + Number(h.wan_uptime).toFixed(1) + "%");
    if (h.device_state === "updateAvailable") extra.push("update available");
    return `<article class="card" data-id="${esc(h.id)}">
      <a class="row" href="${esc(childHref(h))}">
        <div>
          <div class="name">${esc(h.name)}</div>
          <div class="meta">${esc(bits.join(" · "))}${clients.length ? " · " + esc(clients.join(" · ")) : ""}</div>
          ${extra.length ? `<div class="meta">${esc(extra.join(" · "))}</div>` : ""}
        </div>
        <div>
          <div class="k">Status</div>
          <div class="v ${st.cls}">${esc(st.text)}</div>
        </div>
      </a>
      <div class="share">
        <label><input type="checkbox" data-share="landing" ${landing ? "checked" : ""}> Landing</label>
      </div>
    </article>`;
  }).join("") || `<div class="empty">No hosts from UniFi.</div>`;
  const n = live.filter(h => share[h.id] && share[h.id].landing).length;
  document.getElementById("share-note").textContent =
    n ? (n + " ticked for landing — not published") : "Nothing ticked";
}
function paintChild(h, connector) {
  const share = loadShare();
  const landing = !!(share[h.id] && share[h.id].landing);
  const st = statusLabel(h.state);
  document.title = "GoWifi · " + (h.name || "UniFi");
  document.getElementById("title").textContent = h.name || "UniFi";
  document.getElementById("sub").textContent = "Child URL · data from this machine";
  document.getElementById("section").textContent = "This machine";
  document.getElementById("counts").textContent = childHref(h);
  const fields = [
    ["Status", st.text, st.cls],
    ["Hardware", h.hardware || h.shortname || ""],
    ["Firmware", h.firmware || ""],
    ["ISP", h.isp || ""],
    ["Timezone", h.timezone || ""],
    ["Apps", (h.apps || []).join(" · ")],
    ["Wi‑Fi clients", h.wifi_clients != null ? String(h.wifi_clients) : ""],
    ["Wired clients", h.wired_clients != null ? String(h.wired_clients) : ""],
  ].filter(r => r[1]);
  const gaugesHtml = paintGauges(h.gauges || []);
  const wans = gaugesHtml ? "" : (h.wans || []).map(w => {
    const bits = [w.isp, w.external_ip, w.uptime != null ? ("uptime " + Number(w.uptime).toFixed(1) + "%") : "", w.port_up === true ? "port up" : w.port_up === false ? "port down" : ""].filter(Boolean);
    return `<div class="card"><div class="k">${esc(w.name)}</div><div class="v">${esc(bits.join(" · "))}</div></div>`;
  }).join("");
  const rows = ((h.devices || {}).rows) || [];
  const table = rows.length
    ? `<div class="card"><table class="dev"><thead><tr><th>Device</th><th>Model</th><th>Status</th><th>Version</th><th>IP</th></tr></thead><tbody>` +
      rows.map(d => `<tr><td>${esc(d.name)}${d.is_console ? " · console" : ""}</td><td>${esc(d.model)}</td><td class="${d.status==="online"?"ok":d.status==="offline"?"bad":""}">${esc(d.status)}</td><td>${esc(d.version)}</td><td>${esc(d.ip)}</td></tr>`).join("") +
      `</tbody></table></div>`
    : `<div class="empty">No devices on this host.</div>`;
  const conn = connector && connector.ok
    ? `<div class="meta">Network app ${esc(connector.application_version || "")}</div>`
    : (connector && connector.error ? `<div class="meta">Connector: ${esc(connector.error)}</div>` : "");
  const gaugesErr = connector && connector.gauges_error
    ? `<div class="meta">Gauges: ${esc(connector.gauges_error)}</div>` : "";
  document.getElementById("list").innerHTML =
    `<div class="card" data-id="${esc(h.id)}">
      <div class="grid3">${fields.map(f => `<div><div class="k">${esc(f[0])}</div><div class="v ${f[2]||""}">${esc(f[1])}</div></div>`).join("")}</div>
      ${conn}${gaugesErr}
      <div class="share"><label><input type="checkbox" data-share="landing" ${landing ? "checked" : ""}> Landing</label></div>
    </div>` +
    gaugesHtml +
    (wans ? `<h2>WAN</h2>${wans}` : "") +
    `<h2>Devices</h2>${table}`;
  document.getElementById("share-note").textContent =
    landing ? "Ticked for landing — not published" : "Nothing ticked";
}

document.getElementById("list").addEventListener("change", ev => {
  const input = ev.target.closest("input[data-share]");
  if (!input) return;
  const card = input.closest("[data-id]");
  if (!card) return;
  const share = loadShare();
  const id = card.getAttribute("data-id");
  share[id] = share[id] || {};
  share[id][input.getAttribute("data-share")] = input.checked;
  saveShare(share);
  if (CURRENT) paintChild(CURRENT, CONNECTOR);
  else paintList();
});

const want = childParam();
const api = "/dash/api/unifi" + (want ? ("?h=" + encodeURIComponent(want)) : "");
fetch(api, { credentials:"same-origin", cache:"no-store" })
  .then(r => r.json().then(data => ({ ok:r.ok, data })))
  .then(({ data }) => {
    const banner = document.getElementById("banner");
    if (!data || !data.live || (want && !data.host)) {
      banner.className = "banner";
      banner.innerHTML = "<strong>Not live from UniFi.</strong> " + esc(data && data.error || "No summary");
      HOSTS = [];
      if (!want) paintList();
      return;
    }
    banner.className = "banner ok";
    banner.innerHTML = "<strong>Live from this machine.</strong> as at " + esc(data.as_at || "");
    if (want) {
      CURRENT = data.host;
      CONNECTOR = data.connector || null;
      paintChild(CURRENT, CONNECTOR);
      return;
    }
    banner.innerHTML = "<strong>Live from Site Manager.</strong> as at " + esc(data.as_at || "") + ". Click a router.";
    HOSTS = data.hosts || [];
    paintList();
  })
  .catch(err => {
    document.getElementById("banner").innerHTML = "<strong>Not live from UniFi.</strong> " + esc(err.message || err);
    HOSTS = [];
    if (!want) paintList();
  });
</script>
</body>
</html>
