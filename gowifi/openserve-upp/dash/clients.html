<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoWifi · Clients</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<style>
:root {
  --bg:#ffffff; --card:#ffffff; --line:#d5deea; --text:#0b1f44; --muted:#4a5d7a;
  --ok:#1a8f4a; --bad:#c62828; --warn:#c77800; --acc:#123a7a; --pad:16px;
  --ml:844px;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
a { color:var(--acc); text-decoration:none; }
a:hover { text-decoration:underline; }

/* MP first — portrait phone. Full width. */
header.app {
  position:sticky; top:0; z-index:5;
  background:#fff; border-bottom:1px solid var(--line);
  padding:10px max(var(--pad), env(safe-area-inset-right)) 12px max(var(--pad), env(safe-area-inset-left));
}
.bar { display:flex; flex-direction:column; gap:6px; }
header.app h1 { margin:0; font-size:22px; color:var(--acc); }
header.app .sub { color:var(--muted); font-size:13px; margin-top:2px; }
.nav { display:flex; flex-wrap:wrap; gap:4px 16px; }
.nav a { color:var(--acc); font-size:14px; min-height:40px; display:inline-flex; align-items:center; }
.search {
  width:100%; margin-top:10px; padding:12px 14px; font:16px/1.3 inherit;
  color:var(--text); background:#fff; border:1px solid var(--line); border-radius:10px;
}
.search:focus { outline:2px solid var(--acc); border-color:var(--acc); }
main {
  padding:12px max(var(--pad), env(safe-area-inset-right)) 32px max(var(--pad), env(safe-area-inset-left));
  width:100%;
}
.counts { color:var(--muted); font-size:13px; margin:0 0 10px; }
.cat-card {
  width:100%; margin:0 0 16px; padding:12px;
  background:#e8eef6; border:1px solid var(--line); border-radius:14px;
}
.cat-card h2 {
  margin:0 0 10px; font-size:15px; font-weight:700; color:var(--acc);
}
.cat-card h2 .n { color:var(--muted); font-weight:500; font-size:13px; }
.cat-list { display:flex; flex-direction:column; gap:10px; }
.card {
  width:100%; background:var(--card); color:var(--text);
  border:1px solid var(--line); border-radius:12px;
}
.head {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; padding:12px 14px; background:transparent; border:0; color:inherit;
  font:inherit; text-align:left; cursor:pointer; min-height:48px;
}
.head:focus { outline:2px solid var(--acc); outline-offset:-2px; }
.head-right { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.head .kind { display:none; color:var(--muted); font-size:13px; white-space:nowrap; }
.name { font-weight:700; font-size:16px; color:var(--acc); display:flex; align-items:center; gap:8px; min-width:0; }
.bal { font-size:13px; font-weight:700; white-space:nowrap; text-align:right; }
.meta { color:var(--muted); font-size:13px; font-weight:400; }
.detail { border-top:1px solid var(--line); }
.band {
  display:flex; flex-direction:column; gap:8px;
  width:100%; padding:10px 14px;
}
.band + .band { border-top:1px solid var(--line); }
.field { display:flex; flex-direction:column; gap:2px; min-width:0; width:100%; }
.k { font-size:11px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); }
.v { min-width:0; overflow-wrap:anywhere; }
.dot {
  width:12px; height:12px; border-radius:50%; display:inline-block; flex:0 0 12px;
  box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--line);
}
.dot.active { background:var(--ok); }
.dot.issue { background:var(--bad); }
.dot.suspended { background:var(--warn); }
.dot.cancelled { background:#8b9bb4; }
.due { font-weight:700; }
.due.ok { color:var(--ok); }
.due.warn { color:var(--warn); }
.due.bad { color:var(--bad); }
.alert { color:var(--bad); font-weight:700; }
.stmt-band { display:block; }
.stmt-wrap { width:100%; max-height:380px; overflow:auto; }
.stmt { width:100%; border-collapse:collapse; font-size:13px; }
.stmt th {
  text-align:left; color:var(--muted); font-size:11px; letter-spacing:.03em;
  text-transform:uppercase; font-weight:700; padding:4px 8px 6px 0;
  border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff;
}
.stmt th.num, .stmt td.num { text-align:right; white-space:nowrap; }
.stmt td { padding:5px 8px 5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
.stmt tr:last-child td { border-bottom:0; }
.stmt tr.payment td.num { color:var(--ok); }
.stmt tr.line td:nth-child(2) { padding-left:14px; color:var(--muted); }
.stmt tr.line td.num { color:var(--muted); font-weight:400; }
.empty { color:var(--muted); padding:20px 14px; }
.err { color:#8a1212; background:#fdecec; padding:12px; border-radius:10px; }
.fold-head {
  cursor:pointer; user-select:none; margin:8px 0 10px;
  border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  background:#fff; color:var(--acc);
}
.fold-head .name { font-size:16px; }
.fold-head[aria-expanded="true"] { border-color:var(--acc); }
.hidden { display:none; }

/* ML — landscape phone full width. Mac / wide tablet: same ML column, centred. */
@media (min-width: 600px) {
  header.app, main {
    width:100%; max-width:var(--ml);
    margin-left:auto; margin-right:auto;
  }
  header.app { padding:12px 20px; }
  .bar { flex-direction:row; align-items:flex-end; justify-content:space-between; gap:16px; }
  main { padding:14px 20px 36px; }
  .cat-card { padding:16px; }
  .cat-card h2 { font-size:16px; }
  .cat-list { gap:12px; }
  .head { padding:12px 16px; }
  .head .kind { display:inline; }
  .name { font-size:16px; }
  .band {
    display:grid; grid-template-columns:1fr 1fr 1fr;
    gap:8px 20px; align-items:start; padding:10px 16px;
  }
  .band.two { grid-template-columns:1fr 1fr; }
  .band.stmt-band { display:block; }
  .field { width:auto; }
}
</style>
</head>
<body>
<header class="app">
  <div class="bar">
    <div>
      <h1>Clients</h1>
      <div class="sub">One line each · click the name for details</div>
    </div>
    <nav class="nav">
      <a href="/dash/#/">Home</a>
      <a href="/dash/accounts.html">Accounts</a>
      <a href="/dash/invoices.html">Invoices</a>
    </nav>
  </div>
  <input class="search" id="q" type="search" placeholder="Search name, address, phone, B number, package" autocomplete="off">
</header>
<main>
  <div class="counts" id="counts"></div>
  <div id="grid">Loading…</div>
  <section id="cancelled-wrap" class="hidden">
    <div class="fold-head" id="cancelled-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="cancelled-grid">
      <div class="name">Cancelled / deleted</div>
      <div class="meta" id="cancelled-meta">Not clients anymore · click to show</div>
    </div>
    <div class="hidden" id="cancelled-grid"></div>
  </section>
</main>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const money = v => v==null||v==="" ? "—" : Number(v).toFixed(2);
const dueClass = c => c.suspension_notice||c.bounced ? "bad" : (c.paid_up ? "ok" : (c.in_grace ? "warn" : (Number(c.due) ? "bad" : "")));
const accessLabel = c => (c.access||"") === "fibre" ? "Fibre" : "Wifi";
function field(label, value, extra){
  return `<div class="field"><span class="k">${esc(label)}</span><span class="v${extra&&extra.cls?" "+extra.cls:""}">${value}</span></div>`;
}
function accountLine(c){
  if (!c.master) return "";
  const own = c.own_sub ? "own sub-account" : (c.sub || "sub-account");
  const others = (c.other_subs||[]).map(s => `${s.name}${s.cancelled?" (cancelled)":""}`).join(", ");
  return field("Account", `Master ${c.master} · ${own}${others?` · other sub ${others}`:""}`);
}
function stmtTable(c){
  const rows = c.ledger || [];
  if (!rows.length) return "";
  const body = rows.map(r=>`<tr class="${esc(r.kind||"")}">
    <td>${esc(r.kind==="line"?"":(r.date_fmt||r.date||""))}</td>
    <td>${esc(r.what||"")}</td>
    <td class="num">${esc(money(r.amount))}</td>
    <td class="num">${r.kind==="line"?"":esc(money(r.balance))}</td>
  </tr>`).join("");
  return `<div class="band stmt-band">
    <div class="k">Statement</div>
    <div class="stmt-wrap"><table class="stmt">
      <thead><tr><th>Date</th><th>What</th><th class="num">Amount</th><th class="num">Balance</th></tr></thead>
      <tbody>${body}</tbody>
    </table></div>
  </div>`;
}
function headBal(c){
  if (c.suspension_notice || c.bounced) return `Bounced · Due ${money(c.due)}`;
  return c.balance_label || "—";
}
function card(c){
  const id = "d-"+Math.random().toString(36).slice(2,8);
  const bno = c.b_number || (c.access==="fibre" ? "—" : "Wireless");
  const dc = dueClass(c);
  const kind = [accessLabel(c), c.pay, c.discount?"disc":""].filter(Boolean).join(" · ");
  const bal = `${esc(c.balance_label||"—")} <span class="meta">Billed ${esc(money(c.billed))} · paid ${esc(money(c.paid))} · due ${esc(money(c.due))}</span>`;
  return `<article class="card" data-search="${esc(c.search||"")}">
    <button class="head" type="button" aria-expanded="false" aria-controls="${id}">
      <span class="name"><span class="dot ${esc(c.dot||"active")}" title="${esc(c.dot_label||"")}"></span>${esc(c.name||"—")}</span>
      <span class="head-right">
        <span class="kind">${esc(kind)}</span>
        <span class="bal due ${dc}">${esc(headBal(c))}</span>
      </span>
    </button>
    <div class="detail hidden" id="${id}">
      <div class="band">
        ${field("Address", esc(c.address||"—"))}
        ${field("Contact", esc(c.phone||"—"))}
        ${field("Email", esc(c.email||"—"))}
      </div>
      <div class="band">
        ${field("Start", esc(c.started_label||"—"))}
        ${field("Years", esc(c.tenure||"—"))}
        ${field("B no", esc(bno))}
      </div>
      <div class="band two">
        ${field("Package", esc(c.package||"—"))}
        ${field("Balance", bal, {cls:"due "+dc})}
      </div>
      ${c.master?`<div class="band">${accountLine(c)}</div>`:""}
      ${stmtTable(c)}
      ${c.suspension_notice?`<div class="band"><div class="alert">Suspension notice · D/O bounced</div></div>`:""}
    </div>
  </article>`;
}
function block(title, list){
  if (!list.length) return "";
  return `<section class="cat-card">
    <h2>${esc(title)} <span class="n">${list.length}</span></h2>
    <div class="cat-list">${list.map(card).join("")}</div>
  </section>`;
}
function bindToggles(root){
  root.querySelectorAll(".head").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const open = btn.getAttribute("aria-expanded")==="true";
      const panel = document.getElementById(btn.getAttribute("aria-controls"));
      btn.setAttribute("aria-expanded", open?"false":"true");
      if (panel) panel.classList.toggle("hidden", open);
    });
  });
}
function splitAccess(list){
  const name = c => (c.name||"").toLowerCase();
  const wifi = list.filter(c => (c.access||"") !== "fibre").sort((a,b)=>name(a).localeCompare(name(b)));
  const fibre = list.filter(c => (c.access||"") === "fibre").sort((a,b)=>name(a).localeCompare(name(b)));
  return {wifi, fibre};
}
function paint(pack){
  const q = ($("#q").value||"").trim().toLowerCase();
  const cards = pack.cards || [];
  const cancelled = pack.cancelled || [];
  const hit = c => !q || (c.search||"").includes(q) || (c.name||"").toLowerCase().includes(q);
  const shown = cards.filter(hit);
  const shownC = cancelled.filter(hit);
  const {wifi, fibre} = splitAccess(shown);
  $("#counts").textContent = q
    ? `${shown.length} match · ${wifi.length} wifi · ${fibre.length} fibre`
    : `${cards.length} clients · ${wifi.length} wifi · ${fibre.length} fibre`;
  $("#grid").innerHTML = shown.length
    ? block("GoWiFi Wifi", wifi) + block("Fibre", fibre)
    : `<p class="empty">No clients match.</p>`;
  bindToggles($("#grid"));
  const wrap = $("#cancelled-wrap");
  if (!cancelled.length) { wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  const owe = cancelled.filter(c => Number(c.due||0) > 0).length;
  $("#cancelled-meta").textContent = q
    ? `${shownC.length} of ${cancelled.length} deleted`
    : `${cancelled.length} deleted · ${owe} still owe · click to show`;
  $("#cancelled-grid").innerHTML = shownC.length
    ? block("Cancelled / deleted", shownC)
    : `<p class="empty">No deleted clients match.</p>`;
  bindToggles($("#cancelled-grid"));
}
fetch("accounts.json?v="+Date.now(),{credentials:"same-origin", cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("accounts.json "+r.status); return r.json(); })
  .then(data=>{
    const pack = data.clients || {};
    if (location.hash) $("#q").value = decodeURIComponent(location.hash.slice(1));
    paint(pack);
    const first = $("#grid .head");
    if (location.hash && first) first.click();
    $("#q").addEventListener("input", ()=>paint(pack));
    const tog = $("#cancelled-toggle");
    const grid = $("#cancelled-grid");
    const flip = () => {
      const open = tog.getAttribute("aria-expanded")==="true";
      tog.setAttribute("aria-expanded", open?"false":"true");
      grid.classList.toggle("hidden", open);
    };
    tog.addEventListener("click", flip);
    tog.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); }});
  })
  .catch(e=>{ $("#grid").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
</script>
</body>
</html>
