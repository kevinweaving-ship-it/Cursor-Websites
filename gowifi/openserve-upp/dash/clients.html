<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoWifi · Clients</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<style>
:root {
  --bg:#ffffff; --card:#ffffff; --line:#d5deea; --text:#0b1f44; --muted:#4a5d7a;
  --ok:#1a8f4a; --bad:#c62828; --warn:#c77800; --acc:#123a7a; --pad:16px;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
a { color:var(--acc); }
header.app {
  position:sticky; top:0; z-index:5;
  background:#fff; border-bottom:1px solid var(--line);
  padding:12px var(--pad) 12px;
}
header.app h1 { margin:0; font-size:22px; color:var(--acc); }
header.app .sub { color:var(--muted); font-size:13px; margin-top:2px; }
header.app a.back { display:inline-block; color:var(--acc); font-size:14px; min-height:40px; line-height:40px; margin-right:14px; }
.search {
  width:100%; margin-top:10px; padding:12px 14px; font:16px/1.3 inherit;
  color:var(--text); background:#fff; border:1px solid var(--line); border-radius:10px;
}
.search:focus { outline:2px solid var(--acc); border-color:var(--acc); }
main { padding:14px var(--pad) 32px; max-width:980px; margin:0 auto; }
.counts { color:var(--muted); font-size:13px; margin:0 0 12px; }
.cat { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--acc); margin:16px 0 8px; }
.cat:first-child { margin-top:0; }
.list { display:flex; flex-direction:column; gap:8px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:0; color:var(--text); width:100%;
}
.head {
  display:flex; align-items:center; gap:10px; width:100%;
  padding:12px 14px; background:transparent; border:0; color:inherit;
  font:inherit; text-align:left; cursor:pointer; min-height:48px;
}
.head:focus { outline:2px solid var(--acc); outline-offset:-2px; }
.name { font-weight:700; font-size:17px; color:var(--acc); display:flex; align-items:center; gap:8px; flex:1; }
.head-meta { color:var(--muted); font-size:13px; white-space:nowrap; }
.meta { color:var(--muted); font-size:13px; margin-top:4px; }
.detail { padding:0 14px 12px; border-top:1px solid var(--line); }
.row { margin-top:8px; }
.k { font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.v { margin-top:1px; }
.dot {
  width:12px; height:12px; border-radius:50%; display:inline-block; flex:0 0 12px;
  box-shadow:0 0 0 2px #fff, 0 0 0 3px var(--line);
}
.dot.active { background:var(--ok); }
.dot.issue { background:var(--bad); }
.dot.suspended { background:var(--warn); }
.dot.cancelled { background:#8b9bb4; }
.due { font-weight:700; }
.due.ok { color:var(--ok); }
.due.warn { color:var(--warn); }
.due.bad { color:var(--bad); }
.alert { color:var(--bad); font-weight:700; margin-top:6px; }
.empty { color:var(--muted); padding:24px 0; }
.err { color:#8a1212; background:#fdecec; padding:12px; border-radius:10px; }
.fold-head {
  cursor:pointer; user-select:none; margin:22px 0 10px;
  border:1px solid var(--line); border-radius:12px; padding:14px;
  background:#fff; color:var(--acc);
}
.fold-head .name { font-size:17px; }
.fold-head[aria-expanded="true"] { border-color:var(--acc); }
.hidden { display:none; }
</style>
</head>
<body>
<header class="app">
  <a class="back" href="/dash/#/">← Home</a>
  <a class="back" href="/dash/accounts.html">Detailed</a>
  <a class="back" href="/dash/invoices.html">Invoices</a>
  <h1>Clients</h1>
  <div class="sub">One line each · click the name for details</div>
  <input class="search" id="q" type="search" placeholder="Search name, address, phone, B number, package" autocomplete="off">
</header>
<main>
  <div class="counts" id="counts"></div>
  <div class="list" id="grid">Loading…</div>
  <section id="cancelled-wrap" class="hidden">
    <div class="fold-head" id="cancelled-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="cancelled-grid">
      <div class="name">Cancelled / deleted</div>
      <div class="meta" id="cancelled-meta">Not clients anymore · click to show</div>
    </div>
    <div class="list hidden" id="cancelled-grid"></div>
  </section>
</main>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const money = v => v==null||v==="" ? "—" : Number(v).toFixed(2);
const dueClass = c => c.suspension_notice||c.bounced ? "bad" : (c.paid_up ? "ok" : (c.in_grace ? "warn" : (c.due ? "bad" : "")));
function headerLine(c){
  const bits = [c.dot_label, c.access, c.pay, c.discount?"discount":"", c.balance_label].filter(Boolean);
  return bits.join(" · ");
}
function card(c){
  const id = "d-"+Math.random().toString(36).slice(2,8);
  return `<article class="card" data-search="${esc(c.search||"")}">
    <button class="head" type="button" aria-expanded="false" aria-controls="${id}">
      <span class="name"><span class="dot ${esc(c.dot||"active")}" title="${esc(c.dot_label||"")}"></span>${esc(c.name||"—")}</span>
      <span class="head-meta due ${dueClass(c)}">${esc(headerLine(c))}</span>
    </button>
    <div class="detail hidden" id="${id}">
      <div class="row"><div class="k">Address</div><div class="v">${esc(c.address||"—")}</div></div>
      <div class="row"><div class="k">Contact</div><div class="v">${esc(c.phone||"—")}${c.email?`<div class="meta">${esc(c.email)}</div>`:""}</div></div>
      <div class="row"><div class="k">Start</div><div class="v">${esc(c.started_label||"—")}</div></div>
      <div class="row"><div class="k">Year / month</div><div class="v">${esc(c.tenure||"—")}</div></div>
      <div class="row"><div class="k">B number</div><div class="v">${esc(c.b_number||(c.access==="fibre"?"—":"Wireless"))}</div></div>
      <div class="row"><div class="k">Package</div><div class="v">${esc(c.package||"—")}</div></div>
      <div class="row"><div class="k">Balance</div><div class="v due ${dueClass(c)}">${esc(c.balance_label||"—")}<div class="meta">Billed ${esc(money(c.billed))} · paid ${esc(money(c.paid))} · due ${esc(money(c.due))}</div></div></div>
      ${c.suspension_notice?`<div class="alert">Suspension notice · D/O bounced</div>`:""}
    </div>
  </article>`;
}
function bindToggles(root){
  root.querySelectorAll(".head").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const open = btn.getAttribute("aria-expanded")==="true";
      const panel = document.getElementById(btn.getAttribute("aria-controls"));
      btn.setAttribute("aria-expanded", open?"false":"true");
      if (panel) panel.classList.toggle("hidden", open);
    });
  });
}
function splitAccess(list){
  const name = c => (c.name||"").toLowerCase();
  const wifi = list.filter(c => (c.access||"") !== "fibre").sort((a,b)=>name(a).localeCompare(name(b)));
  const fibre = list.filter(c => (c.access||"") === "fibre").sort((a,b)=>name(a).localeCompare(name(b)));
  return {wifi, fibre};
}
function paint(pack){
  const q = ($("#q").value||"").trim().toLowerCase();
  const cards = pack.cards || [];
  const cancelled = pack.cancelled || [];
  const hit = c => !q || (c.search||"").includes(q) || (c.name||"").toLowerCase().includes(q);
  const shown = cards.filter(hit);
  const shownC = cancelled.filter(hit);
  const {wifi, fibre} = splitAccess(shown);
  $("#counts").textContent = q
    ? `${shown.length} match · ${wifi.length} wifi · ${fibre.length} fibre`
    : `${cards.length} clients · ${wifi.length} wifi · ${fibre.length} fibre`;
  let body = "";
  if (!shown.length) body = `<p class="empty">No clients match.</p>`;
  else if (q) {
    if (wifi.length) body += `<h2 class="cat">GoWiFi Wifi</h2>` + wifi.map(card).join("");
    if (fibre.length) body += `<h2 class="cat">Fibre</h2>` + fibre.map(card).join("");
  } else {
    body += `<h2 class="cat">GoWiFi Wifi</h2>` + (wifi.map(card).join("") || `<p class="empty">None</p>`);
    body += `<h2 class="cat">Fibre</h2>` + (fibre.map(card).join("") || `<p class="empty">None</p>`);
  }
  $("#grid").innerHTML = body;
  bindToggles($("#grid"));
  const wrap = $("#cancelled-wrap");
  if (!cancelled.length) { wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  const owe = cancelled.filter(c => Number(c.due||0) > 0).length;
  $("#cancelled-meta").textContent = q
    ? `${shownC.length} of ${cancelled.length} deleted`
    : `${cancelled.length} deleted · ${owe} still owe · click to show`;
  $("#cancelled-grid").innerHTML = shownC.map(card).join("") || `<p class="empty">No deleted clients match.</p>`;
  bindToggles($("#cancelled-grid"));
}
fetch("accounts.json?v="+Date.now(),{credentials:"same-origin", cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("accounts.json "+r.status); return r.json(); })
  .then(data=>{
    const pack = data.clients || {};
    paint(pack);
    $("#q").addEventListener("input", ()=>paint(pack));
    const tog = $("#cancelled-toggle");
    const grid = $("#cancelled-grid");
    const flip = () => {
      const open = tog.getAttribute("aria-expanded")==="true";
      tog.setAttribute("aria-expanded", open?"false":"true");
      grid.classList.toggle("hidden", open);
    };
    tog.addEventListener("click", flip);
    tog.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); flip(); }});
  })
  .catch(e=>{ $("#grid").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
</script>
</body>
</html>
