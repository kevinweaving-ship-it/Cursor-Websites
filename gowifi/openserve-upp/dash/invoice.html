<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoWifi invoice</title>
<style>
@page { size: A4; margin: 12mm; }
body { font: 11px/1.35 "Helvetica Neue", Helvetica, Arial, sans-serif; color:#0b1f44; background:#ffffff; margin:0; }
.sheet { width:210mm; min-height:297mm; margin:16px auto; background:#fff; padding:10mm 12mm 14mm; box-sizing:border-box; box-shadow:0 1px 8px rgba(0,0,0,.12); }
.card { border: 2.5px solid #123a7a; border-radius:8px; padding:12px 14px; margin:0 0 12px; background:#fff; }
.card-row { display:flex; gap:12px; margin:0 0 12px; }
.card-row .card { flex:1; margin:0; }
.brand { font-size:18px; font-weight:700; letter-spacing:.02em; margin-bottom:4px; color:#123a7a; }
.doc-title { font-size:22px; font-weight:700; letter-spacing:.12em; color:#123a7a; }
.muted { color:#555; }
.label { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#123a7a; margin-bottom:3px; font-weight:700; }
.who { font-weight:700; font-size:13px; }
.meta { border-collapse:collapse; margin-top:8px; }
.meta th { text-align:left; font-weight:600; color:#555; padding:2px 16px 2px 0; }
.meta td { text-align:right; font-weight:600; }
table.lines, table.soa, table.index { width:100%; border-collapse:collapse; }
table.lines th, table.soa th, table.index th { text-align:left; font-size:9px; letter-spacing:.08em; text-transform:uppercase; border-bottom:2px solid #123a7a; padding:6px 4px; color:#123a7a; }
table.lines td, table.index td { padding:5px 4px; border-bottom:1.5px solid #123a7a; vertical-align:top; }
table.soa td { padding:4px; border-bottom:1.5px solid #123a7a; vertical-align:top; }
table.soa a, table.index a { color:#123a7a; text-decoration:underline; font-weight:600; }
.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.due { font-size:13px; font-weight:700; text-align:right; margin:10px 0 8px; color:#123a7a; }
h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 8px; display:flex; justify-content:space-between; align-items:baseline; color:#123a7a; }
.ageing { width:100%; border-collapse:collapse; margin:10px 0 4px; }
.ageing th { font-size:8px; letter-spacing:.06em; text-transform:uppercase; color:#123a7a; text-align:right; padding:4px 6px; border-bottom:2px solid #123a7a; }
.ageing td { text-align:right; font-weight:600; padding:6px; font-variant-numeric:tabular-nums; border-top:1.5px solid #123a7a; }
.ageing td.total, .ageing th.total { font-size:13px; }
.bank { color:#333; margin-bottom:0; }
a.back { font: 13px/1.4 sans-serif; color:#345; }
.screen-only { max-width:210mm; margin:12px auto 0; padding:0 16px; }
.index-wrap { width:210mm; margin:16px auto 32px; background:#fff; padding:14mm 16mm; box-sizing:border-box; box-shadow:0 1px 8px rgba(0,0,0,.12); border: 2.5px solid #123a7a; border-radius:8px; }
.index-wrap h1 { font-size:20px; letter-spacing:.08em; margin:0 0 4px; }
.index-wrap a { color:#123a7a; }
.err { color:#a00; padding:24px; }
@media print { body { background:#fff; } .sheet, .index-wrap { margin:0; box-shadow:none; width:auto; min-height:0; padding:0; } .screen-only { display:none; } }
</style>
</head>
<body>
<p class="screen-only"><a class="back" href="/dash/accounts.html">← Fibre accounts</a></p>
<div id="app">Loading…</div>
<script>
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const money = (v, withR=true) => {
  if (v==null || v==="") return "";
  const n = Number(v);
  if (Number.isNaN(n)) return "";
  const sign = n<0 ? "-" : "";
  const body = Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return sign + (withR ? "R" : "") + body;
};
const fmtDate = v => {
  if (!v) return "—";
  const s = String(v).trim();
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
  const dmy = s.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})/);
  if (dmy) return `${dmy[1]}/${dmy[2]}/${dmy[3]}`;
  return s;
};
const addrHtml = a => String(a||"").split(",").map(x=>x.trim()).filter(Boolean).map(x=>`<div>${esc(x)}</div>`).join("");
const parseDay = v => {
  const s = String(v||"").trim();
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return new Date(+iso[1], +iso[2]-1, +iso[3]);
  const dmy = s.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})/);
  if (dmy) return new Date(+dmy[3], +dmy[2]-1, +dmy[1]);
  return null;
};
const toCurrent = stmt => {
  const today = new Date();
  today.setHours(0,0,0,0);
  const ageing = {current:0, d30:0, d60:0, d90:0, older:0};
  (stmt.outstanding||[]).forEach(l => {
    const d = parseDay(l.date) || today;
    const days = Math.round((today - d) / 86400000);
    const bucket = days<=0 ? "current" : days<=30 ? "d30" : days<=60 ? "d60" : days<=90 ? "d90" : "older";
    ageing[bucket] += Number(l.amount!=null?l.amount:l.debit||0);
  });
  if (!(stmt.outstanding||[]).length) Object.assign(ageing, stmt.ageing||{});
  Object.keys(ageing).forEach(k => { ageing[k] = Math.round(ageing[k]*100)/100; });
  const iso = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  return Object.assign({}, stmt, {ageing, as_at: iso});
};
const params = new URLSearchParams(location.search);
fetch("accounts.json?v="+Date.now(), {credentials:"same-origin", cache:"no-store"})
  .then(r => { if(!r.ok) throw new Error("accounts.json "+r.status); return r.json(); })
  .then(data => {
    const hist = ((data.books||{}).history||{}).invoices || [];
    const drafts = ((data.books||{}).customer_invoices||{}).rows || [];
    const all = hist.concat(drafts);
    const want = params.get("n");
    const c = (data.books&&data.books.company) || {};
    if (!want) {
      document.title = "GoWifi invoices";
      document.getElementById("app").innerHTML = `
        <div class="index-wrap">
          <header class="letterhead">
            <div>
              <div class="brand">${esc(c.name||"GoWifi (Pty) Ltd")}</div>
              <div class="muted">Invoice and statement of account</div>
            </div>
            <div class="doc-title">INVOICES</div>
          </header>
          <table class="index">
            <thead><tr><th>#</th><th>Date</th><th>Client</th><th>What for</th><th class="num">Amount</th></tr></thead>
            <tbody>${
              all.map(r=>`<tr><td><a href="?n=${esc(r.invoice_number)}">${esc(r.invoice_number)}</a></td><td>${esc(fmtDate(r.invoice_date))}</td><td>${esc(r.customer||"—")}</td><td>${esc(r.description||"Monthly service")}</td><td class="num">${money(r.amount)}</td></tr>`).join("") || `<tr><td colspan="5">None yet</td></tr>`
            }</tbody>
          </table>
        </div>`;
      return;
    }
    const r = all.find(x => String(x.invoice_number)===String(want));
    if (!r) { document.getElementById("app").innerHTML = `<p class="err">No invoice ${esc(want)}</p>`; return; }
    const raw = r.statement && r.statement.lines && r.statement.lines.length ? r.statement : {lines:[], total_due: r.balance_due!=null?r.balance_due:r.amount, ageing:{}};
    const stmt = toCurrent(raw);
    const ageing = stmt.ageing || {};
    const due = stmt.total_due!=null ? stmt.total_due : (r.balance_due!=null?r.balance_due:r.amount);
    const desc = r.description || "Monthly service";
    document.title = "Invoice "+r.invoice_number;
    document.getElementById("app").innerHTML = `
      <article class="sheet">
        <div class="card-row">
          <section class="card">
            <div class="label">From</div>
            <div class="brand">${esc(c.name||"GoWifi (Pty) Ltd")}</div>
            ${(c.lines||[]).map(x=>`<div>${esc(x)}</div>`).join("")}
            <div class="muted">${esc(c.phone||"")} · ${esc(c.email||"")}</div>
            <div class="muted">Business ID No. ${esc(c.reg||"")}</div>
          </section>
          <section class="card">
            <div class="label">Bill to</div>
            <div class="who">${esc(r.customer||"—")}</div>
            ${addrHtml(r.address)}
            <table class="meta">
              <tr><th>Invoice</th><td>${esc(r.invoice_number)}</td></tr>
              <tr><th>Date</th><td>${esc(fmtDate(r.invoice_date))}</td></tr>
              <tr><th>Terms</th><td>${esc(r.terms||"Due on receipt")}</td></tr>
              <tr><th>Due date</th><td>${esc(fmtDate(r.due_date||r.invoice_date))}</td></tr>
            </table>
          </section>
        </div>
        <section class="card">
          <h2><span>Invoice</span><span class="doc-title">INVOICE</span></h2>
          <table class="lines">
            <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
            <tbody><tr>
              <td>${esc(desc)}</td>
              <td class="num">${esc(r.qty||1)}</td>
              <td class="num">${money(r.rate!=null?r.rate:r.amount,false)}</td>
              <td class="num">${money(r.amount,false)}</td>
            </tr></tbody>
          </table>
          <div class="due">This invoice ${money(r.amount)}</div>
        </section>
        ${stmt.lines && stmt.lines.length ? `
        <section class="card">
        <h2><span>Statement</span><span class="muted">from last paid up · as at ${esc(fmtDate(stmt.as_at||r.invoice_date))}</span></h2>
        <div class="due">Outstanding ${money(due)}</div>
        <table class="soa">
          <thead><tr><th>Date</th><th>Description</th><th class="num">Amount</th><th class="num">Balance</th></tr></thead>
          <tbody>${stmt.lines.map(line=>{
            const n = line.invoice_number || (line.kind==="invoice" ? line.reference : "");
            const label = esc(line.description||"");
            const desc = n ? `<a href="?n=${esc(n)}">${label}</a>` : label;
            return `<tr>
            <td>${esc(line.date_fmt||fmtDate(line.date))}</td>
            <td>${desc}</td>
            <td class="num">${money(line.amount,false)}</td>
            <td class="num">${money(line.balance,false)}</td>
          </tr>`;
          }).join("")}</tbody>
        </table>
        <table class="ageing">
          <tr>
            <th>Current<br>Due</th>
            <th>1–30 Days<br>Past Due</th>
            <th>31–60 Days<br>Past Due</th>
            <th>61–90 Days<br>Past Due</th>
            <th>90+ Days<br>Past Due</th>
            <th class="total">Amount<br>Due</th>
          </tr>
          <tr>
            <td>${money(ageing.current,false)||"0.00"}</td>
            <td>${money(ageing.d30,false)||"0.00"}</td>
            <td>${money(ageing.d60,false)||"0.00"}</td>
            <td>${money(ageing.d90,false)||"0.00"}</td>
            <td>${money(ageing.older,false)||"0.00"}</td>
            <td class="total">${money(due)}</td>
          </tr>
        </table>
        </section>` : `<section class="card"><div class="due">Balance due ${money(due)}</div></section>`}
        <footer class="card bank">
          <div class="label">Banking / EFT</div>
          <div>Account name ${esc(c.bank_account_name||"GoWifi (Pty) Ltd")}</div>
          <div>${esc(c.bank||"First National Bank")} · ${esc(c.branch||"Hermanus")} · ${esc(c.branch_code||"200412")}</div>
          <div>Account ${esc(c.account_number||"62860060278")} · Reference ${esc(r.invoice_number)}</div>
        </footer>
      </article>`;
  })
  .catch(e => { document.getElementById("app").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
</script>
</body>
</html>
