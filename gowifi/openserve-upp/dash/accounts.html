<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoWifi · Fibre accounts</title>
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<style>
:root {
  --bg:#0b1220; --card:#141c2e; --line:#243049; --text:#e8eef8; --muted:#8b9bb4;
  --ok:#3dd68c; --bad:#ff6b6b; --warn:#f5c16c; --acc:#3d8bff; --pad:14px;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
a { color:inherit; text-decoration:none; }
header.app {
  position:sticky; top:0; z-index:5;
  background:rgba(11,18,32,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:12px var(--pad) calc(10px + env(safe-area-inset-top));
}
header.app h1 { margin:0; font-size:18px; }
header.app .sub { color:var(--muted); font-size:12px; margin-top:2px; }
header.app a.back { display:inline-block; color:var(--acc); font-size:14px; min-height:44px; line-height:44px; }
main { padding:12px var(--pad) 28px; max-width:920px; margin:0 auto; }
.grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:12px; margin:0 0 10px;
}
.k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
.v { font-size:22px; font-weight:700; margin-top:2px; }
.row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
.pill { font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap; }
.ok { background:#163527; color:var(--ok); }
.bad { background:#3a1518; color:var(--bad); }
.warn { background:#3a2e12; color:var(--warn); }
.list .item { padding:8px 0; border-top:1px solid var(--line); }
.list .item:first-child { border-top:0; padding-top:2px; }
.name { font-weight:650; }
.meta { color:var(--muted); font-size:12px; margin-top:2px; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px; }
h2.toggle {
  cursor:pointer; user-select:none; min-height:44px; display:flex; align-items:center; gap:8px;
}
h2.toggle .chev { color:var(--acc); font-size:14px; }
.fold.hidden { display:none; }
.scroll { overflow:auto; }
.err { background:#3a1518; color:#ffd0d0; padding:12px; border-radius:12px; }
table.compact { width:100%; border-collapse:collapse; font-size:13px; }
table.compact th {
  text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase;
  letter-spacing:.04em; font-weight:700; padding:6px 6px 8px 0; border-bottom:1px solid var(--line);
}
table.compact td { padding:7px 8px 7px 0; border-bottom:1px solid var(--line); vertical-align:top; }
table.compact tr:last-child td { border-bottom:0; }
.num { white-space:nowrap; }
@media (max-width:700px) {
  .grid { grid-template-columns:1fr 1fr; }
  .wide-only { display:none; }
}
</style>
</head>
<body>
<header class="app">
  <a class="back" href="/dash/#/">← Home</a>
  <h1>Fibre accounts</h1>
  <div class="sub" id="sub">Openserve line status · join dates</div>
</header>
<main id="app">Loading…</main>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
const clock = v => {
  if (!v) return "";
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return "";
  const sa = new Date(d.getTime() + 2*60*60*1000);
  return String(sa.getUTCHours()).padStart(2,"0")+":"+String(sa.getUTCMinutes()).padStart(2,"0");
};
const pillFor = (status) => {
  const s=(status||"").toLowerCase();
  if (s==="active") return `<span class="pill ok">Active</span>`;
  if (s==="suspended") return `<span class="pill warn">Suspended</span>`;
  if (s.includes("cancel")) return `<span class="pill bad">Cancelled</span>`;
  if (s.includes("unverified")) return `<span class="pill warn">Unverified</span>`;
  return `<span class="pill warn">${esc(status||"—")}</span>`;
};
function render(data){
  const c=data.counts||{};
  const checked = clock(data.synced_at);
  $("#sub").textContent = checked ? `Last check ${checked}` : "Openserve line status · join dates";
  const monthsAsClient = (iso) => {
    if (!iso) return "—";
    const j = new Date(iso + "T00:00:00");
    const t = new Date((data.as_at || "") + "T00:00:00");
    if (Number.isNaN(j.getTime()) || Number.isNaN(t.getTime())) return "—";
    let m = (t.getFullYear() - j.getFullYear()) * 12 + (t.getMonth() - j.getMonth());
    if (t.getDate() < j.getDate()) m -= 1;
    m = Math.max(0, m);
    if (m < 12) return m === 1 ? "1 month" : m + " months";
    const y = Math.floor(m / 12), r = m % 12;
    const ys = y === 1 ? "1 year" : y + " years";
    if (!r) return ys;
    return ys + " " + (r === 1 ? "1 month" : r + " months");
  };
  const kindPill = r => {
    const k=(r.story_kind||"").toLowerCase();
    if (k==="redo") return `<span class="pill warn">Address error</span>`;
    if (k==="move") return `<span class="pill warn">Moved house</span>`;
    if (k==="cease") return `<span class="pill bad">Ended</span>`;
    return "";
  };
  const hist = r => {
    const text = r.story_label || [r.ordered_label && "Ordered "+r.ordered_label, r.installed_label && "Installed "+r.installed_label].filter(Boolean).join(" · ");
    return text ? `<div class="meta">${esc(text)}</div>` : "";
  };
  const tenure = r => {
    if (r.line_status==="cancelled") return r.months_label && r.months_label!=="—" ? "Was "+r.months_label : "Cancelled";
    return monthsAsClient(r.activated || r.installed || r.joined);
  };
  const cancelledSNs = new Set((data.cancelled_lines||[]).map(r=>r.service_number).filter(Boolean));
  const suspendedSNs = new Set((data.suspended||[]).map(r=>r.service_number).filter(Boolean));
  const fibreFetch = r => {
    const bits = [r.access_status, r.partner_status].filter(Boolean);
    const when = clock(r.fibre_fetched_at || data.synced_at);
    if (!bits.length && !when) return `<div class="meta">Fibre status not fetched</div>`;
    return `<div class="meta">${esc(bits.join(" · ")||"fetched")}${when?` · ${esc(when)}`:""}</div>`;
  };
  const incomingRows = (data.incoming_fibre||[]).map(r=>`
    <tr>
      <td><div class="name">${esc(r.incoming_label||r.incoming_role||"—")}</div><div class="meta">${esc(r.uisp_site||"VK Pop")} · also on UISP</div></td>
      <td class="num">${esc(r.service_number)}<div class="meta">${esc(r.product)}</div></td>
      <td>${pillFor(r.line_status)}${fibreFetch(r)}</td>
      <td class="num">${esc(r.speed)}</td>
    </tr>`).join("");
  const clientName = r => {
    const extra = r.incoming_label ? `<div class="meta">${esc(r.incoming_label)}</div>` : "";
    return `<div class="name">${esc(r.customer)}</div>${extra}<div class="meta">${esc(r.address)}</div>`;
  };
  const activeRows = (data.active||[]).filter(r=>r.line_status==="active" && !cancelledSNs.has(r.service_number) && !suspendedSNs.has(r.service_number)).map(r=>`
    <tr>
      <td>${clientName(r)}${hist(r)}</td>
      <td class="num">${esc(r.service_number)}<div class="meta">${esc(r.product)}</div></td>
      <td>${pillFor(r.line_status)}${fibreFetch(r)}</td>
      <td class="num">${esc(r.speed)}</td>
      <td class="num">${esc(tenure(r))}</td>
    </tr>`).join("");
  const taken = new Set((data.active||[]).concat(data.suspended||[]).map(r=>r.service_number).filter(Boolean));
  const cancelledLineRows = (data.cancelled_lines||[]).filter(r=>!taken.has(r.service_number)).map(r=>`
    <tr>
      <td>${clientName(r)}${hist(r)}</td>
      <td class="num">${esc(r.service_number)}<div class="meta">${esc(r.product)}</div></td>
      <td>${pillFor("cancelled")} ${kindPill(r)}${fibreFetch(r)}</td>
      <td class="num">${esc(tenure(r))}</td>
    </tr>`).join("");
  const suspendedRows = (data.suspended||[]).filter(r=>r.line_status==="suspended" && !cancelledSNs.has(r.service_number)).map(r=>`
    <tr>
      <td>${clientName(r)}${hist(r)}</td>
      <td class="num">${esc(r.service_number)}<div class="meta">${esc(r.product)} · ${esc(r.suspend_stints||0)} stint${(r.suspend_stints||0)===1?"":"s"}</div></td>
      <td>${pillFor("suspended")}${fibreFetch(r)}</td>
      <td class="num">${esc(r.speed)}</td>
      <td class="num">${esc(r.suspend_for)}<div class="meta">installed ${esc(r.installed_label || r.joined_label)}</div></td>
    </tr>`).join("");
  const names={};
  (data.active||[]).concat(data.cancelled_lines||[], data.suspended||[]).forEach(r=>{ if(r.service_number) names[r.service_number]=r.customer; });
  const cov=data.mail_coverage||{};
  const accountRows=(data.billing_accounts||[]).map(r=>`
    <tr>
      <td class="num">${esc(r.account_number)}</td>
      <td>${esc(r.product_family||"—")}</td>
      <td class="num">${esc(r.invoices)}</td>
      <td class="num">${esc(r.from||"—")} → ${esc(r.to||"—")}</td>
      <td class="num">${r.total==null?"—":Number(r.total).toFixed(2)}</td>
    </tr>`).join("");
  const chargeRows=(data.line_charges||[]).map(r=>`
    <tr>
      <td><div class="name">${esc(names[r.service_number]||"—")}</div><div class="meta">${esc(r.service_number)}</div></td>
      <td class="num">${esc(r.invoices)}</td>
      <td class="num">${esc(r.from||"—")} → ${esc(r.to||"—")}</td>
      <td class="num">${r.total==null?"—":Number(r.total).toFixed(2)}</td>
    </tr>`).join("");
  const invoiceRows = (data.invoices||[]).map(r=>`
    <tr>
      <td class="num">${esc(r.invoice_number)}</td>
      <td class="num">${esc(r.invoice_date||"—")}</td>
      <td>${esc(r.product_family||"—")}<div class="meta">${esc(r.account_number||"")} ${(r.extras||[]).join(" · ")}</div></td>
      <td class="num">${esc((r.services||[]).length)} lines</td>
      <td class="num">${r.total==null?"—":Number(r.total).toFixed(2)}</td>
    </tr>`).join("");
  $("#app").innerHTML = `
    <div class="grid">
      <div class="card"><div class="k">Active</div><div class="v">${c.active??0}</div></div>
      <div class="card"><div class="k">Suspended</div><div class="v">${c.suspended??0}</div></div>
      <div class="card"><div class="k">Cancelled</div><div class="v">${c.cancelled_lines??0}</div></div>
    </div>
    <h2>GoWiFi incoming fibre · VK Pop</h2>
    <div class="card"><div class="meta">Own card for UISP: these two Openserve lines are the incoming fibre at VK Pop. A fibre fault here takes the wireless network with it. They also stay on the fibre list below.</div></div>
    <div class="card scroll">
      <table class="compact">
        <thead><tr><th>Role</th><th>Line</th><th>Status</th><th>Mb</th></tr></thead>
        <tbody>${incomingRows || `<tr><td colspan="4" class="meta">None mapped</td></tr>`}</tbody>
      </table>
    </div>
    <h2 class="toggle" id="books-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="books-fold">
      <span class="chev">▸</span>
      <span>Books</span>
      <span class="meta">no QuickBooks</span>
    </h2>
    <div id="books-fold" class="fold hidden">
      <div class="card"><div class="meta">${esc((data.books&&data.books.loop)||"Old QuickBooks history in, new invoices canned.")}</div>
        <div class="meta"><a href="/dash/invoice.html" style="color:var(--acc)">Canned invoices</a> · next ${esc((data.books&&data.books.customer_invoices&&data.books.customer_invoices.next)||"—")}</div></div>
      <div class="grid">
        <div class="card"><div class="k">Old invoices</div><div class="v">${(data.books&&data.books.history&&data.books.history.count)||0}</div><div class="meta">statement sits on the invoice · ${esc((data.books&&data.books.history&&data.books.history.payment_count)||(data.books&&data.books.history&&data.books.history.payments&&data.books.history.payments.length)||0)} payments</div></div>
        <div class="card"><div class="k">Openserve cost</div><div class="v">${(data.books&&data.books.openserve&&data.books.openserve.invoices)||0}</div><div class="meta">${(data.books&&data.books.openserve&&data.books.openserve.charged)!=null?Number(data.books.openserve.charged).toFixed(2):"—"}</div></div>
        <div class="card"><div class="k">FNB</div><div class="v">${(data.books&&data.books.fnb&&data.books.fnb.transactions)||((data.books&&data.books.fnb&&data.books.fnb.accounts)||[]).length}</div><div class="meta">${esc((data.books&&data.books.fnb&&data.books.fnb.note)||"")}</div></div>
        <div class="card"><div class="k">Netcash</div><div class="v">${(data.books&&data.books.netcash&&data.books.netcash.items)||0}</div><div class="meta">${esc((data.books&&data.books.netcash&&data.books.netcash.note)||((data.books&&data.books.ledger&&data.books.ledger.checksum&&data.books.ledger.checksum.note)||""))}</div></div>
        <div class="card"><div class="k">Clients</div><div class="v">${((data.books&&data.books.billing&&data.books.billing.accounts)||(data.books&&data.books.ledger&&data.books.ledger.clients)||[]).length}</div><div class="meta">${esc((data.books&&data.books.billing&&data.books.billing.rule)||"Invoice 17th · month in advance")}</div></div>
        <div class="card"><div class="k">Packages</div><div class="v">${(data.books&&data.books.packages&&data.books.packages.count)||((data.books&&data.books.packages&&data.books.packages.table)||[]).length||0}</div><div class="meta">Cost incl VAT · retail no VAT · markup to R99</div></div>
        <div class="card"><div class="k">Loans</div><div class="v">${((data.books&&data.books.ledger&&data.books.ledger.loans)||[]).length}</div><div class="meta">${((data.books&&data.books.ledger&&data.books.ledger.loans)||[]).map(a=>esc(a.name.split(":").slice(-1)[0])+" "+Number(a.net||0).toFixed(0)).join(" · ")||"Kevin / Walter"}</div></div>
      </div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Loan / expense</th><th>Kind</th><th>In</th><th>Out</th></tr></thead>
          <tbody>${((data.books&&data.books.ledger&&data.books.ledger.loans)||[]).concat((data.books&&data.books.ledger&&data.books.ledger.expenses)||[]).slice(0,24).map(a=>`
            <tr><td>${esc(a.name||"—")}</td><td>${esc(a.kind||"—")}</td>
            <td class="num">${Number(a.received||0).toFixed(2)}</td>
            <td class="num">${Number(a.spent||0).toFixed(2)}</td></tr>`).join("") || `<tr><td colspan="4" class="meta">No accounts yet</td></tr>`}</tbody>
        </table>
      </div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Client</th><th>Inv 17th</th><th>D/O</th><th>Due</th></tr></thead>
          <tbody>${((data.books&&data.books.billing&&data.books.billing.accounts)||[]).map(r=>`
            <tr><td>${esc(r.name||"—")}<div class="meta">${esc(r.access||"")} · ${esc(r.package||r.method||"")}${r.discount?" · discount":""}${r.pending_do?` · D/O ${esc(r.pending_do.action_date)} ${esc(r.pending_do.status)}`:""}</div></td>
            <td class="num">${esc(r.last_invoice_date||"—")}${r.invoice_amount!=null?`<div class="meta">${Number(r.invoice_amount).toFixed(2)}</div>`:""}</td>
            <td class="num">${r.do_amount==null?"EFT":Number(r.do_amount).toFixed(2)}</td>
            <td class="num">${r.nil?"nil":(r.due==null?"—":Number(r.due).toFixed(2))}</td></tr>`).join("") || `<tr><td colspan="4" class="meta">No client accounts yet</td></tr>`}</tbody>
        </table>
      </div>
      ${(() => {
        const watch = data.books&&data.books.packages&&data.books.packages.increase_watch;
        if (!watch) return "";
        return `<div class="card ${watch.due?"warn":""}"><div class="k">${esc(watch.headline||"Openserve increase watch")}</div>
          <div class="meta">${esc(watch.note||"")}</div>
          <div class="meta">${esc(watch.action||"")} · ${esc(watch.channel||"whatsapp")} · effective ${esc(watch.effective||"1 April")}${watch.due?" · due now":""}</div></div>`;
      })()}
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Product</th><th>Speed</th><th>Cost</th><th>Retail</th></tr></thead>
          <tbody>${((data.books&&data.books.packages&&data.books.packages.table)||[]).map(r=>`
            <tr><td>${esc(r.product||"—")}<div class="meta">${esc(r.family||"")}${r.kind==="gigabit"?" · from 1 Jul 2026":""}${r.retail_source==="live"?" · live":""}</div></td>
            <td class="num">${esc(r.speed||"—")}</td>
            <td class="num">${r.cost==null?"—":Number(r.cost).toFixed(2)}<div class="meta">incl VAT we pay</div></td>
            <td class="num">${r.retail==null?"—":Number(r.retail).toFixed(0)}${r.margin!=null?`<div class="meta">+${Number(r.margin).toFixed(0)}</div>`:""}</td></tr>`).join("") || `<tr><td colspan="4" class="meta">No wholesale table yet</td></tr>`}</tbody>
        </table>
        <div class="meta" style="margin-top:8px">${esc((data.books&&data.books.packages&&data.books.packages.note)||"")}</div>
      </div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Once-off</th><th>Amount</th><th></th></tr></thead>
          <tbody>${((data.books&&data.books.packages&&data.books.packages.extras)||(data.books&&data.books.billing&&data.books.billing.extras)||[]).map(r=>`
            <tr><td>${esc(r.label||"—")}<div class="meta">${esc(r.note||"")}</div></td>
            <td class="num">${r.amount==null?"quote":Number(r.amount).toFixed(2)}</td>
            <td class="meta">${r.on_monthly_do?"on D/O":"not on monthly D/O"}</td></tr>`).join("") || `<tr><td colspan="3" class="meta">No extras</td></tr>`}</tbody>
        </table>
      </div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Date</th><th>Bounce / recovery</th><th>Amount</th></tr></thead>
          <tbody>${((data.books&&data.books.ledger&&data.books.ledger.bounces)||[]).map(r=>`
            <tr><td class="num">${esc(r.paid_on||"—")}</td><td>${esc(r.memo||r.payee||"—")}</td>
            <td class="num">${r.amount==null?"—":Number(r.amount).toFixed(2)}</td></tr>`).join("") || `<tr><td colspan="3" class="meta">No bounce recoveries on FNB yet · waiting on Netcash history</td></tr>`}</tbody>
        </table>
      </div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Date</th><th>FNB</th><th>Amount</th><th>Balance</th></tr></thead>
          <tbody>${((data.books&&data.books.fnb&&data.books.fnb.rows)||[]).map(r=>`
            <tr><td class="num">${esc(r.paid_on||"—")}</td><td>${esc(r.description||"—")}</td>
            <td class="num">${r.amount==null?"—":Number(r.amount).toFixed(2)}</td>
            <td class="num">${r.balance==null?"—":Number(r.balance).toFixed(2)}</td></tr>`).join("") || `<tr><td colspan="4" class="meta">No FNB history yet</td></tr>`}</tbody>
        </table>
      </div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>#</th><th>Date</th><th>Client</th><th>What for</th><th>Amount</th></tr></thead>
          <tbody>${((data.books&&data.books.history&&data.books.history.invoices)||[]).map(r=>`
            <tr><td class="num"><a href="/dash/invoice.html?n=${esc(r.invoice_number)}" style="color:var(--acc)">${esc(r.invoice_number)}</a></td>
            <td class="num">${esc(r.invoice_date||"—")}</td><td>${esc(r.customer||"—")}<div class="meta">${esc(r.source||"")}</div></td>
            <td>${esc(r.description||"Monthly service")}</td>
            <td class="num">${r.amount==null?"—":Number(r.amount).toFixed(2)}</td></tr>`).join("") || `<tr><td colspan="5" class="meta">No QuickBooks invoices in mail yet</td></tr>`}</tbody>
        </table>
      </div>
    </div>
    <h2>Active accounts</h2>
    <div class="card scroll">
      <table class="compact">
        <thead><tr><th>Client</th><th>Line</th><th>Status</th><th>Mb</th><th>Client for</th></tr></thead>
        <tbody>${activeRows || `<tr><td colspan="5" class="meta">None</td></tr>`}</tbody>
      </table>
    </div>
    <h2 class="toggle" id="cancel-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="cancel-fold">
      <span class="chev">▸</span>
      <span>Cancelled</span>
      <span class="meta">${c.cancelled_lines??0}${c.never_installed?` · ${c.never_installed} never installed`:""}</span>
    </h2>
    <div id="cancel-fold" class="fold hidden">
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Client</th><th>Line</th><th>Status</th><th>Client for</th></tr></thead>
          <tbody>${cancelledLineRows || `<tr><td colspan="4" class="meta">None</td></tr>`}</tbody>
        </table>
      </div>
    </div>
    <h2 class="toggle" id="invoice-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="invoice-fold">
      <span class="chev">▸</span>
      <span>Openserve invoices</span>
      <span class="meta">${c.invoices??0}</span>
    </h2>
    <div id="invoice-fold" class="fold hidden">
      <div class="card"><div class="meta">${esc(cov.gap||"Openserve invoice copies are imported from kevin@ mail.")}</div>
        <div class="meta">Statement accounts: ${esc((cov.statement_accounts||[]).join(", ")||"—")}</div>
        <div class="meta">Bank proof of payment: ${esc(cov.pop_status||"awaiting upload")}</div></div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Openserve account</th><th>Product</th><th>Invoices</th><th>Period</th><th>Charged</th></tr></thead>
          <tbody>${accountRows || `<tr><td colspan="5" class="meta">None</td></tr>`}</tbody>
        </table>
      </div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Line</th><th>Invoices</th><th>Period</th><th>Charged</th></tr></thead>
          <tbody>${chargeRows || `<tr><td colspan="4" class="meta">None</td></tr>`}</tbody>
        </table>
      </div>
      <div class="card scroll">
        <table class="compact">
          <thead><tr><th>Invoice</th><th>Date</th><th>Product</th><th>Lines</th><th>Total</th></tr></thead>
          <tbody>${invoiceRows || `<tr><td colspan="5" class="meta">No Openserve invoice CSVs in mail yet</td></tr>`}</tbody>
        </table>
      </div>
    </div>
    <h2>Suspended</h2>
    <div class="card scroll">
      <table class="compact">
        <thead><tr><th>Client</th><th>Line</th><th>Status</th><th>Mb</th><th>Suspended for</th></tr></thead>
        <tbody>${suspendedRows || `<tr><td colspan="5" class="meta">None</td></tr>`}</tbody>
      </table>
    </div>
  `;
  const toggle = $("#cancel-toggle");
  const fold = $("#cancel-fold");
  const setOpen = (open) => {
    fold.classList.toggle("hidden", !open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.querySelector(".chev").textContent = open ? "▾" : "▸";
  };
  toggle.addEventListener("click", () => setOpen(fold.classList.contains("hidden")));
  toggle.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setOpen(fold.classList.contains("hidden")); }
  });
  const invToggle = $("#invoice-toggle");
  const invFold = $("#invoice-fold");
  const booksToggle = $("#books-toggle");
  const booksFold = $("#books-fold");
  if (booksToggle && booksFold) {
    const setBooks = (open) => {
      booksFold.classList.toggle("hidden", !open);
      booksToggle.setAttribute("aria-expanded", open ? "true" : "false");
      booksToggle.querySelector(".chev").textContent = open ? "▾" : "▸";
    };
    booksToggle.addEventListener("click", () => setBooks(booksFold.classList.contains("hidden")));
    booksToggle.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setBooks(booksFold.classList.contains("hidden")); }
    });
  }
  if (invToggle && invFold) {
    const setInv = (open) => {
      invFold.classList.toggle("hidden", !open);
      invToggle.setAttribute("aria-expanded", open ? "true" : "false");
      invToggle.querySelector(".chev").textContent = open ? "▾" : "▸";
    };
    invToggle.addEventListener("click", () => setInv(invFold.classList.contains("hidden")));
    invToggle.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); setInv(invFold.classList.contains("hidden")); }
    });
  }
}
fetch("accounts.json?v="+Date.now(),{credentials:"same-origin", cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("accounts.json "+r.status); return r.json(); })
  .then(render)
  .catch(e=>{ $("#app").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
</script>
</body>
</html>
