# Included from /home/user-data/www/gowifi.co.za.conf
# Browser stays on the dash. This proxies to books_api.py on loopback.
location = /dash/api/books {
	auth_basic "GoWifi Admin";
	auth_basic_user_file /home/user-data/www/.gowifi-dash.htpasswd;
	proxy_pass http://127.0.0.1:8797/books;
	proxy_set_header Host $host;
	proxy_connect_timeout 10s;
	proxy_read_timeout 60s;
}
location = /dash/api/books-health {
	auth_basic "GoWifi Admin";
	auth_basic_user_file /home/user-data/www/.gowifi-dash.htpasswd;
	proxy_pass http://127.0.0.1:8797/health;
	proxy_set_header Host $host;
}
