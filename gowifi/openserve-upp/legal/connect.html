<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect GoWiFi Box</title>
<link rel="stylesheet" href="legal.css">
</head>
<body>
<header>
  <div class="brand">GoWifi (Pty) Ltd</div>
</header>
<main class="card">
  <h1>Connect QuickBooks</h1>
  <p class="meta">GoWiFi Box</p>
  <p>One click. Sign in if Intuit asks. Click <strong>Allow</strong>. Do not open Settings.</p>
  <p><a id="connect" class="btn" href="https://appcenter.intuit.com/connect/oauth2?client_id=AB5s2E5POPO4qzGRXLNEmMvP0LC2fGgXKzcHZy1RUI4bsBhhvjD&amp;response_type=code&amp;scope=com.intuit.quickbooks.accounting&amp;redirect_uri=https%3A%2F%2Fgowifi.co.za%2Flegal%2Fqb-callback.html&amp;state=gowifi-box">Connect to QuickBooks</a></p>
  <p id="err" class="meta"></p>
  <p>Questions: <a href="mailto:accounts@go-wifi.co.za">accounts@go-wifi.co.za</a> · 076 263 9937</p>
<script>
(function () {
  var a = document.getElementById("connect");
  var err = document.getElementById("err");
  fetch("/legal/qb-start", {credentials: "same-origin"}).then(function (r) { return r.json(); }).then(function (d) {
    if (d.url) a.href = d.url;
    else err.textContent = d.error || "Connect is not ready.";
  }).catch(function () {});
})();
</script>
</main>
</body>
</html>
