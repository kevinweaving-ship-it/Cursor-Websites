<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoWiFi Box QuickBooks callback</title>
<link rel="stylesheet" href="legal.css">
</head>
<body>
<header>
  <div class="brand">GoWifi (Pty) Ltd</div>
</header>
<main class="card">
  <h1 id="title">Wrong page</h1>
  <p id="msg">Do not type this address in Chrome. It is only a bounce-back for Intuit.</p>
  <p><a href="https://developer.intuit.com">Open Intuit Developer</a></p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var title = document.getElementById("title");
  var el = document.getElementById("msg");
  if (q.get("error")) {
    title.textContent = "Intuit error";
    el.textContent = "Intuit sent an error. Go back to Developer and try again.";
    return;
  }
  if (q.get("code")) {
    title.textContent = "Saving…";
    el.textContent = "Authorisation received. Saving on the box…";
    fetch("/legal/qb-token", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code: q.get("code"), realmId: q.get("realmId"), state: q.get("state")})
    }).then(function (r) { return r.json(); }).then(function (d) {
      title.textContent = d.ok ? "Connected" : "Not saved";
      el.textContent = d.ok ? "Connected. You can close this tab." : (d.error || "Could not save tokens.");
    }).catch(function () {
      title.textContent = "Not saved";
      el.textContent = "Could not reach the box.";
    });
  }
})();
</script>
</body>
</html>
