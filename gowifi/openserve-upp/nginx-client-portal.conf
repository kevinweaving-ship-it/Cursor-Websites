# Later: each client logs in here (own account only).
# Not the GoWifi Admin htpasswd. Portal has its own login.
# No client users are created yet — login form only.
location = /account {
	return 302 /account/index.php;
}
location = /account/ {
	return 302 /account/index.php;
}
location /account/ {
	alias /opt/dolibarr/htdocs/public/webportal/;
	index index.php;
	location ~ ^/account/(.*\.php)(/.*)?$ {
		include fastcgi_params;
		fastcgi_split_path_info ^/account/(.+\.php)(/.*)$;
		fastcgi_param SCRIPT_FILENAME /opt/dolibarr/htdocs/public/webportal/$1;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param HTTPS on;
		fastcgi_param HTTP_HOST $host;
		fastcgi_pass php-fpm;
		fastcgi_read_timeout 60s;
	}
}
