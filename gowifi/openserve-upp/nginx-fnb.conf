# Included from /home/user-data/www/gowifi.co.za.conf
location = /legal/fnb-status {
	proxy_pass http://127.0.0.1:8798/status;
	proxy_set_header Host $host;
}
location = /legal/fnb-save {
	proxy_pass http://127.0.0.1:8798/save;
	proxy_set_header Host $host;
}
location = /legal/fnb-pull {
	proxy_pass http://127.0.0.1:8798/pull;
	proxy_set_header Host $host;
	proxy_connect_timeout 30s;
	proxy_send_timeout 180s;
	proxy_read_timeout 180s;
}
location = /legal/fnb-card {
	proxy_pass http://127.0.0.1:8798/card;
	proxy_set_header Host $host;
}
