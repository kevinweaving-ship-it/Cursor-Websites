# Included from /home/user-data/www/gowifi.co.za.conf
location = /dash/api/unifi {
	auth_basic "GoWifi Admin";
	auth_basic_user_file /home/user-data/www/.gowifi-dash.htpasswd;
	proxy_pass http://127.0.0.1:8801/summary$is_args$args;
	proxy_set_header Host $host;
	proxy_connect_timeout 10s;
	proxy_send_timeout 45s;
	proxy_read_timeout 45s;
}
