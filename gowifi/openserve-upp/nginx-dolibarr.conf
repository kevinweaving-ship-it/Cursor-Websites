# Included from /home/user-data/www/gowifi.co.za.conf
# Trial Dolibarr 24.0.2 — own tree, not Mail-in-a-Box www.
# Survives `sudo mailinabox` because this file is appended to the persist include.
location = /dolibarr {
	return 302 /dolibarr/;
}
location /dolibarr/ {
	auth_basic "GoWifi Admin";
	auth_basic_user_file /home/user-data/www/.gowifi-dash.htpasswd;
	alias /opt/dolibarr/htdocs/;
	index index.php;
	location ~ ^/dolibarr/(.*\.php)(/.*)?$ {
		auth_basic "GoWifi Admin";
		auth_basic_user_file /home/user-data/www/.gowifi-dash.htpasswd;
		include fastcgi_params;
		fastcgi_split_path_info ^/dolibarr/(.+\.php)(/.*)$;
		fastcgi_param SCRIPT_FILENAME /opt/dolibarr/htdocs/$1;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param HTTPS on;
		fastcgi_param HTTP_HOST $host;
		fastcgi_pass php-fpm;
		fastcgi_read_timeout 180s;
	}
}
