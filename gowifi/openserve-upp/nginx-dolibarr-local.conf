# Loopback-only Dolibarr REST. Not on the public vhost. No basic auth.
# Dash / books_api.py call this; browsers do not.
server {
	listen 127.0.0.1:8091;
	server_name localhost;
	location /dolibarr/ {
		alias /opt/dolibarr/htdocs/;
		index index.php;
		location ~ ^/dolibarr/(.*\.php)(/.*)?$ {
			include fastcgi_params;
			fastcgi_split_path_info ^/dolibarr/(.+\.php)(/.*)$;
			fastcgi_param SCRIPT_FILENAME /opt/dolibarr/htdocs/$1;
			fastcgi_param PATH_INFO $fastcgi_path_info;
			fastcgi_param HTTPS off;
			fastcgi_param HTTP_HOST localhost;
			fastcgi_pass unix:/run/php/php8.0-fpm.sock;
			fastcgi_read_timeout 180s;
		}
	}
}
