# Loopback-only Dolibarr REST. Document root is htdocs so Restler
# sees /api/index.php/thirdparties, not /dolibarr/api/...
server {
	listen 127.0.0.1:8091;
	server_name localhost;
	root /opt/dolibarr/htdocs;
	location / {
		return 404;
	}
	location ~ ^/api/index.php(/.*)?$ {
		include fastcgi_params;
		fastcgi_split_path_info ^(/api/index.php)(/.*)$;
		fastcgi_param SCRIPT_FILENAME /opt/dolibarr/htdocs/api/index.php;
		fastcgi_param SCRIPT_NAME /api/index.php;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param HTTPS on;
		fastcgi_param HTTP_HOST gowifi.co.za;
		fastcgi_param SERVER_NAME gowifi.co.za;
		fastcgi_pass php-fpm;
		fastcgi_read_timeout 180s;
	}
}
