    <script>
    (function () {
        var TZ = "Africa/Johannesburg";
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        function pad(n) { return String(n).padStart(2, "0"); }
        function saStamp() {
            var d = new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
            var dateEl = document.getElementById("lcd-date");
            var timeEl = document.getElementById("lcd-time");
            if (dateEl) dateEl.textContent = pad(d.getDate()) + " " + months[d.getMonth()] + " " + d.getFullYear();
            if (timeEl) timeEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
        }
        saStamp();
    })();
    </script>

    <script type="module">
      (async function () {
        // TEST camera: EZVIZ C8C via go2rtc stream "carport_test" (VTM cloud relay -> h264 640x360). No replay, no snapshots yet.
        var CAM = "https://sailingsa.co.za:8443/";
        var box = document.getElementById("bing-cams"); if (!box) return;
        var grid = box.querySelector(".cam-grid"), btn = document.getElementById("bing-live-btn"), upd = document.getElementById("bing-cams-upd");
        try { await import(CAM + "video-stream.js"); } catch (e) { console.warn("cams load failed", e); upd.textContent = "stream module unavailable"; return; }
        var HIDE_MS = 60000, SAFETY_MS = 300000, hideT = null, safeT = null, shown = false, startedAt = 0;
        function load() {
          grid.querySelectorAll(".cam-cell").forEach(function (cell) {
            if (cell.querySelector("video-stream")) return;
            var msg = document.createElement("div"); msg.className = "cam-msg"; msg.innerHTML = '<span class="cam-spin"></span>connecting to EZVIZ cloud… (first frame ~6 s)';
            cell.appendChild(msg);
            var el = document.createElement("video-stream"); el.mode = "webrtc,mse"; el.background = false;
            el.src = new URL("api/ws?src=" + cell.getAttribute("data-cam"), CAM);
            cell.appendChild(el);
            var tries = 0, iv = setInterval(function () {
              var v = el.video || el.querySelector("video");
              if (v && v.videoWidth > 0 && v.currentTime > 0.2) { clearInterval(iv); msg.remove(); upd.textContent = "live · " + v.videoWidth + "×" + v.videoHeight + " · first frame " + ((Date.now() - startedAt) / 1000).toFixed(1) + " s"; }
              else if (++tries > 900 || !el.isConnected) { clearInterval(iv); msg.textContent = "no video (camera offline or relay busy)"; }
            }, 50);
          });
        }
        function unload() { grid.querySelectorAll(".cam-cell video-stream, .cam-cell .cam-msg").forEach(function (el) { el.remove(); }); }
        function show() {
          startedAt = Date.now(); shown = true; grid.hidden = false; box.classList.add("live-mode");
          btn.querySelector(".live-btn-sub").textContent = "Live · hides after 1 min · tap to stop"; load();
          if (hideT) clearTimeout(hideT); hideT = setTimeout(hide, HIDE_MS);
          if (safeT) clearTimeout(safeT); safeT = setTimeout(hide, SAFETY_MS);
        }
        function hide() {
          shown = false; grid.hidden = true; unload(); box.classList.remove("live-mode"); upd.textContent = "";
          btn.querySelector(".live-btn-sub").textContent = "Carport camera · EZVIZ";
          if (hideT) { clearTimeout(hideT); hideT = null; } if (safeT) { clearTimeout(safeT); safeT = null; }
        }
        btn.addEventListener("click", function () { if (shown) hide(); else show(); });
        document.addEventListener("visibilitychange", function () { if (document.hidden && shown) hide(); });
      })();
    </script>
