# Additive go2rtc streams for /stanford/ only. Do not replace Voelklip or Bing streams.
# Same encode as Bing Carport: 640p h264 baseline 12 fps via hikpoc ffmpeg.
  stanford_eb5: exec:bash -c "trap 'kill 0' EXIT TERM INT; /opt/hikpoc/venv/bin/python /opt/ezvizpoc/bridge_ezviz_snap.py BF4277838 /tmp/stanford_eb5.jpg 2>>/opt/ezvizpoc/out/bridge_stanford_eb5.log && /opt/hikpoc/bin/ffmpeg -hide_banner -loglevel error -loop 1 -i /tmp/stanford_eb5.jpg -an -vf scale=640:-2 -r 12 -vsync cfr -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -pix_fmt yuv420p -g 12 -muxdelay 0 -muxpreload 0 -rtsp_transport tcp -f rtsp {output}"
  stanford_front_garage: exec:bash -c "trap 'kill 0' EXIT TERM INT; /opt/hikpoc/venv/bin/python /opt/ezvizpoc/bridge_ezviz_snap.py BF4277866 /tmp/stanford_front_garage.jpg 2>>/opt/ezvizpoc/out/bridge_stanford_front_garage.log && /opt/hikpoc/bin/ffmpeg -hide_banner -loglevel error -loop 1 -i /tmp/stanford_front_garage.jpg -an -vf scale=640:-2 -r 12 -vsync cfr -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -pix_fmt yuv420p -g 12 -muxdelay 0 -muxpreload 0 -rtsp_transport tcp -f rtsp {output}"
