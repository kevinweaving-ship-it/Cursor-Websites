# Additive go2rtc streams for /stanford/ only. Do not replace Voelklip or Bing streams.
# Paste under streams: in /opt/hikpoc/go2rtc.yaml
  stanford_eb5: exec:bash -c "trap 'kill 0' EXIT TERM INT; PYTHONUNBUFFERED=1 /opt/hikpoc/venv/bin/python /opt/ezvizpoc/bridge_ezviz_rtp.py BF4277838 2>>/opt/ezvizpoc/out/bridge_stanford_eb5.log | /opt/hikpoc/bin/ffmpeg -hide_banner -loglevel error -fflags nobuffer+genpts -flags low_delay -err_detect ignore_err -probesize 2000000 -analyzeduration 5000000 -f hevc -i pipe:0 -an -vf scale=1280:-2 -r 12 -vsync cfr -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -pix_fmt yuv420p -g 12 -muxdelay 0 -muxpreload 0 -rtsp_transport tcp -f rtsp {output}"
  stanford_front_garage: exec:bash -c "trap 'kill 0' EXIT TERM INT; PYTHONUNBUFFERED=1 /opt/hikpoc/venv/bin/python /opt/ezvizpoc/bridge_ezviz_rtp.py BF4277866 2>>/opt/ezvizpoc/out/bridge_stanford_front_garage.log | /opt/hikpoc/bin/ffmpeg -hide_banner -loglevel error -fflags nobuffer+genpts -flags low_delay -err_detect ignore_err -probesize 2000000 -analyzeduration 5000000 -f hevc -i pipe:0 -an -vf scale=1280:-2 -r 12 -vsync cfr -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -pix_fmt yuv420p -g 12 -muxdelay 0 -muxpreload 0 -rtsp_transport tcp -f rtsp {output}"
