<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Arial — Keypad</title>
    <link rel="stylesheet" href="/arial/arial.css">
</head>
<body class="arial-keypad-page">
    <header class="kp-top">
        <span class="kp-brand">Arial</span>
        <div id="site-chips" class="kp-sites"></div>
    </header>
    <main class="kp-wrap">
        <div class="kp-housing" id="keypad">
            <div class="kp-bezel">PARADOX</div>
            <div class="kp-lcd" aria-live="polite">
                <div class="kp-lcd-row">
                    <span id="lcd-left">—</span>
                    <span id="lcd-right">—</span>
                </div>
                <div class="kp-lcd-row kp-lcd-status" id="lcd-status">Connecting…</div>
            </div>
            <div class="kp-leds">
                <div class="kp-led">
                    <span id="led-ac" class="kp-dot kp-dot-ac"></span>
                    <span class="kp-led-cap">AC</span>
                </div>
                <div class="kp-led">
                    <span id="led-status" class="kp-dot kp-dot-status"></span>
                    <span class="kp-led-cap">STATUS</span>
                </div>
            </div>
            <div class="kp-grid kp-fn">
                <button type="button" data-key="STAY">STAY</button>
                <button type="button" data-key="FORCE">FORCE</button>
                <button type="button" data-key="ARM">ARM</button>
                <button type="button" data-key="DISARM">DISARM</button>
                <button type="button" data-key="BYP">BYP</button>
                <button type="button" data-key="MEM">MEM</button>
                <button type="button" data-key="TBL">TBL</button>
                <button type="button" data-key="ACC">ACC</button>
            </div>
            <div class="kp-lower">
                <div class="kp-grid kp-num">
                    <button type="button" data-key="1"><span class="kp-sub">AREAS</span>1</button>
                    <button type="button" data-key="2">2</button>
                    <button type="button" data-key="3">3</button>
                    <button type="button" data-key="4"><span class="kp-sub">EVENT</span>4</button>
                    <button type="button" data-key="5"><span class="kp-sub">INSTANT</span>5</button>
                    <button type="button" data-key="6"><span class="kp-sub">DISPLAY</span>6</button>
                    <button type="button" data-key="7">7</button>
                    <button type="button" data-key="8"><span class="kp-sub">TEST</span>8</button>
                    <button type="button" data-key="9"><span class="kp-sub">CHIME</span>9</button>
                    <button type="button" data-key="CLEAR">CLEAR</button>
                    <button type="button" data-key="0"><span class="kp-sub">PRG</span>0</button>
                    <button type="button" data-key="ENTER">ENTER</button>
                </div>
                <div class="kp-arrows">
                    <button type="button" data-key="UP" aria-label="Up">▲</button>
                    <button type="button" data-key="DOWN" aria-label="Down">▼</button>
                </div>
            </div>
        </div>
    </main>
    <script src="/arial/app.js"></script>
</body>
</html>
