<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SailingSA · Header development</title>
<style>
:root{color-scheme:light;--navy:#001f3f;--line:#dbe5ef;--light:#f5f7fb;--text:#001f3f}
*{box-sizing:border-box}body{margin:0;background:var(--light);font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.dev-header{min-height:64px;background:var(--navy);color:white;border-bottom:1px solid #36506d}
.dev-header-inner{width:100%;max-width:1100px;margin:auto;min-height:64px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;min-width:0;flex:0 1 168px}.logo img{display:block;width:100%;height:auto;max-height:48px;object-fit:contain;object-position:left center}
.auth{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex:0 0 auto;min-width:0}
.auth a,.auth button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 10px;font:700 12px/1.15 system-ui,sans-serif;text-decoration:none;border-radius:8px;border:1px solid #b7c6d7;white-space:nowrap;cursor:pointer}
.sign-in{background:#fff;color:var(--navy)}.sign-up{background:#c62828;color:#fff;border-color:#c62828!important}.account{color:#fff;background:transparent!important}.sign-out{background:#fff;color:var(--navy)}
.auth[hidden],.auth-item[hidden]{display:none!important}
.auth-status{padding:12px 14px;margin:18px auto 0;max-width:600px;background:#fff;border:1px solid var(--line);border-radius:10px}
.auth-status strong{display:block}.auth-status p{margin:6px 0 0;color:#526477}
a:focus-visible,button:focus-visible{outline:3px solid #e5c394;outline-offset:3px}
@media(max-width:390px){.dev-header-inner{gap:7px;padding-inline:8px}.logo{flex-basis:112px}.auth a,.auth button{font-size:11px;padding:6px 7px}.auth{gap:4px}}
</style></head><body>
<header class="dev-header" aria-label="SailingSA header"><div class="dev-header-inner">
<a href="/" class="logo" aria-label="SailingSA homepage"><img src="/assets/logos/sailingsa-logo.png" alt="SailingSA"></a>
<nav class="auth" id="loggedOut" aria-label="Account" hidden><a class="sign-up" href="/signup.html">Sign Up</a><a class="sign-in" href="/login.html?v=20261028login">Sign In</a></nav>
<nav class="auth" id="loggedIn" aria-label="Account" hidden><a class="account" href="/" id="accountLink">My SailingSA</a><button type="button" class="sign-out" id="logout">Logout</button></nav>
</div></header>
<main><section class="auth-status" aria-live="polite"><strong>Header-only development page</strong><p id="status">Checking the existing SailingSA session…</p></section></main>
<script>
(() => {
"use strict";
const loggedOut=document.getElementById("loggedOut"),loggedIn=document.getElementById("loggedIn"),status=document.getElementById("status"),account=document.getElementById("accountLink");
function setState(user){loggedOut.hidden=!!user;loggedIn.hidden=!user;if(user){const full=(user.full_name||[user.first_name,user.last_name].filter(Boolean).join(" ")).trim();account.textContent=full||"My SailingSA";status.textContent="Signed in through the existing SailingSA session.";}else{status.textContent="Not signed in. Sign In and Sign Up use the existing SailingSA pages.";}}
fetch("/auth/session?path=%2F",{credentials:"same-origin",cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Session check unavailable");return r.json()}).then(data=>setState(data&&data.valid?(data.user||{}):null)).catch(()=>{setState(null);status.textContent="Session check unavailable. No account actions have been performed.";});
document.getElementById("logout").addEventListener("click",async()=>{if(!confirm("Log out of your existing SailingSA session?"))return;const button=document.getElementById("logout");button.disabled=true;try{const r=await fetch("/auth/logout",{method:"POST",credentials:"same-origin"});if(!r.ok)throw Error("Logout failed");setState(null);status.textContent="Logged out of SailingSA.";}catch(e){status.textContent="Logout failed; your session was not cleared by this page.";}finally{button.disabled=false;}});
})();
</script></body></html>
