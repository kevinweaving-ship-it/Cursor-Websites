<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001f3f"><meta name="robots" content="noindex,nofollow"><title>SailingSA · Header development</title>
<style>
:root{color-scheme:light;--navy:#001f3f;--line:#dbe5ef;--light:#f5f7fb;--text:#001f3f}
*{box-sizing:border-box}html{background:#001f3f}body{margin:0;background:#001f3f;font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.dev-header{min-height:80px;background:var(--navy);color:white;border-bottom:1px solid #36506d}
.dev-header-inner{width:100%;max-width:1100px;margin:auto;min-height:80px;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}.logo img{display:block;width:100%;height:auto;max-height:48px;object-fit:contain;object-position:left center}
.auth{display:flex;gap:6px;justify-content:flex-end;align-items:center;min-width:0;grid-column:3}.account-center{grid-column:2;justify-self:center;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;max-width:100%;text-align:center;color:#fff;font-weight:700;text-decoration:none;line-height:1.3}.account-center[hidden]{display:none}
.auth a,.auth button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 10px;font:700 12px/1.15 system-ui,sans-serif;text-decoration:none;border-radius:8px;border:1px solid #b7c6d7;white-space:nowrap;cursor:pointer;gap:5px}.auth a img{width:16px;height:16px;flex-shrink:0;display:block}.sign-in img{filter:invert(8%) sepia(92%) saturate(2500%) hue-rotate(185deg) brightness(92%) contrast(105%)}
.sign-in{background:#fff;color:var(--navy)}.sign-up{background:#eab308;color:#000;border-color:#eab308}.account{color:#fff;background:transparent!important}.sign-out{background:#fff;color:var(--navy)}
.auth[hidden],.auth-item[hidden]{display:none!important}
a:focus-visible,button:focus-visible{outline:3px solid #e5c394;outline-offset:3px}
@media(max-width:390px){.dev-header-inner{gap:7px;padding-inline:8px}.logo{max-width:112px}.auth a,.auth button{font-size:11px;padding:6px 7px}.auth{gap:4px}}
</style></head><body>
<header class="dev-header" aria-label="SailingSA header"><div class="dev-header-inner">
<a href="/" class="logo" aria-label="SailingSA homepage"><img src="/assets/logos/sailingsa-logo.png" alt="SailingSA"></a>
<nav class="auth" id="loggedOut" aria-label="Account" hidden><a class="sign-up" href="/signup.html"><img src="/icons/assets/iconoir/regular/edit.svg" alt="" width="16" height="16">Sign Up</a><a class="sign-in" href="/login.html?v=20261028login"><img src="/icons/assets/phosphor/bold/user-circle-gear-bold.svg" alt="" width="16" height="16">Login</a></nav>
<a class="account-center" href="/" id="accountLink" hidden><span id="accountName">My SailingSA</span></a><nav class="auth" id="loggedIn" aria-label="Account" hidden><button type="button" class="sign-out" id="logout">Logout</button></nav>
</div></header>
<script>
(() => {
"use strict";
const loggedOut=document.getElementById("loggedOut"),loggedIn=document.getElementById("loggedIn"),account=document.getElementById("accountLink"),accountName=document.getElementById("accountName");
function setState(user){loggedOut.hidden=!!user;loggedIn.hidden=!user;account.hidden=!user;if(user){const full=(user.full_name||[user.first_name,user.last_name].filter(Boolean).join(" ")).trim();accountName.textContent=full||"My SailingSA";}else{accountName.textContent="My SailingSA";}}
fetch("/auth/session?path=%2F",{credentials:"same-origin",cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Session check unavailable");return r.json()}).then(data=>setState(data&&data.valid?(data.user||{}):null)).catch(()=>{setState(null);});
function askAutoLogin(){
return new Promise(resolve=>{
 const overlay=document.createElement("div");overlay.style.cssText="position:fixed;inset:0;z-index:9999999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center";
 const box=document.createElement("div");box.style.cssText="background:#fff;border-radius:10px;padding:22px;max-width:300px;width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.28);color:#1a365d";
 const heading=document.createElement("strong");heading.textContent="Auto Login";heading.style.cssText="display:block;font-size:17px;margin-bottom:8px";
 const question=document.createElement("p");question.textContent="Sign in automatically next time?";question.style.cssText="margin:0 0 16px;font-size:14px;color:#2d3748";
 const actions=document.createElement("div");actions.style.cssText="display:flex;gap:12px;justify-content:center";
 function choice(label,yes){const b=document.createElement("button");b.type="button";b.textContent=label;b.style.cssText="padding:9px 22px;border:0;border-radius:7px;font-size:14px;font-weight:600;min-width:88px;cursor:pointer;background:"+(yes?"#1a365d":"#e2e8f0")+";color:"+(yes?"#fff":"#1a365d");b.addEventListener("click",()=>{overlay.remove();resolve(yes)},{once:true});actions.appendChild(b)}
 choice("Yes",true);choice("No",false);box.append(heading,question,actions);overlay.appendChild(box);document.body.appendChild(overlay);
});
}
document.getElementById("logout").addEventListener("click",async()=>{
 const keepRemember=await askAutoLogin();
 const button=document.getElementById("logout");button.disabled=true;
 try{
  const token=localStorage.getItem("session")||localStorage.getItem("sailing_session")||"";
  const r=await fetch("/auth/logout",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({keep_remember:keepRemember,session_token:token})});
  if(!r.ok)throw Error("Logout failed");
  localStorage.removeItem("session");localStorage.removeItem("sailing_session");
  document.cookie="session=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT;";
  document.cookie="session_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT;";
  if(keepRemember){localStorage.setItem("remember_credentials","true");sessionStorage.removeItem("disable_auto_login_once");}
  else{sessionStorage.setItem("disable_auto_login_once","true");["saved_username","saved_email","saved_password","ssa_id_passwords","ssa_login_history","remember_credentials","saved_login_method"].forEach(k=>localStorage.removeItem(k));}
  setState(null);
 }catch(e){alert("Logout failed. Please try again.");}
 finally{button.disabled=false;}
});
})();
</script></body></html>
