<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimist Family — SailingSA</title>
  <link rel="icon" type="image/png" href="/assets/logos/sailingsa-logo.png">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f0f4f8; color: #1a1a1a; }
    .site-header { background: #001f3f; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    .site-header a { color: #fff; text-decoration: none; }
    .site-header-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; }
    .site-header-brand img { width: 36px; height: auto; border-radius: 4px; }
    .site-header-nav { margin-left: auto; display: flex; gap: 16px; font-size: 0.9rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .title { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin: 0 0 8px 0; }
    .subtitle { color: #64748b; margin-bottom: 16px; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .stat { text-align: center; padding: 12px 20px; background: #f0f9ff; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
    .stat:hover { background: #e0f2fe; }
    .stat.active { border-color: #001f3f; background: #001f3f; }
    .stat.active .stat-value, .stat.active .stat-label { color: #fff; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #0c4a6e; }
    .stat-label { font-size: 0.75rem; color: #64748b; }
    .stat.fleet-a { background: #fee2e2; } .stat.fleet-a .stat-value { color: #dc2626; }
    .stat.fleet-b { background: #dbeafe; } .stat.fleet-b .stat-value { color: #2563eb; }
    .stat.fleet-c { background: #dcfce7; } .stat.fleet-c .stat-value { color: #16a34a; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f8fafc; font-weight: 600; color: #475569; position: sticky; top: 0; cursor: pointer; }
    th:hover { background: #f1f5f9; }
    tr:hover { background: #f8fafc; }
    a { color: #001f3f; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .fleet-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .fleet-tag.fleet-a { background: #fee2e2; color: #dc2626; }
    .fleet-tag.fleet-b { background: #dbeafe; color: #2563eb; }
    .fleet-tag.fleet-c { background: #dcfce7; color: #16a34a; }
    .loading { padding: 40px; text-align: center; color: #64748b; }
    .search-box { padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; width: 250px; margin-bottom: 16px; }
    @media (max-width: 768px) {
      th, td { padding: 8px 6px; font-size: 0.8rem; }
      .search-box { width: 100%; }
      .stats { gap: 8px; }
      .stat { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-header-brand">
      <img src="/assets/logos/sailingsa-logo.png" alt="SailingSA">
      <span>SailingSA</span>
    </a>
    <nav class="site-header-nav">
      <a href="/">Home</a>
      <a href="/regattas">Regattas</a>
      <a href="/sailors">Sailors</a>
      <a href="/boats">Boats</a>
    </nav>
  </header>
  
  <main class="container">
    <div class="card">
      <h1 class="title">Optimist Family</h1>
      <p class="subtitle">Master list of all Optimist boats — click totals to filter by fleet</p>
      
      <div id="stats" class="stats">
        <div class="loading">Loading...</div>
      </div>
      
      <input type="text" id="search" class="search-box" placeholder="Search sail number or sailor...">
      
      <div id="table-container">
        <div class="loading">Loading Optimist boats...</div>
      </div>
    </div>
  </main>

  <script>
  (function() {
    var data = null;
    var currentFleet = 'all';
    var searchTerm = '';
    var sortCol = 'sail_number';
    var sortAsc = true;
    
    function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    
    function fleetTag(fleet) {
      var cls = 'fleet-generic';
      if (fleet === 'Optimist A') cls = 'fleet-a';
      else if (fleet === 'Optimist B') cls = 'fleet-b';
      else if (fleet === 'Optimist C') cls = 'fleet-c';
      var label = fleet.replace('Optimist ', '');
      return '<span class="fleet-tag ' + cls + '">' + esc(label) + '</span>';
    }
    
    function sortArrow(col) {
      if (sortCol !== col) return '';
      return sortAsc ? ' ▲' : ' ▼';
    }
    
    function compareVal(a, b, col) {
      var va = a[col], vb = b[col];
      if (col === 'sail_number') {
        var na = parseInt((va || '').replace(/[^0-9]/g, '')) || 999999;
        var nb = parseInt((vb || '').replace(/[^0-9]/g, '')) || 999999;
        return na - nb;
      }
      if (col === 'total_results') {
        return (va || 0) - (vb || 0);
      }
      if (col === 'last_race_date') {
        return (va || '').localeCompare(vb || '');
      }
      return String(va || '').localeCompare(String(vb || ''));
    }
    
    function render() {
      if (!data) return;
      
      var boats = data.boats.filter(function(b) {
        if (currentFleet !== 'all' && b.current_fleet !== currentFleet) return false;
        if (searchTerm) {
          var term = searchTerm.toLowerCase();
          var sail = (b.sail_number || '').toLowerCase();
          var helm = (b.helm_name || '').toLowerCase();
          if (sail.indexOf(term) === -1 && helm.indexOf(term) === -1) return false;
        }
        return true;
      });
      
      boats.sort(function(a, b) {
        var cmp = compareVal(a, b, sortCol);
        return sortAsc ? cmp : -cmp;
      });
      
      var html = '<table><thead><tr>' +
        '<th>#</th>' +
        '<th data-sort="sail_number">Sail #' + sortArrow('sail_number') + '</th>' +
        '<th data-sort="current_fleet">Fleet' + sortArrow('current_fleet') + '</th>' +
        '<th data-sort="helm_name">Last Helm' + sortArrow('helm_name') + '</th>' +
        '<th data-sort="last_race_date">Last Race' + sortArrow('last_race_date') + '</th>' +
        '<th data-sort="last_event">Event' + sortArrow('last_event') + '</th>' +
        '<th data-sort="total_results">Results' + sortArrow('total_results') + '</th>' +
        '</tr></thead><tbody>';
      
      boats.forEach(function(b, idx) {
        html += '<tr>' +
          '<td>' + (idx + 1) + '</td>' +
          '<td><a href="/boats?q=' + encodeURIComponent(b.sail_number) + '">' + esc(b.sail_number) + '</a></td>' +
          '<td>' + fleetTag(b.current_fleet) + '</td>' +
          '<td>' + esc(b.helm_name || '-') + '</td>' +
          '<td>' + esc(b.last_race_date || '-') + '</td>' +
          '<td><a href="/regatta/' + b.regatta_id + '">' + esc(b.last_event || '-') + '</a></td>' +
          '<td>' + (b.total_results || 0) + '</td>' +
          '</tr>';
      });
      
      html += '</tbody></table>';
      document.getElementById('table-container').innerHTML = html;
    }
    
    function renderStats() {
      var fc = data.fleet_counts;
      var active = function(f) { return currentFleet === f ? ' active' : ''; };
      document.getElementById('stats').innerHTML = 
        '<div class="stat' + active('all') + '" data-fleet="all"><div class="stat-value">' + data.total + '</div><div class="stat-label">All</div></div>' +
        '<div class="stat fleet-a' + active('Optimist A') + '" data-fleet="Optimist A"><div class="stat-value">' + (fc['Optimist A'] || 0) + '</div><div class="stat-label">A Fleet</div></div>' +
        '<div class="stat fleet-b' + active('Optimist B') + '" data-fleet="Optimist B"><div class="stat-value">' + (fc['Optimist B'] || 0) + '</div><div class="stat-label">B Fleet</div></div>' +
        '<div class="stat fleet-c' + active('Optimist C') + '" data-fleet="Optimist C"><div class="stat-value">' + (fc['Optimist C'] || 0) + '</div><div class="stat-label">C Fleet</div></div>';
    }
    
    function load() {
      fetch('/api/optimist-family')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          data = d;
          renderStats();
          render();
        })
        .catch(function(e) {
          document.getElementById('table-container').innerHTML = '<p style="color:red;">Error loading data</p>';
        });
    }
    
    document.getElementById('search').addEventListener('input', function(e) {
      searchTerm = e.target.value;
      render();
    });
    
    document.getElementById('stats').addEventListener('click', function(e) {
      var stat = e.target.closest('.stat[data-fleet]');
      if (!stat) return;
      currentFleet = stat.getAttribute('data-fleet');
      renderStats();
      render();
    });
    
    document.getElementById('table-container').addEventListener('click', function(e) {
      var th = e.target.closest('th[data-sort]');
      if (!th) return;
      var col = th.getAttribute('data-sort');
      if (sortCol === col) {
        sortAsc = !sortAsc;
      } else {
        sortCol = col;
        sortAsc = true;
      }
      render();
    });
    
    load();
  })();
  </script>
</body>
</html>
