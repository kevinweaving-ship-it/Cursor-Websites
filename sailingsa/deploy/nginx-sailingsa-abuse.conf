# SailingSA — stop scrape swarms taking the API down.
# Lives in /etc/nginx/conf.d/ (http context).
# Applied on sailor / boat / boat-name locations in sites-enabled/sailingsa.

limit_req_zone $binary_remote_addr zone=ssa_entity_ip:10m rate=5r/s;
# One shared bucket for all clients on expensive HTML pages.
limit_req_zone $server_name zone=ssa_entity_all:1m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=ssa_entity_conn:10m;

proxy_cache_path /var/cache/nginx/ssa_entity
    levels=1:2
    keys_zone=ssa_entity:20m
    max_size=256m
    inactive=30m
    use_temp_path=off;

limit_req_status 429;
limit_conn_status 429;
