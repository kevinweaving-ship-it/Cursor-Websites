# SailingSA — stop scrape swarms taking the API down.
# Lives in /etc/nginx/conf.d/ (http context).
# Applied on sailor / boat / boat-name / class / club locations in sites-enabled/sailingsa.
#
# Official Googlebot + special-crawlers CIDRs skip these limits (empty key = not limited).
# CIDR file: nginx-googlebot-cidrs.inc (from googlebot_cidrs_build.py).

geo $ssa_googlebot {
    default 0;
    include /etc/nginx/conf.d/googlebot-cidrs.inc;
}

map $ssa_googlebot $ssa_limit_ip {
    1 "";
    default $binary_remote_addr;
}

map $ssa_googlebot $ssa_limit_all {
    1 "";
    default $server_name;
}

limit_req_zone $ssa_limit_ip zone=ssa_entity_ip:10m rate=5r/s;
# One shared bucket for all clients on expensive HTML pages.
limit_req_zone $ssa_limit_all zone=ssa_entity_all:1m rate=12r/s;
limit_conn_zone $ssa_limit_ip zone=ssa_entity_conn:10m;

proxy_cache_path /var/cache/nginx/ssa_entity
    levels=1:2
    keys_zone=ssa_entity:20m
    max_size=256m
    inactive=30m
    use_temp_path=off;

limit_req_status 429;
limit_conn_status 429;
