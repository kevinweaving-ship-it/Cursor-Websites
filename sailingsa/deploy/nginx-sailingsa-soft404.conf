# Exact-match 404s for placeholder entity URLs that currently return 200.
# Google flags those as Soft 404. location = beats the /sailor/ prefix cache.
# Include from the sailingsa server block. Do not overwrite api.py.

location = /sailor/unknown { return 404; }
location = /sailor/none { return 404; }
location = /sailor/na { return 404; }
location = /sailor/n-a { return 404; }
location = /sailor/tbc { return 404; }
location = /sailor/tba { return 404; }
location = /sailor/tbd { return 404; }
location = /class/unknown { return 404; }
location = /boat/unknown { return 404; }
location = /club/none { return 404; }
location = /club/NONE { return 404; }
