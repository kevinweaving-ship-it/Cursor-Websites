# Arial Dev on sailingsa.co.za  —  add BEFORE location / in the sailingsa HTTPS server.
# Product UI: https://sailingsa.co.za/arial
#
# Later: use a separate server { server_name arial.co.za; } (do not add arial
# to the sailingsa server_name list). See ARIAL_DOMAIN.md.

    location ^~ /arial {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/arial/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

