# SailingSA server monitor. Mode 0600 on install.
# Recipient stored as E.164 digits (0720821111 → 27720821111).
# Token is NOT here — read at runtime from existing WAPOC_ENV.
RECIPIENT=27720821111
WAPOC_ENV=/etc/arial-whatsapp-poc.env
WAPOC_PORT=8009
# Allow a normal API restart before WhatsApp. Only alert if still down after this.
API_RESTART_GRACE_S=120
API_RESTART_PROBE_S=15
# Ignore nginx 502/503/504 and cold-pool journal hits this long after a restart.
API_RESTART_SETTLE_S=600
