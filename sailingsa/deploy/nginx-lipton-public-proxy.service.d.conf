[Service]
# Re-assert public Lipton slug → API after nginx start/reload.
# Watch uses nginx -s reload (not systemctl) to avoid ExecReload recursion.
ExecStartPost=/usr/bin/python3 /usr/local/sbin/lipton_public_not_dev_watch.py
ExecReload=/usr/bin/python3 /usr/local/sbin/lipton_public_not_dev_watch.py
