server {
    listen 80;
    server_name sailingsa.co.za www.sailingsa.co.za;
    include /etc/nginx/snippets/sailingsa-site-traffic.conf;

    # Drop PHP/CMS probe paths before proxy (stops API hang under floods)
    location ~* \.(?:php[0-9]?|asp|aspx|cgi|jsp)$ { return 403; }
    location ~* ^/(?:wp-|wordpress|xmlrpc|phpmyadmin|adminer|\.env) { return 403; }
    return 301 https://sailingsa.co.za$request_uri;
}


server {
    listen 443 ssl;
    server_name sailingsa.co.za www.sailingsa.co.za;


    # Drop PHP/CMS probe paths before proxy (stops API hang under floods)
    location ~* \.(?:php[0-9]?|asp|aspx|cgi|jsp)$ { return 403; }
    location ~* ^/(?:wp-|wordpress|xmlrpc|phpmyadmin|adminer|\.env) { return 403; }
    ssl_certificate /etc/letsencrypt/live/sailingsa.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sailingsa.co.za/privkey.pem;

    # Legacy mobile/dev path → canonical root (do not remove)
    location ^~ /sailingsa/frontend/ {
        rewrite ^/sailingsa/frontend/(.*)$ $scheme://$host/$1 permanent;
    }


    root /var/www/sailingsa;
    index index.html;

    location /js/ {
        root /var/www/sailingsa;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    
    location = /css/gold-list-tables.css {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /blank.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /blank.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

location ^~ /api/ {
