    # Club logos: never immutable-cache (transparent PNG updates must show immediately)
    location ^~ /artwork/Club%20Logo/ {
        alias "/var/www/sailingsa/api/artwork/Club Logo/";
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires -1;
        access_log off;
    }
    location ^~ "/artwork/Club Logo/" {
        alias "/var/www/sailingsa/api/artwork/Club Logo/";
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires -1;
        access_log off;
    }

    # Static event/class artwork — long cache (visitor click speed)
    location ^~ /artwork/ {
        root /var/www/sailingsa;
        # fallback to api artwork tree if root copy missing
        try_files $uri /api$uri @api;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location ~ ^/events-logos {
