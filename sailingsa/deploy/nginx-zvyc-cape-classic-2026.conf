# Exact URL only — gold Events Results parent for ZVYC Cape Classic 2026.
# Insert next to other `location = /regatta/...` blocks in sites-enabled/sailingsa.
# Does not change generic /regatta/{slug}.

    location = /regatta/2026-09-13-zvyc-cape-classic {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
    location = /regatta/2026-09-13-zvyc-cape-classic/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }
