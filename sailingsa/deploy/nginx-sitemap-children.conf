# Serve every sitemap child as static XML. Missing files must 404 as nginx
# XML/plain, not FastAPI application/json (GSC treats JSON 404 as "couldn't fetch").
# Insert BEFORE location / and BEFORE any location = /sitemap.xml proxy_pass.
#
#   nginx -t && systemctl reload nginx

location ~ ^/sitemap(-[a-z0-9]+)?\.xml$ {
    default_type application/xml;
    try_files $uri =404;
}
