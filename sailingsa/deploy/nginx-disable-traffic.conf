# TEMP: disable traffic dashboards + APIs (protect main site / API).
# Was hanging sailingsa-api (visual-overview / live / charts 20–280s) → 502s
# and multi-second landing refreshes (single uvicorn worker starved).
# Apply near the top of the HTTPS server{} in /etc/nginx/sites-enabled/sailingsa
# (before catch-all / proxy). Then: nginx -t && systemctl reload nginx
#
# Covers: /traffic, /traffic/, /traffic/api/*, /traffic-v2, /traffic-visual
# Pair with nginx-root-blank-hub.conf so `/` is static try_files, not proxy_pass.

    location ^~ /traffic-v2 {
        add_header Cache-Control "no-store";
        return 503;
    }
    location ^~ /traffic-visual {
        add_header Cache-Control "no-store";
        return 503;
    }
    location ^~ /traffic {
        add_header Cache-Control "no-store";
        return 503;
    }
