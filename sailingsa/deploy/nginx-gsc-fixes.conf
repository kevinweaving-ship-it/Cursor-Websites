# Search Console crawl/coverage fixes for sailingsa.co.za
# Apply on live via apply_gsc_nginx_fixes.py (idempotent). nginx -t && systemctl reload nginx
#
# 1) https://www.sailingsa.co.za/* → 301 https://sailingsa.co.za$request_uri
#    Dedicated 443 server. Main HTTPS server_name must be apex only.
# 2) /home and /home/ are duplicate homepages → 301 /
# 3) Empty class podium (no regatta_id) is a soft-404 → 301 /events

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sailingsa.co.za;

    ssl_certificate /etc/letsencrypt/live/sailingsa.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sailingsa.co.za/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sailingsa.co.za$request_uri;
}

