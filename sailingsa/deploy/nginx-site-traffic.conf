# Inject real-traffic beacon on HTML pages (nginx static). Include from sailingsa site server block:
#   include /etc/nginx/snippets/sailingsa-site-traffic.conf;
#
# Requires: sub_filter module (ngx_http_sub_module — standard on most nginx builds).

sub_filter_types text/html;
sub_filter '</body>' '<script src="/js/site-traffic.js" defer></script></body>';
sub_filter '</BODY>' '<script src="/js/site-traffic.js" defer></script></BODY>';
sub_filter_once on;
