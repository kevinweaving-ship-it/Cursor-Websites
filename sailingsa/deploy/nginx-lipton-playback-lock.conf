# MUST sit in the sailingsa.co.za server {} BEFORE any location ~ ^/regatta/
# Exact match beats the regex proxy, so API restarts cannot serve the old event page.
    location = /regatta/2026-08-29-lipton-challenge-cup {
        default_type text/html;
        add_header Cache-Control "no-store";
        alias /var/www/sailingsa/lipton-dev.html;
    }
    location = /regatta/2026-08-29-lipton-challenge-cup/ {
        default_type text/html;
        add_header Cache-Control "no-store";
        alias /var/www/sailingsa/lipton-dev.html;
    }
    location = /js/lipton-dev-playback.js {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Cache-Control "no-cache";
        etag off;
        alias /var/www/sailingsa/js/lipton-dev-playback.js;
    }
    location = /js/lipton-dev-playback-dk.js {
        add_header Cache-Control "no-store, must-revalidate";
        alias /var/www/sailingsa/js/lipton-dev-playback-dk.js;
    }
    location = /js/lipton-dev-playback-dl.js {
        add_header Cache-Control "no-store, must-revalidate";
        alias /var/www/sailingsa/js/lipton-dev-playback-dl.js;
    }
