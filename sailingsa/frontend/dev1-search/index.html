<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Search SailingSA — Dev1</title>
<style>
:root{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0b1732;background:#fff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e7ebf1;padding:calc(10px + env(safe-area-inset-top)) 12px 12px}
.searchbar{height:50px;display:flex;align-items:center;gap:10px;max-width:900px;margin:auto}
.back,.clear,.search-icon{border:0;background:none;display:grid;place-items:center;flex:none;cursor:pointer}.back{font-size:28px;width:35px}.search-icon{border-radius:50%;width:44px;height:44px;background:#e8ebf0}
.searchbox{background:#eef0f3;border-radius:30px;display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0 15px;height:48px}
.searchbox svg{width:22px;height:22px;flex:none}.searchbox input{border:0;outline:none;background:none;min-width:0;width:100%;color:#111;font-size:17px}.clear{width:27px;height:27px;border-radius:50%;background:#707780;color:#fff;font-size:18px}
.results{max-width:900px;margin:4px auto;padding-bottom:25px}.item{display:flex;align-items:center;height:70px;gap:12px;padding:8px 15px;text-decoration:none;color:inherit;overflow:hidden;cursor:pointer}
.item:hover,.item:focus-visible{background:#f2f5f9;outline:0}.avatar{height:48px;width:48px;flex:none;border-radius:50%;object-fit:cover;background:#edf0f4}
.identity{min-width:0;flex:0 1 auto;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:51%}
.logos{margin-left:auto;display:flex;align-items:center;gap:7px;flex:1 1 auto;min-width:35px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x}.logos::-webkit-scrollbar{display:none}
.logos img{width:35px;height:35px;object-fit:contain;flex:none}.item+.item{border-top:1px solid #f1f2f4}.hint{color:#697386;font-size:14px;padding:18px 17px}
@media(max-width:430px){.identity{max-width:44%;font-size:15px}.item{gap:8px;padding:7px 10px}.avatar{width:44px;height:44px}.logos img{width:30px;height:30px;gap:5px}}
</style></head><body>
<header class="top"><div class="searchbar"><button class="back" type="button" aria-label="Back" onclick="history.length>1?history.back():location.assign('/')">‹</button><div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="#66717f" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search SailingSA" aria-label="Search SailingSA"><button id="clear" class="clear" type="button" aria-label="Clear search" hidden>×</button></div></div></header>
<main id="results" class="results" role="list" aria-live="polite"><p class="hint">Search sailors, clubs, classes and events.</p></main>
<script>
(()=>{'use strict';
const input=document.getElementById('q'),area=document.getElementById('results'),clear=document.getElementById('clear');
let generation=0, timer=0, controller=null;const cardCache=new Map();let classCache=null,clubCache=null,eventCache=null;
const urlPath=(p)=>p&&p.startsWith('/')&&!p.startsWith('//')?p:'';
const txt=(o,...keys)=>{for(const k of keys){const v=o&&o[k];if(typeof v==='string'&&v.trim())return v.trim()}return ''};
const make=(tag,cls)=>{let e=document.createElement(tag);if(cls)e.className=cls;return e};
function img(src,cls,alt){if(!src)return null;const e=make('img',cls);e.src=urlPath(src)||(/^(https?:\/\/)/.test(src)?src:'');if(!e.src)return null;e.alt=alt||'';e.loading='lazy';e.onerror=()=>e.remove();return e}
function key(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function rank(label,q){const a=key(label),b=key(q);return a===b?0:a.startsWith(b)?1:a.includes(b)?2:3}
async function json(url,signal){const r=await fetch(url,{credentials:'same-origin',signal});if(!r.ok)throw Error(String(r.status));return r.json()}
function normalizeArray(d){if(Array.isArray(d))return d;if(d&&typeof d==='object'){for(const k of ['results','items','clubs','classes','data'])if(Array.isArray(d[k]))return d[k]}return []}
async function sailors(q,signal){const a=normalizeArray(await json('/api/search?q='+encodeURIComponent(q),signal));return a.map(x=>{const id=String(x.sa_sailing_id??x.sas_id??x.sa_id??'');const name=txt(x,'full_name','name')||[txt(x,'first_names','first_name'),txt(x,'surname','last_name')].filter(Boolean).join(' ');return{id,type:'sailor',name,href:urlPath(txt(x,'profile_url','url'))||('/sailor/'+encodeURIComponent(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))),row:x}}).filter(x=>x.name&&x.id)}
async function clubs(q,signal){if(!clubCache)clubCache=normalizeArray(await json('/api/clubs',signal));const a=clubCache;return a.map(x=>{const code=txt(x,'club_abbrev','club_code','code','abbreviation');const name=txt(x,'club_fullname','club_full_name','club_name','name');return{type:'club',name,href:code?'/club/'+encodeURIComponent(code.toLowerCase()):'',avatar:code?'/api/club-logo/'+encodeURIComponent(code):'',logos:[],code}}).filter(x=>x.name&&x.href&&(key(x.name).includes(key(q))||key(x.code).includes(key(q)))).slice(0,40)}
async function classes(q,signal){if(!classCache){const raw=await json('/api/classes',signal);classCache=Array.isArray(raw)?raw:(Array.isArray(raw.classes)?raw.classes:normalizeArray(raw))}
return classCache.map(x=>{if(typeof x==='string')x={name:x};const name=txt(x,'class_name','name');const id=String(x.class_id??'');const slug=txt(x,'slug','class_slug');return{type:'class',name,href:slug?'/class/'+encodeURIComponent(slug):(name?'/class/'+encodeURIComponent(name.toLowerCase().replace(/[^a-z0-9]+/g,'-')):''),avatar:txt(x,'logo_url','class_logo_url'),logos:[]}}).filter(x=>x.name&&key(x.name).includes(key(q))).slice(0,25)}
async function events(q,signal){if(!eventCache)eventCache=normalizeArray(await json('/api/events',signal));return eventCache.filter(x=>key(txt(x,'event_name','name')).includes(key(q))).slice(0,35).map(x=>({type:'event',name:txt(x,'event_name','name'),href:x.regatta_id?'/regatta/'+encodeURIComponent(x.regatta_id):'',avatar:txt(x,'event_logo_url','logo_url'),logos:[],row:x}))}
async function classLogo(row,gen){try{const info=await json('/api/class-logo/'+encodeURIComponent(row.name));if(gen!==generation||!row.el?.isConnected)return;const src=txt(info,'logo_url');if(src){const a=row.el.querySelector('.avatar');const e=img(src,'avatar',row.name);if(a&&e)a.replaceWith(e)}}catch(e){}}
async function enrich(row,gen){if(!row.id||cardCache.has(row.id)){if(cardCache.has(row.id))apply(row,cardCache.get(row.id),gen);return}
try{const r=await fetch('/dev-1?embed=1&sas_id='+encodeURIComponent(row.id),{credentials:'same-origin'});if(!r.ok)return;const doc=new DOMParser().parseFromString(await r.text(),'text/html');const avatar=doc.querySelector('.sa-approved-sailor-avatar-clip img,.sa-approved-sailor-avatar img');const club=doc.querySelector('.sa-approved-sailor-club-icon img');const assets={avatar:avatar&&avatar.getAttribute('src')||'',logos:[]};if(club&&club.getAttribute('src'))assets.logos.push({src:club.getAttribute('src'),alt:'Club'});const unique=new Set();doc.querySelectorAll('[data-ns-classes] img').forEach(el=>{let src=el.getAttribute('src');if(src&&!unique.has(src)){unique.add(src);assets.logos.push({src,alt:el.alt||'Sailing class'})}});cardCache.set(row.id,assets);apply(row,assets,gen)}catch(e){}}
function apply(row,assets,gen){if(gen!==generation||!row.el||!row.el.isConnected)return;const a=row.el.querySelector('.avatar');if(a&&assets.avatar){const next=img(assets.avatar,'avatar',row.name);if(next)a.replaceWith(next)}const strip=row.el.querySelector('.logos');if(strip){strip.replaceChildren();assets.logos.forEach(x=>{const e=img(x.src,'',x.alt);if(e)strip.append(e)})}}
function render(rows,q,gen){if(gen!==generation)return;area.replaceChildren();if(!rows.length){const p=make('p','hint');p.textContent='No results found.';area.append(p);return}
rows.forEach(r=>{const a=make('a','item');a.href=r.href||'#';a.setAttribute('role','listitem');a.setAttribute('aria-label',r.name);const avatar=img(r.avatar,'avatar',r.name);if(avatar)a.append(avatar);else{let placeholder=make('span','avatar');a.append(placeholder)}const name=make('span','identity');name.textContent=r.name;a.append(name);const logos=make('span','logos');logos.setAttribute('aria-label','Club and sailing class logos');a.append(logos);(r.logos||[]).forEach(x=>{const e=img(x.src,'',x.alt);if(e)logos.append(e)});a.addEventListener('click',e=>{if(!r.href){e.preventDefault()}});area.append(a);r.el=a});
rows.filter(r=>r.type==='sailor').slice(0,12).forEach(r=>enrich(r,gen));rows.filter(r=>r.type==='class').forEach(r=>classLogo(r,gen))}
async function search(){const q=input.value.trim(),gen=++generation;clear.hidden=!q;if(controller)controller.abort();if(q.length<2){area.replaceChildren();if(!q){const p=make('p','hint');p.textContent='Start typing to search SailingSA.';area.append(p)}return}controller=new AbortController();const signal=controller.signal;const p=make('p','hint');p.textContent='Searching…';area.replaceChildren(p);
const results=await Promise.allSettled([sailors(q,signal),clubs(q,signal),classes(q,signal),events(q,signal)]);if(gen!==generation)return;let found=[];results.forEach(r=>{if(r.status==='fulfilled')found.push(...r.value)});const seen=new Set();found=found.filter(r=>{const k=r.type+'|'+r.name+'|'+(r.id||'');if(seen.has(k))return false;seen.add(k);return true});found.sort((a,b)=>rank(a.name,q)-rank(b.name,q)||a.name.localeCompare(b.name));render(found.slice(0,30),q,gen)}
input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,170)});clear.addEventListener('click',()=>{input.value='';search();input.focus()});const initial=new URLSearchParams(location.search).get('q');if(initial)input.value=initial;search();setTimeout(()=>input.focus(),100);
})();
</script></body></html>
