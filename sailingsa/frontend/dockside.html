<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dockside Chat | SailingSA</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/dockside-chat.css?v=dockside12">
</head>
<body>
<main class="container" id="dockside-page">
    <div class="dockside-page-bar">
        <h1>Dockside Chat</h1>
        <p class="dockside-back"><a href="/">Home</a></p>
    </div>
    <p id="dockside-me" class="dockside-empty"></p>
    <div id="dockside-notes"></div>
    <form id="dockside-search-form">
        <label class="dockside-sr" for="dockside-search">Search topics</label>
        <input id="dockside-search" type="search" placeholder="Search posts" maxlength="120" autocomplete="off">
        <button type="submit">Search</button>
    </form>
    <div class="dockside-sort" role="group" aria-label="Sort topics">
        <button type="button" data-sort="updated">Updated</button>
        <button type="button" data-sort="comments">Comments</button>
    </div>
    <div id="dockside-topic-list"></div>
    <article id="dockside-thread" hidden>
        <div class="dockside-page-bar">
            <h2 id="dockside-thread-subject" class="dockside-kicker"></h2>
            <button type="button" class="dockside-mini" id="dockside-mute">Mute</button>
        </div>
        <div id="dockside-thread-posts"></div>
        <form class="dockside-compose" id="dockside-thread-form">
            <label class="dockside-sr" for="dockside-thread-body">Comment</label>
            <textarea id="dockside-thread-body" maxlength="2000" rows="2" placeholder="Write a comment"></textarea>
            <button type="submit">Comment</button>
        </form>
    </article>
    <form class="dockside-new" id="dockside-new-topic">
        <h2 class="dockside-kicker">Start a discussion</h2>
        <label for="dockside-new-body">First post</label>
        <textarea id="dockside-new-body" maxlength="2000" rows="3" required></textarea>
        <button type="submit">Start topic</button>
        <p id="dockside-new-error" class="dockside-error" role="status"></p>
    </form>
</main>
<script src="/js/dockside-chat.js?v=dockside11" defer></script>
</body>
</html>
