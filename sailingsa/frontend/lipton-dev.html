<body data-lipton-dev="1">
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo js-go-home" id="headerLogoLink" title="Home – clear search and return to sailingsa.co.za">
        <img src="/assets/logos/sailingsa-logo.png" alt="SailingSA Logo">
      </a>
      <div class="header-auth" id="headerAuth">
        <div id="loggedInStatus" style="display: none;">
          <div class="user-info">
            <span class="user-name" id="userNameDisplay"></span>
            <span class="user-sas-id" id="userSasIdDisplay"></span>
          </div>
        </div>
        <div id="loginBox" style="display: none;"></div>
      </div>
      <a href="/events-logos/lipton-challenge-cup" class="lipton-header-cup" title="Lipton Challenge Cup">
        <img src="/artwork/Event%20Logo/Lipton-Challenge-Cup-2026.png?v=20260827a" alt="Lipton Challenge Cup">
      </a>
    </div>
  </header>
  <div class="lipton-event-sheet" id="lipton-event-sheet">
    <iframe id="lipton-event-sheet-frame" title="2026 Lipton Challenge Cup results" src="about:blank"></iframe>
  </div>
  <div class="lipton-dev-shell">
    <div class="lipton-dev-subhead" id="lipton-dev-subhead">
      <div class="lipton-dev-chrome">
        <a href="/events-logos/lipton-challenge-cup" class="lipton-dev-event-logo" title="Lipton Challenge Cup">
          <img src="/js/lipton-dev-event-logo.png?v=20260828au" alt="Lipton Challenge Cup">
        </a>
        <div class="lipton-dev-map-transport">
          <div class="lipton-dev-playbox">
            <input type="range" class="lipton-dev-scrub" id="lipton-dev-scrub" min="0" max="1000" value="0" aria-label="Race position">
            <div class="lipton-dev-transport lipton-dev-transport--play" role="group" aria-label="Playback">
            <button type="button" class="lipton-dev-btn" id="lipton-dev-play" disabled title="Play" aria-label="Play">
              <svg class="lipton-dev-ico lipton-dev-ico--play" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 2.1v11.8L14.2 8z"/></svg>
              <svg class="lipton-dev-ico lipton-dev-ico--pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.4h3.6v11.2H3zm6.4 0H13v11.2H9.4z"/></svg>
            </button>
            <button type="button" class="lipton-dev-btn" id="lipton-dev-slower" title="Slower" aria-label="Slower">
              <svg class="lipton-dev-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8.4 2.4 1.6 8l6.8 5.6V2.4zm6.5 0L8.1 8l6.8 5.6V2.4z"/></svg>
            </button>
            <span class="lipton-dev-play-rate" id="lipton-dev-rate">1×</span>
            <button type="button" class="lipton-dev-btn" id="lipton-dev-faster" title="Faster" aria-label="Faster">
              <svg class="lipton-dev-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.1 2.4v11.2L7.9 8zm6.5 0v11.2L14.4 8z"/></svg>
            </button>
          </div>
          </div>
        </div>
        <div class="lipton-dev-race-boxes" id="lipton-dev-race-boxes" role="group" aria-label="Races"></div>
      </div>
      <div class="lipton-dev-map-hud" id="lipton-dev-map-hud">
        <div class="lipton-dev-map-hud-name" id="lipton-dev-map-hud-name"></div>
        <div class="lipton-dev-map-hud-clock" id="lipton-dev-map-hud-clock">T−0:05.0</div>
      </div>
    </div>
    <div class="lipton-dev-split">
      <div class="lipton-dev-track">
        <div id="lipton-dev-chart" role="img" aria-label="Satellite chart of Table Bay harbour"></div>
        <canvas id="lipton-dev-map" aria-label="GPS marks and tracks"></canvas>
      </div>
      <div class="fleet-section lipton-dev-board">
        <h2 class="class-header" id="lipton-dev-race-label">Race</h2>
        <div class="table-wrapper results-table-container table-container" id="lipton-dev-table-wrap">
          <table class="table fleet-results-table">
            <thead>
              <tr id="lipton-dev-thead-row">
                <th class="rank-col">Rank</th>
                <th class="wc-meta-col">Bow</th>
                <th class="boat-name-col">Boat</th>
                <th class="club-col">Club</th>
              </tr>
            </thead>
            <tbody id="lipton-dev-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
