<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Lipton Challenge Cup 2026 — playback (dev)</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/js/vendor/leaflet/leaflet.css?v=20260828ap">
  <link rel="stylesheet" href="/css/lipton-dev.css?v=20260828ap">
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
</head>
<body data-lipton-dev="1">
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo js-go-home" id="headerLogoLink" title="Home – clear search and return to sailingsa.co.za">
        <img src="/assets/logos/sailingsa-logo.png" alt="SailingSA Logo">
      </a>
      <div class="header-auth" id="headerAuth">
        <div id="loggedInStatus" style="display: none;">
          <div class="user-info">
            <span class="user-name" id="userNameDisplay"></span>
            <span class="user-sas-id" id="userSasIdDisplay"></span>
          </div>
        </div>
        <div id="loginBox" style="display: none;"></div>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <span class="menu-icon"></span>
      </button>
    </div>
    <nav id="navMenuOverlay" class="nav-menu-overlay" aria-hidden="true" style="display:none;">
      <a href="/">Sailor</a>
      <a href="/" data-mode="regatta">Regatta</a>
      <a href="/about">About</a>
    </nav>
  </header>
  <div class="lipton-dev-subhead" id="lipton-dev-subhead">
    <div class="lipton-dev-zoom" role="group" aria-label="Map zoom">
      <button type="button" id="lipton-dev-zoom-in" title="Zoom in">+</button>
      <button type="button" id="lipton-dev-zoom-out" title="Zoom out">−</button>
    </div>
    <a href="/events-logos/lipton-challenge-cup" class="lipton-dev-event-logo" title="Lipton Challenge Cup">
      <img src="/js/lipton-dev-event-logo.png?v=20260828ae" alt="Lipton Challenge Cup">
    </a>
    <div class="lipton-dev-map-transport">
      <input type="range" class="lipton-dev-scrub" id="lipton-dev-scrub" min="0" max="1000" value="0" aria-label="Race position">
      <div class="lipton-dev-transport lipton-dev-transport--play" role="group" aria-label="Playback">
        <button type="button" class="lipton-dev-btn" id="lipton-dev-play" disabled title="Play">▶</button>
        <button type="button" class="lipton-dev-btn" id="lipton-dev-slower" title="Slower">‹</button>
        <span class="lipton-dev-play-rate" id="lipton-dev-rate">1×</span>
        <button type="button" class="lipton-dev-btn" id="lipton-dev-faster" title="Faster">›</button>
      </div>
    </div>
    <div class="lipton-dev-map-hud" id="lipton-dev-map-hud">
      <div class="lipton-dev-map-hud-name" id="lipton-dev-map-hud-name"></div>
      <div class="lipton-dev-map-hud-clock" id="lipton-dev-map-hud-clock">T−0:05.0</div>
    </div>
  </div>

  <div class="lipton-dev-shell">
    <div class="lipton-dev-split">
      <div class="lipton-dev-track">
        <div id="lipton-dev-chart" role="img" aria-label="Satellite chart of Table Bay harbour"></div>
        <canvas id="lipton-dev-map" aria-label="GPS marks and tracks"></canvas>
      </div>
      <div class="fleet-section lipton-dev-board">
        <div class="class-header class-header--with-logos">
          <div class="class-header-logo-col">
            <a href="/events-logos/lipton-challenge-cup" class="regatta-header-logo-link" title="Lipton Challenge Cup">
              <img src="/artwork/Event%20Logo/Lipton-Challenge-Cup-2026.png?v=20260827a" alt="Lipton Challenge Cup" class="class-header-logo-img">
            </a>
          </div>
          <div class="class-header-main-col">
            <div class="fleet-header-title-wrap"><a href="/class/j22">J22 Fleet</a></div>
            <div class="lipton-dev-transport" id="lipton-dev-races" role="group" aria-label="Race">
              <button type="button" class="lipton-dev-btn" data-race="1">R1</button>
              <button type="button" class="lipton-dev-btn" data-race="2">R2</button>
              <button type="button" class="lipton-dev-btn" data-race="3">R3</button>
              <button type="button" class="lipton-dev-btn" data-race="4">R4</button>
              <button type="button" class="lipton-dev-btn" data-race="5">R5</button>
            </div>
            <div class="sailed-line" id="lipton-dev-sailed">Loading tracker…</div>
            <div class="sailed-line" id="lipton-dev-clock">0:00</div>
          </div>
          <div class="class-header-club-logo-col">
            <a href="/class/j22" class="regatta-header-logo-link" title="Open J22 class page">
              <img src="/artwork/Class%20Logo/J22-Class-Logo.png?v=20260827a" alt="J22" class="class-header-logo-img">
            </a>
          </div>
        </div>
        <div class="table-wrapper results-table-container table-container" id="lipton-dev-table-wrap" hidden>
          <table class="table fleet-results-table">
            <thead>
              <tr id="lipton-dev-thead-row">
                <th class="rank-col">Rank</th>
                <th class="wc-meta-col">Bow</th>
                <th class="boat-name-col">Boat</th>
                <th class="boat-icon-col" title="Map number and boat colour"> </th>
                <th class="club-col">Club</th>
                <th class="timer-col">ST</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M1</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M2</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M3</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M4</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M1</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M2</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M3</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M4</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M1</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M2</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">M3</th>
                <th class="place-delta-col">±</th>
                <th class="timer-col">Fin</th>
              </tr>
            </thead>
            <tbody id="lipton-dev-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/vendor/leaflet/leaflet.js?v=20260828ap"></script>
  <script src="/js/lipton-dev-playback.js?v=20260828ap"></script>
</body>
</html>
