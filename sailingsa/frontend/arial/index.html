<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Arial</title>
    <link rel="stylesheet" href="/arial/arial.css?v=7">
</head>
<body>
    <img class="logo" src="/arial/logo.png" alt="Aerial Networks">
    <div class="pad">
        <img class="keypad" src="/arial/keypad.png" alt="">
        <div class="lcd" aria-live="polite">
            <div id="lcd-top">
                <span id="lcd-site">HANSEKOP</span>
                <span id="lcd-when"><span id="lcd-date"></span> <span id="lcd-time"></span></span>
            </div>
            <div id="lcd-2"></div>
        </div>
        <div class="led ac" id="led-ac" title="AC"></div>
        <div class="led status" id="led-status" title="STATUS"></div>
        <button type="button" class="hot" data-key="STAY" style="left:28.6%;top:37.2%;width:10.8%;height:6.8%" aria-label="STAY"></button>

        <button type="button" class="hot" data-key="ACC" style="left:61.0%;top:45.4%;width:10.8%;height:6.8%" aria-label="ACC"></button>
        <button type="button" class="hot" data-key="UP" style="left:84.2%;top:37.2%;width:9.4%;height:6.8%" aria-label="Up"></button>
        <button type="button" class="hot" data-key="DOWN" style="left:84.2%;top:45.4%;width:9.4%;height:6.8%" aria-label="Down"></button>
        <button type="button" class="hot" data-key="1" style="left:29.5%;top:53.4%;width:12.2%;height:7.2%" aria-label="1"></button>
        <button type="button" class="hot" data-key="2" style="left:43.6%;top:53.4%;width:13.0%;height:7.2%" aria-label="2"></button>
        <button type="button" class="hot" data-key="3" style="left:58.6%;top:53.4%;width:13.2%;height:7.2%" aria-label="3"></button>
        <button type="button" class="hot" data-key="4" style="left:28.4%;top:61.8%;width:13.2%;height:7.4%" aria-label="4"></button>
        <button type="button" class="hot" data-key="5" style="left:43.6%;top:61.8%;width:13.0%;height:7.4%" aria-label="5"></button>
        <button type="button" class="hot" data-key="6" style="left:58.6%;top:61.8%;width:13.2%;height:7.4%" aria-label="6"></button>
        <button type="button" class="hot" data-key="7" style="left:28.4%;top:69.8%;width:13.2%;height:7.4%" aria-label="7"></button>
        <button type="button" class="hot" data-key="8" style="left:43.6%;top:69.8%;width:13.0%;height:7.4%" aria-label="8"></button>
        <button type="button" class="hot" data-key="9" style="left:58.6%;top:69.8%;width:13.2%;height:7.4%" aria-label="9"></button>
        <button type="button" class="hot" data-key="CLEAR" style="left:28.4%;top:78.2%;width:13.2%;height:8.0%" aria-label="CLEAR"></button>

    </div>
    <script src="/arial/app.js?v=7"></script>

</html>
