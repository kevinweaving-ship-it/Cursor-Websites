<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Arial</title>
    <link rel="stylesheet" href="/arial/arial.css?v=40">
</head>
<body>
    <div class="pad-wrap" id="pad-frame">
    <div class="pad-clip">
    <div class="pad">
        <img class="keypad" src="/arial/keypad.png" alt="">
        <div class="brand-cover" aria-hidden="true"></div>
        <img class="brand-logo" src="/arial/logo.png" alt="Aerial Networks">
        <div class="lcd" aria-live="polite">
            <div class="lcd-head">
                <span id="lcd-site">HANSEKOP</span>
                <span id="lcd-when"></span>
            </div>
            <div class="lcd-mid">
                <img id="lcd-user-logo" alt="">
                <span id="lcd-welcome"></span>
            </div>
            <div id="lcd-2"></div>
        </div>
        <div class="led status" id="led-status" title="STATUS"></div>
        <div class="led ac" id="led-ac" title="AC" hidden></div>
        <button type="button" class="hot" data-key="STAY" style="left:28.6%;top:37.2%;width:10.8%;height:6.8%" aria-label="STAY"></button>
        <button type="button" class="hot" data-key="FORCE" style="left:40.4%;top:37.2%;width:9.4%;height:6.8%" aria-label="FORCE"></button>
        <button type="button" class="hot" data-key="ARM" style="left:50.6%;top:37.2%;width:9.2%;height:6.8%" aria-label="ARM"></button>
        <button type="button" class="hot arm-toggle" id="arm-toggle" data-key="TOGGLE" style="left:61.0%;top:37.2%;width:10.8%;height:6.8%" aria-label="DISARM">
            <img id="arm-toggle-face" src="/arial/btn-disarm.png" alt="">
        </button>
        <button type="button" class="hot hot-more" data-key="BYP" style="left:28.6%;top:45.4%;width:10.8%;height:6.8%" aria-label="BYP"></button>
        <button type="button" class="hot hot-more" data-key="MEM" style="left:40.4%;top:45.4%;width:9.4%;height:6.8%" aria-label="MEM"></button>
        <button type="button" class="hot hot-more" data-key="TBL" style="left:50.6%;top:45.4%;width:9.2%;height:6.8%" aria-label="TBL"></button>
        <button type="button" class="hot hot-more" data-key="ACC" style="left:61.0%;top:45.4%;width:10.8%;height:6.8%" aria-label="ACC"></button>
        <button type="button" class="hot" data-key="UP" style="left:84.2%;top:37.2%;width:9.4%;height:6.8%" aria-label="Up"></button>
        <button type="button" class="hot hot-more" data-key="DOWN" style="left:84.2%;top:45.4%;width:9.4%;height:6.8%" aria-label="Down"></button>
        <button type="button" class="hot hot-more" data-key="1" style="left:29.5%;top:53.4%;width:12.2%;height:7.2%" aria-label="1"></button>
        <button type="button" class="hot hot-more" data-key="2" style="left:43.6%;top:53.4%;width:13.0%;height:7.2%" aria-label="2"></button>
        <button type="button" class="hot hot-more" data-key="3" style="left:58.6%;top:53.4%;width:13.2%;height:7.2%" aria-label="3"></button>
        <button type="button" class="hot hot-more" data-key="4" style="left:28.4%;top:61.8%;width:13.2%;height:7.4%" aria-label="4"></button>
        <button type="button" class="hot hot-more" data-key="5" style="left:43.6%;top:61.8%;width:13.0%;height:7.4%" aria-label="5"></button>
        <button type="button" class="hot hot-more" data-key="6" style="left:58.6%;top:61.8%;width:13.2%;height:7.4%" aria-label="6"></button>
        <button type="button" class="hot hot-more" data-key="7" style="left:28.4%;top:69.8%;width:13.2%;height:7.4%" aria-label="7"></button>
        <button type="button" class="hot hot-more" data-key="8" style="left:43.6%;top:69.8%;width:13.0%;height:7.4%" aria-label="8"></button>
        <button type="button" class="hot hot-more" data-key="9" style="left:58.6%;top:69.8%;width:13.2%;height:7.4%" aria-label="9"></button>
        <button type="button" class="hot hot-more" data-key="CLEAR" style="left:28.4%;top:78.2%;width:13.2%;height:8.0%" aria-label="CLEAR"></button>
        <button type="button" class="hot hot-more" data-key="0" style="left:43.6%;top:78.2%;width:13.0%;height:8.0%" aria-label="0"></button>
        <button type="button" class="hot hot-more" data-key="ENTER" style="left:58.6%;top:78.2%;width:13.2%;height:8.0%" aria-label="ENTER"></button>
        <audio id="pin-ok" src="/arial/pin-accepted.wav" preload="auto"></audio>
    </div>
    </div>
    <button type="button" class="logout-link" id="logout-btn" aria-label="Log Out">Log Out</button>
    </div>
    <script>
    (function () {
        var TZ = "Africa/Johannesburg";
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        function pad(n) { return String(n).padStart(2, "0"); }
        function saNow() {
            var d = new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
            return pad(d.getDate()) + " " + months[d.getMonth()] + " " + d.getFullYear() + "  " + pad(d.getHours()) + ":" + pad(d.getMinutes());
        }
        var when = document.getElementById("lcd-when");
        if (when) when.textContent = saNow();
    })();
    </script>
    <script src="/arial/app.js?v=40"></script>
</body>
</html>
