<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Arial</title>
    <link rel="stylesheet" href="/arial/arial.css?v=57">
</head>
<body>
    <div class="pad-wrap" id="pad-frame">
    <div class="pad-clip">
    <div class="pad">
        <img class="keypad" src="/arial/keypad.png?v=56" alt="">
        <div class="brand-slot">
            <img class="brand-logo" src="/arial/logo.png?v=57" alt="Aerial Networks">
        </div>
        <div class="lcd" aria-live="polite">
            <div class="lcd-head">
                <span id="lcd-site">HANSEKOP</span>
                <span id="lcd-when"></span>
            </div>
            <div class="lcd-mid">
                <img id="lcd-user-logo" alt="">
                <span id="lcd-welcome"></span>
            </div>
            <div id="lcd-2"></div>
        </div>
        <div class="logout-label" aria-hidden="true"><span>Log</span><span>Out</span></div>
        <div class="led ac on" id="led-ac" title="AC"></div>
        <div class="led status" id="led-status" title="STATUS"></div>
        <button type="button" class="hot" data-key="STAY" aria-label="STAY"></button>
        <button type="button" class="hot" data-key="FORCE" aria-label="FORCE"></button>
        <button type="button" class="hot" data-key="ARM" aria-label="ARM"></button>
        <button type="button" class="hot arm-toggle" id="arm-toggle" data-key="TOGGLE" aria-label="DISARM">
            <span id="arm-toggle-face"></span>
        </button>
        <button type="button" class="hot hot-more" data-key="BYP" aria-label="BYP"></button>
        <button type="button" class="hot hot-more" data-key="MEM" aria-label="MEM"></button>
        <button type="button" class="hot hot-more" data-key="TBL" aria-label="TBL"></button>
        <button type="button" class="hot hot-more" data-key="ACC" aria-label="ACC"></button>
        <button type="button" class="hot" data-key="UP" aria-label="Log Out"></button>
        <button type="button" class="hot hot-more" data-key="DOWN" aria-label="Down"></button>
        <button type="button" class="hot hot-more" data-key="1" aria-label="1"></button>
        <button type="button" class="hot hot-more" data-key="2" aria-label="2"></button>
        <button type="button" class="hot hot-more" data-key="3" aria-label="3"></button>
        <button type="button" class="hot hot-more" data-key="4" aria-label="4"></button>
        <button type="button" class="hot hot-more" data-key="5" aria-label="5"></button>
        <button type="button" class="hot hot-more" data-key="6" aria-label="6"></button>
        <button type="button" class="hot hot-more" data-key="7" aria-label="7"></button>
        <button type="button" class="hot hot-more" data-key="8" aria-label="8"></button>
        <button type="button" class="hot hot-more" data-key="9" aria-label="9"></button>
        <button type="button" class="hot hot-more" data-key="CLEAR" aria-label="CLEAR"></button>
        <button type="button" class="hot hot-more" data-key="0" aria-label="0"></button>
        <button type="button" class="hot hot-more" data-key="ENTER" aria-label="ENTER"></button>
        <audio id="pin-ok" src="/arial/pin-accepted.wav" preload="auto"></audio>
    </div>
    </div>
    </div>
    <script>
    (function () {
        var TZ = "Africa/Johannesburg";
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        function pad(n) { return String(n).padStart(2, "0"); }
        function saNow() {
            var d = new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
            return pad(d.getDate()) + " " + months[d.getMonth()] + " " + d.getFullYear() + "  " + pad(d.getHours()) + ":" + pad(d.getMinutes());
        }
        var when = document.getElementById("lcd-when");
        if (when) when.textContent = saNow();
    })();
    </script>
    <script src="/arial/app.js?v=57"></script>
</body>
</html>
