<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Arial</title>
    <link rel="stylesheet" href="/arial/arial.css?v=59">
</head>
<body>
    <div class="pad-wrap" id="pad-frame">
    <div class="pad-clip">
    <div class="pad">
        <svg class="shell-svg" viewBox="0 0 521 615" preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#f7f7f5"/>
                    <stop offset="0.55" stop-color="#f1f1ef"/>
                    <stop offset="1" stop-color="#e6e6e3"/>
                </linearGradient>
                <linearGradient id="capFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ecece9"/>
                    <stop offset="0.18" stop-color="#d8d8d5"/>
                    <stop offset="0.45" stop-color="#c4c4c1"/>
                    <stop offset="0.72" stop-color="#b3b3b0"/>
                    <stop offset="1" stop-color="#c9c9c6"/>
                </linearGradient>
                <linearGradient id="capSheen" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#000" stop-opacity="0.10"/>
                    <stop offset="0.35" stop-color="#fff" stop-opacity="0.18"/>
                    <stop offset="0.65" stop-color="#fff" stop-opacity="0.08"/>
                    <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
                </linearGradient>
                <linearGradient id="bezelFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#d8d8d5"/>
                    <stop offset="1" stop-color="#b4b4b0"/>
                </linearGradient>
                <linearGradient id="recessFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#e4e6e8"/>
                    <stop offset="1" stop-color="#eef0f2"/>
                </linearGradient>
                <filter id="bodyShadow" x="-8%" y="-4%" width="116%" height="116%">
                    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.16"/>
                </filter>
            </defs>
            <path class="shell-body" filter="url(#bodyShadow)" fill="url(#bodyFill)" stroke="#c8c8c5" stroke-width="1.2"
                d="M38 10 H483 Q513 10 513 44 V558 Q513 605 468 605 H53 Q8 605 8 558 V44 Q8 10 38 10 Z"/>
            <path class="shell-cap" fill="url(#capFill)"
                d="M18 46 C18 14 72 6 158 6 H363 C449 6 503 14 503 46 V166 C492 196 404 208 260.5 210 C117 208 29 196 18 166 Z"/>
            <path class="shell-cap" fill="url(#capSheen)"
                d="M18 46 C18 14 72 6 158 6 H363 C449 6 503 14 503 46 V166 C492 196 404 208 260.5 210 C117 208 29 196 18 166 Z"/>
            <rect class="lcd-frame" x="50" y="62" width="421" height="117" rx="8" fill="url(#bezelFill)" stroke="#a3a39f" stroke-width="1.1"/>
            <rect class="lcd-well" x="59" y="74" width="401" height="96" rx="5" fill="#15155a"/>
            <rect class="shell-recess" x="122" y="214" width="276" height="328" rx="12" fill="url(#recessFill)" stroke="#d0d2d4" stroke-width="0.8"/>
            <path class="shell-cover" fill="#f1f1ef" stroke="#d4d4d1" stroke-width="0.8"
                d="M70 548 H451 Q505 548 505 575 V590 Q505 605 468 605 H53 Q8 605 8 590 V575 Q8 548 70 548 Z"/>
        </svg>
        <div class="brand-slot">
            <img class="brand-logo" src="/arial/logo.png?v=59" alt="Aerial Networks">
        </div>
        <div class="lcd" aria-live="polite">
            <div class="lcd-head">
                <span id="lcd-site">HANSEKOP</span>
                <span id="lcd-when"></span>
            </div>
            <div class="lcd-mid">
                <img id="lcd-user-logo" alt="">
                <span id="lcd-welcome"></span>
            </div>
            <div id="lcd-2"></div>
        </div>
        <div class="logout-label" aria-hidden="true"><span>Log</span><span>Out</span></div>
        <div class="led ac on" id="led-ac" title="AC"></div>
        <div class="led-mark ac-wave" aria-hidden="true">~</div>
        <div class="led status" id="led-status" title="STATUS"></div>
        <div class="led-mark status-word" aria-hidden="true">STATUS</div>
        <button type="button" class="hot key-fn" data-key="STAY" aria-label="STAY"><span class="key-label">STAY</span></button>
        <button type="button" class="hot key-fn" data-key="FORCE" aria-label="FORCE"><span class="key-label">FORCE</span></button>
        <button type="button" class="hot key-fn" data-key="ARM" aria-label="ARM"><span class="key-label">ARM</span></button>
        <button type="button" class="hot key-fn arm-toggle mode-disarm" id="arm-toggle" data-key="TOGGLE" aria-label="DISARM">
            <span class="key-label" id="arm-toggle-face">DISARM</span>
        </button>
        <button type="button" class="hot key-fn hot-more" data-key="BYP" aria-label="BYP"><span class="key-label">BYP</span></button>
        <button type="button" class="hot key-fn hot-more" data-key="MEM" aria-label="MEM"><span class="key-label">MEM</span></button>
        <button type="button" class="hot key-fn hot-more" data-key="TBL" aria-label="TBL"><span class="key-label">TBL</span></button>
        <button type="button" class="hot key-fn hot-more" data-key="ACC" aria-label="ACC"><span class="key-label">ACC</span></button>
        <button type="button" class="hot key-arrow" data-key="UP" aria-label="Log Out"><span class="key-arrow-icon" aria-hidden="true"></span></button>
        <button type="button" class="hot key-arrow hot-more" data-key="DOWN" aria-label="Down"><span class="key-arrow-icon down" aria-hidden="true"></span></button>
        <span class="sublab sublab-areas">AREAS</span>
        <button type="button" class="hot key-num hot-more" data-key="1" aria-label="1"><span class="key-label">1</span></button>
        <button type="button" class="hot key-num hot-more" data-key="2" aria-label="2"><span class="key-label">2</span></button>
        <button type="button" class="hot key-num hot-more" data-key="3" aria-label="3"><span class="key-label">3</span></button>
        <span class="sublab sublab-instant">INSTANT</span>
        <span class="sublab sublab-display">DISPLAY</span>
        <button type="button" class="hot key-num hot-more" data-key="4" aria-label="4"><span class="key-label">4</span></button>
        <button type="button" class="hot key-num hot-more" data-key="5" aria-label="5"><span class="key-label">5</span></button>
        <button type="button" class="hot key-num hot-more" data-key="6" aria-label="6"><span class="key-label">6</span></button>
        <span class="sublab sublab-event">EVENT</span>
        <span class="sublab sublab-test">TEST</span>
        <span class="sublab sublab-chime">CHIME</span>
        <button type="button" class="hot key-num hot-more" data-key="7" aria-label="7"><span class="key-label">7</span></button>
        <button type="button" class="hot key-num hot-more" data-key="8" aria-label="8"><span class="key-label">8</span></button>
        <button type="button" class="hot key-num hot-more" data-key="9" aria-label="9"><span class="key-label">9</span></button>
        <span class="sublab sublab-prg">PRG</span>
        <button type="button" class="hot key-fn hot-more" data-key="CLEAR" aria-label="CLEAR"><span class="key-label">CLEAR</span></button>
        <button type="button" class="hot key-num hot-more" data-key="0" aria-label="0"><span class="key-label">0</span></button>
        <button type="button" class="hot key-fn hot-more" data-key="ENTER" aria-label="ENTER"><span class="key-label">ENTER</span></button>
        <audio id="pin-ok" src="/arial/pin-accepted.wav" preload="auto"></audio>
    </div>
    </div>
    </div>
    <script>
    (function () {
        var TZ = "Africa/Johannesburg";
        var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        function pad(n) { return String(n).padStart(2, "0"); }
        function saNow() {
            var d = new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
            return pad(d.getDate()) + " " + months[d.getMonth()] + " " + d.getFullYear() + "  " + pad(d.getHours()) + ":" + pad(d.getMinutes());
        }
        var when = document.getElementById("lcd-when");
        if (when) when.textContent = saNow();
    })();
    </script>
    <script src="/arial/app.js?v=59"></script>
</body>
</html>
