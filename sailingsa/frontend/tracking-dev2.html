<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- tracking-dev2: Sailfish-shaped replay shell; Lipton R1–R10 fallback sample -->
  <title>SF-TrajX dev2 — 2026 Lipton Challenge Cup | SailingSA</title>
  <meta property="og:site_name" content="SailingSA">
  <meta property="og:type" content="website">
  <meta property="og:title" content="2026 Lipton — Tracking Dev2 | SailingSA">
  <meta property="og:description" content="Replay tracking dev2: Lipton Challenge Cup R1–R10 sample races.">
  <meta property="og:url" content="https://sailingsa.co.za/regatta/2026-08-29-lipton-challenge-cup-dev2">
  <meta property="og:image" content="https://sailingsa.co.za/api/og/regatta/2026-08-29-lipton-challenge-cup/ea4ca8b2a84b036d.png">
  <meta property="og:image:secure_url" content="https://sailingsa.co.za/api/og/regatta/2026-08-29-lipton-challenge-cup/ea4ca8b2a84b036d.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="2026 Lipton — Tracking Dev2 | SailingSA">
  <meta name="twitter:description" content="Replay tracking dev2: Lipton Challenge Cup R1–R10 sample races.">
  <meta name="twitter:image" content="https://sailingsa.co.za/api/og/regatta/2026-08-29-lipton-challenge-cup/ea4ca8b2a84b036d.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/js/vendor/leaflet/leaflet.css?v=20260828dk">
  <link rel="stylesheet" href="/css/tracking-dev2.css?v=dev2v18">
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
</head>
<body data-lipton-dev="1" data-tracking-dev2="1">
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo js-go-home" id="headerLogoLink" title="Home – clear search and return to sailingsa.co.za">
        <img src="/assets/logos/sailingsa-logo.png" alt="SailingSA Logo">
      </a>
      <div class="header-auth" id="headerAuth">
        <div id="loggedInStatus" style="display: none;">
          <div class="user-info">
            <span class="user-name" id="userNameDisplay"></span>
            <span class="user-sas-id" id="userSasIdDisplay"></span>
          </div>
        </div>
        <div id="loginBox" style="display: none;"></div>
      </div>
      <a href="/events-logos/lipton-challenge-cup" class="lipton-header-cup" title="Lipton Challenge Cup">
        <img src="/artwork/Event%20Logo/Lipton-Challenge-Cup-2026.png?v=20260827a" alt="Lipton Challenge Cup">
      </a>
    </div>
  </header>
  <div class="lipton-dev-shell">
    <div class="tracking-dev2-sailfish-bar card" id="tracking-dev2-sailfish-bar">
      <div class="tracking-dev2-sailfish-brand">
        <span class="tracking-dev2-sailfish-logo">SF-TrajX</span>
        <span class="tracking-dev2-sailfish-sub">Sailfish open_trac · dev2</span>
      </div>
      <span class="tracking-dev2-sailfish-mode tracking-dev2-sailfish-mode--replay" id="tracking-dev2-sailfish-mode">REPLAY</span>
      <span class="tracking-dev2-sailfish-meta" id="tracking-dev2-sailfish-meta">Lipton R1–R10 sample · status 99</span>
      <span class="tracking-dev2-sailfish-flags" id="tracking-dev2-sailfish-flags" aria-label="Sailfish viewConfig flags"></span>
      <div class="tracking-dev2-wind-compass" id="tracking-dev2-wind-compass" title="Wind compass (Sailfish viewConfig)" aria-hidden="true">W</div>
    </div>
    <div class="lipton-dev-split tracking-dev2-split">
      <div class="lipton-dev-track tracking-dev2-map-first">
        <div id="lipton-dev-chart" role="img" aria-label="Satellite chart of Table Bay harbour"></div>
        <canvas id="lipton-dev-map" aria-label="GPS marks and tracks"></canvas>
        <div class="lipton-dev-map-hud tracking-dev2-course-hud" id="lipton-dev-map-hud">
          <div class="lipton-dev-map-hud-name" id="lipton-dev-map-hud-name"></div>
        </div>
        <div class="lipton-dev-race-boxes tracking-dev2-race-rail" id="lipton-dev-race-boxes" role="group" aria-label="Races"></div>
        <button type="button" class="tracking-dev2-cam-btn" id="tracking-dev2-cam-btn" title="Recenter camera on fleet">
          <span class="tracking-dev2-cam-btn-ring" aria-hidden="true"></span>
          <span class="tracking-dev2-cam-btn-core" aria-hidden="true">↻</span>
        </button>
        <aside class="fleet-section lipton-dev-board tracking-dev2-ranking" id="tracking-dev2-ranking" aria-label="Ranking board">
          <div class="tracking-dev2-ranking-head">
            <h2 class="class-header" id="lipton-dev-race-label">Ranking board</h2>
            <button type="button" class="tracking-dev2-ranking-hide" id="tracking-dev2-ranking-hide" title="Hide ranking board">×</button>
          </div>
          <p id="lipton-dev-checksum"></p>
          <div class="table-wrapper results-table-container table-container" id="lipton-dev-table-wrap">
            <table class="table fleet-results-table tracking-dev2-rank-table">
              <thead>
                <tr id="lipton-dev-thead-row">
                  <th class="rank-col">R</th>
                  <th class="wc-meta-col">Bow</th>
                  <th class="boat-name-col">Team</th>
                  <th class="club-col">Club</th>
                  <th class="timer-col"><span class="ld-mark-lab">ST</span></th>
                </tr>
              </thead>
              <tbody id="lipton-dev-tbody">
                <tr><td colspan="5">Loading Sailfish replay…</td></tr>
              </tbody>
            </table>
          </div>
        </aside>
        <div class="tracking-dev2-dock" id="lipton-dev-subhead">
          <div class="lipton-dev-map-transport">
            <div class="lipton-dev-playbox">
              <input type="range" class="lipton-dev-scrub" id="lipton-dev-scrub" min="0" max="1000" value="0" aria-label="Race position">
              <div class="lipton-dev-transport lipton-dev-transport--play" role="group" aria-label="Playback">
                <button type="button" class="lipton-dev-btn" id="lipton-dev-play" disabled title="Play" aria-label="Play">
                  <svg class="lipton-dev-ico lipton-dev-ico--play" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 2.1v11.8L14.2 8z"/></svg>
                  <svg class="lipton-dev-ico lipton-dev-ico--pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.4h3.6v11.2H3zm6.4 0H13v11.2H9.4z"/></svg>
                </button>
                <button type="button" class="lipton-dev-btn" id="lipton-dev-slower" title="Slower" aria-label="Slower">
                  <svg class="lipton-dev-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8.4 2.4 1.6 8l6.8 5.6V2.4zm6.5 0L8.1 8l6.8 5.6V2.4z"/></svg>
                </button>
                <span class="lipton-dev-play-rate" id="lipton-dev-rate">1×</span>
                <button type="button" class="lipton-dev-btn" id="lipton-dev-faster" title="Faster" aria-label="Faster">
                  <svg class="lipton-dev-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.1 2.4v11.2L7.9 8zm6.5 0v11.2L14.4 8z"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="tracking-dev2-replay-clock" aria-live="polite">
            <span class="tracking-dev2-replay-clock-label">REPLAY</span>
            <div class="lipton-dev-map-hud-clock" id="lipton-dev-map-hud-clock">00:00:00.0</div>
            <span class="tracking-dev2-replay-clock-units">HRS · MIN · SEC</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/vendor/leaflet/leaflet.js?v=20260828dk"></script>
  <script src="/js/tracking-dev2-sailfish.js?v=dev2v18"></script>
  <script src="/js/tracking-dev2-playback.js?v=dev2v18"></script>
</body>
</html>
