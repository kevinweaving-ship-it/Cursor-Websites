    function schedule() {
        if (queued) return;
        queued = true;
        Promise.resolve().then(function(){ queued=false; enforceAll(); })
            .catch(function(){ queued=false; try{enforceAll();}catch(_){} });
    }
    // boot
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', schedule, { once:true });
    } else {
        schedule();
    }
    window.addEventListener('load', schedule, { once:true, passive:true });
    window.addEventListener('scroll', schedule, { passive:true });
    window.addEventListener('resize', schedule, { passive:true });
    // Watch DOM mutations (new nodes / style / class / id changes) → re-enforce instantly
    try {
        if (typeof MutationObserver === 'function') {
            var mo = new MutationObserver(function(muts){
                schedule();
            });
            mo.observe(document.documentElement, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['style','class','id','role']
            });
        }
    } catch(_) {}
    // MutationObserver + load/scroll/resize only — no 250ms poll.
})();
</script>
