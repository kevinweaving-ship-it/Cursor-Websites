<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aerial Networks</title>
  <meta name="description" content="Aerial Networks. This site is https://aerialnet.co.za/.">
  <meta name="theme-color" content="#f4f7fb">
  <link rel="canonical" href="https://aerialnet.co.za/">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="/artwork/aerial-networks-logo-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="/artwork/aerial-networks-logo-mark.png">
  <style>
    :root {
      --ink: #02377d;
      --muted: #3a5168;
      --line: #d5e0ea;
      --paper: #f4f7fb;
      --card: #ffffff;
      --blue: #02377d;
      --orange: #f96e05;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    a { color: var(--blue); }
    .wrap {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
    }
    .logo {
      display: block;
      width: min(100%, 420px);
      height: auto;
    }
    .lock {
      margin-left: auto;
      font-size: 0.85rem;
      color: var(--blue);
      background: #e7eef6;
      border-radius: 999px;
      padding: 8px 12px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
    }
    h1 {
      margin: 28px 0 8px;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .lead {
      margin: 0 0 28px;
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 36rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .card p { margin: 0 0 16px; color: var(--muted); }
    .mail {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 10px 16px;
      background: var(--orange);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }
    .mail:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }
    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" src="/artwork/aerial-networks-logo.png" width="1942" height="809" alt="Aerial Networks">
      <div class="lock">HTTPS</div>
    </header>
    <h1>Aerial Networks</h1>
    <p class="lead">This is the Aerial Networks website at aerialnet.co.za.</p>
    <section class="card">
      <h2>Contact</h2>
      <p>Email Aerial Networks at the address below.</p>
      <a class="mail" href="mailto:kevin@aerialnet.co.za">kevin@aerialnet.co.za</a>
    </section>
    <footer>Aerial Networks · https://aerialnet.co.za/</footer>
  </div>
</body>
</html>
