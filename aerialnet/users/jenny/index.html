  <link rel="stylesheet" href="/users/user.css?v=7">
  <script>
  (function () {
    var slug = "jenny";
    var user = null;
    try { user = JSON.parse(localStorage.getItem("arialUser") || "null"); } catch (e) {}
    var url = user && user.url ? String(user.url) : "";
    var match = /\/users\/([^/]+)/.exec(url);
    if (!user || !match || match[1] !== slug) location.replace("/");
  })();
  </script>
</head>

      </div>
    </div>
  </header>
  <main class="page">
