# Include inside the aerialnet.co.za HTTPS server (Mail-in-a-Box).
# Static /hansekop /voelklip /arial are served from this box.
# Until /etc/aerialnet-olarm.env is copied from Sailing, API calls go to the
# live Sailing keypad APIs so these URLs stay fully functional. Local
# uvicorn on :8003/:8004 stays installed for the later cutover.
# Cams stay on the Sailing box (hard-coded sailingsa.co.za:8443 / :8444).

location ^~ /api/arial/ {
    proxy_pass https://sailingsa.co.za;
    proxy_ssl_server_name on;
    proxy_ssl_name sailingsa.co.za;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host sailingsa.co.za;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cookie_domain sailingsa.co.za aerialnet.co.za;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location ^~ /api/voelklip/ {
    proxy_pass https://sailingsa.co.za;
    proxy_ssl_server_name on;
    proxy_ssl_name sailingsa.co.za;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host sailingsa.co.za;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_cookie_domain sailingsa.co.za aerialnet.co.za;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
