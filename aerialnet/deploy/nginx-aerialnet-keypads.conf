# Include inside the aerialnet.co.za HTTPS server (Mail-in-a-Box).
# Static /hansekop /voelklip /arial are served from this box.
# Keypad APIs stay on this box: Hansekop uvicorn :8003, Voëlklip uvicorn :8004.
# The app routes are /api/arial/ on both processes. /api/voelklip/ is rewritten
# onto the Voëlklip process. Do not proxy these to sailingsa.co.za.
# Account pages are private to the logged-in Aerialnet user.
# Sailing SA keeps its own WhatsApp and the HYC club Hikvision camera. Do not move those here.

location ^~ /users/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ =404;
}

location ^~ /api/arial/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location ^~ /api/voelklip/ {
    proxy_pass http://127.0.0.1:8004/api/arial/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
