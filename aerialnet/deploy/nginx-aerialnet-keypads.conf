# Official Mail-in-a-Box extra nginx for aerialnet.co.za.
# Install as /home/user-data/www/aerialnet.co.za.conf
# MIAB includes this file whenever it regenerates local.conf. Do not edit local.conf.
# Keypad APIs stay on this box: Hansekop :8003, Voëlklip :8004.

location ^~ /users/ {
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ =404;
}

location ^~ /api/arial/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location ^~ /api/voelklip/ {
    proxy_pass http://127.0.0.1:8004/api/arial/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
